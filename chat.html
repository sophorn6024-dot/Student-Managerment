<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សារសន្ទនា - KrouDigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background: #05131b;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
      display: inline-block;
    }

    /* ============ 1. TOP NAVBAR ============ */
    .top-navbar {
      height: 48px;
      padding: 0 16px;
      background: #06151e;
      border-bottom: 1px solid #0d222e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-navbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #94a3b8;
    }
    .user-pill-tag {
      background: #0e202c;
      border: 1px solid #162f40;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .icon-btn:hover { color: #f8fafc; }

    /* ============ 2. FLOATING ROOM HEADER ============ */
    .room-header-wrap {
      padding: 10px 16px 6px 16px;
      flex-shrink: 0;
    }
    .room-header-card {
      background: #0e202c;
      border: 1px solid #162f40;
      border-radius: 9999px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .room-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .room-arrow-btn {
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .room-badge-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .room-badge-logo svg {
      width: 22px;
      height: 22px;
    }
    .room-title-text {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.2px;
    }
    .room-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #94a3b8;
    }

    /* ============ 3. CHAT MESSAGES BODY ============ */
    .chat-messages {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #132a38; border-radius: 4px; }

    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 86%;
      align-items: flex-start;
    }
    .msg-group.incoming { align-self: flex-start; }
    .msg-group.outgoing { align-self: flex-end; flex-direction: row-reverse; }

    /* Avatars */
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13.5px;
      color: #ffffff;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .msg-avatar.purple-s { background: #9333ea; }  /* S Avatar ដូចរូប */
    .msg-avatar.green-l  { background: #059669; }  /* ល Avatar ដូចរូប */

    .msg-content-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    
    /* Sender Label */
    .msg-sender-label {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.3;
    }
    .msg-sender-label.owner-gold { color: #facc15; } /* ពណ៌លឿងមាសសម្រាប់ Owner ដូចរូប */
    .msg-sender-label.teacher-grey { color: #94a3b8; } /* ពណ៌ប្រផេះសម្រាប់គ្រូ */
    .msg-group.outgoing .msg-sender-label { text-align: right; color: #38bdf8; }

    /* Bubble */
    .msg-bubble {
      background: #11222e;
      border: 1px solid #162f40;
      border-radius: 14px;
      border-top-left-radius: 3px;
      padding: 9px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #e2e8f0;
      word-break: break-word;
      position: relative;
    }
    .msg-group.outgoing .msg-bubble {
      background: #0d3856;
      border-color: #175480;
      border-top-left-radius: 14px;
      border-top-right-radius: 3px;
    }

    .msg-bubble a {
      color: #38bdf8;
      text-decoration: underline;
      word-break: break-all;
    }

    /* Timestamp inside bubble */
    .msg-time {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 3px;
      text-align: right;
    }
    .msg-group.outgoing .msg-time { color: #94a3b8; }

    .chat-img-thumb {
      max-width: 250px;
      max-height: 250px;
      border-radius: 8px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }
    .chat-audio-player {
      width: 220px;
      height: 34px;
      margin-top: 4px;
      outline: none;
    }

    /* ============ 4. BOTTOM INPUT CAPSULE ============ */
    .chat-bottom-bar {
      padding: 8px 16px 14px 16px;
      flex-shrink: 0;
    }
    .input-capsule {
      background: #0e202c;
      border: 1px solid #183345;
      border-radius: 9999px;
      padding: 4px 6px 4px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .input-capsule:focus-within {
      border-color: #0284c7;
    }

    /* 3 Icons on the left: Emoji, Video, Gallery */
    .left-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
    }
    .left-action-btn {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 50%;
      transition: color 0.15s;
    }
    .left-action-btn:hover { color: #38bdf8; }

    .chat-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13.5px;
      padding: 6px 2px;
    }
    .chat-input-field::placeholder {
      color: #64748b;
    }

    /* Right Round Cyan Action Button (Mic / Send) */
    .right-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0284c7;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .right-circle-btn:hover {
      background: #0369a1;
      transform: scale(1.03);
    }
    .right-circle-btn.recording {
      background: #ef4444;
      animation: pulseRec 1s infinite;
    }
    @keyframes pulseRec {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .recording-banner {
      display: none;
      align-items: center;
      gap: 8px;
      color: #ef4444;
      font-size: 12.5px;
      font-weight: 700;
      flex: 1;
    }

    /* Loading Overlay */
    .loading-gate {
      position: fixed; inset: 0; background: #05131b;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 100; gap: 12px;
    }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 🔒 ផ្ទាំងត្រួតពិនិត្យគណនីពេលទើបបើក -->
  <div class="loading-gate" id="loadingGate">
    <div class="loading-spinner"></div>
    <div style="font-size: 13px; color: #38bdf8; font-weight: 600;">🔒 កំពុងផ្ទៀងផ្ទាត់គណនី...</div>
  </div>

  <!-- 1. TOP NAVBAR -->
  <header class="top-navbar">
    <div class="nav-back-link" onclick="history.back()">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>សារសន្ទនា</span>
    </div>

    <div class="top-navbar-right">
      <div class="user-pill-tag" id="userBadge" style="display:none;">
        <span id="userBadgeName">...</span>
        <button onclick="handleLogout()" title="ចាកចេញ" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">✕</button>
      </div>

      <button class="icon-btn" title="ប្ដូរពន្លឺ">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>

      <button class="icon-btn" title="ការជូនដំណឹង">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 2. FLOATING ROOM HEADER -->
  <div class="room-header-wrap">
    <div class="room-header-card">
      <div class="room-left">
        <span class="room-arrow-btn" onclick="history.back()" title="ថយក្រោយ">
          <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </span>

        <div class="room-badge-logo">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#0284c7" stroke-width="2"/>
            <path d="M8 12l3 3 5-5" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <span class="room-title-text" id="roomTitle">ក្រុមពិគ្រោះ និងដោះស្រាយចម្ងល់</span>
      </div>

      <div class="room-right">
        <button class="icon-btn" title="ស្វែងរកសារ">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <button class="icon-btn" title="សមាជិកក្រុម">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. CHAT MESSAGES BODY -->
  <div class="chat-messages" id="chatBox">
    <div style="text-align:center; padding:30px; color:#64748b;">⏳ កំពុងទាញយកសារ...</div>
  </div>

  <!-- 4. BOTTOM INPUT CAPSULE -->
  <div class="chat-bottom-bar">
    <div class="input-capsule">
      
      <div class="left-actions">
        <!-- 1. Emoji Icon -->
        <button class="left-action-btn" title="Emoji">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>

        <!-- 2. Video Camera Icon -->
        <button class="left-action-btn" title="វីដេអូ">
          <svg class="icon" viewBox="0 0 24 24">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </button>

        <!-- 3. Image Gallery Icon -->
        <button class="left-action-btn" onclick="document.getElementById('imageFileInput').click()" title="ផ្ញើរូបភាព">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
      </div>

      <!-- Recording Banner -->
      <div class="recording-banner" id="recIndicator">
        <span>🔴 កំពុងថតសំឡេង... (<span id="recTimer">0:00</span>)</span>
        <button onclick="cancelRecording()" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:11px;">[បោះបង់]</button>
      </div>

      <!-- Text Input Field (Placeholder: ផ្ញើសារ) -->
      <input type="text" id="msgInput" class="chat-text-input" placeholder="ផ្ញើសារ" oninput="handleInputState(this.value)" onkeydown="if(event.key==='Enter') sendMsg()">

      <!-- Right Circular Cyan Button (Mic 🎙️ / Send ➤) -->
      <button class="right-circle-btn" id="mainActionBtn" onclick="handleMainAction()" title="ផ្ញើសារ / ថតសំឡេង">
        <svg class="icon" id="micIcon" viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>

        <svg class="icon" id="sendIcon" style="display:none;" viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- 🔗 ភ្ជាប់ api.js ដូចទម្រង់ Login របស់អ្នក -->
  <script src="api.js"></script>

  <script>
    // =========================================================
    // ⚙️ API CONFIG & SESSION AUTH INTEGRATION
    // =========================================================
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe6vrQshGAPglgmmZykljXazDNh1ZwWSRdFDAip1WWWRky24lmBo-qicLK3_i10AvT/exec';
    var CURRENT_ROOM = 'global';
    
    var _urlParams = new URLSearchParams(window.location.search);
    function _get(k) { try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }

    // ទាញ Token ពី api.js (getStoredToken) ឬ URL ឬ localStorage
    var TOKEN = (typeof getStoredToken === 'function' ? getStoredToken() : '') 
                || _urlParams.get('token') 
                || _get('krou_session_token') 
                || _get('school_token') 
                || '';

    var CURRENT_USER = null;

    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = TOKEN;

      if (typeof callBackendApi === 'function') {
        return callBackendApi(action, params);
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      return await res.json();
    }

    // ── 🔒 ត្រួតពិនិត្យគណនីពេលចាប់ផ្ដើម (បើគ្មានគណនី -> ទៅ login.html) ──
    window.onload = async function() {
      await verifyAuthentication();
    };

    async function verifyAuthentication() {
      if (!TOKEN) {
        redirectToLogin();
        return;
      }

      try {
        var sess = await apiCall('getCurrentSession', { token: TOKEN });
        if (sess && sess.loggedIn) {
          CURRENT_USER = sess;
          document.getElementById('loadingGate').style.display = 'none';

          // បង្ហាញឈ្មោះអ្នក Login នៅរបារកំពូល
          var badge = document.getElementById('userBadge');
          var nameSpan = document.getElementById('userBadgeName');
          badge.style.display = 'flex';
          nameSpan.textContent = sess.name + (sess.role === 'admin' ? ' (Admin)' : '');

          loadMessages();
          setInterval(loadMessages, 6000); // ផ្ទុកសារថ្មីរៀងរាល់ ៦ វិនាទី
        } else {
          redirectToLogin();
        }
      } catch (e) {
        redirectToLogin();
      }
    }

    function redirectToLogin() {
      // បញ្ជូនទៅកាន់ login.html របស់អ្នកដោយស្វ័យប្រវត្តិ
      if (typeof removeStoredToken === 'function') removeStoredToken();
      localStorage.removeItem('krou_session_token');
      window.location.replace('login.html');
    }

    function handleLogout() {
      if (confirm('តើអ្នកពិតជាចង់ចាកចេញពីគណនីមែនទេ?')) {
        apiCall('logoutSession', { token: TOKEN });
        redirectToLogin();
      }
    }

    // ── ទាញយកសារ ──
    async function loadMessages() {
      if (!CURRENT_USER) return;
      try {
        var res = await apiCall('getChatMessages', { roomId: CURRENT_ROOM, token: TOKEN });
        if (res && res.success && Array.isArray(res.messages)) {
          renderMessages(res.messages);
        }
      } catch (e) {
        console.warn('loadMessages error:', e);
      }
    }

    function renderMessages(messages) {
      var box = document.getElementById('chatBox');
      if (messages.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">មិនទាន់មានសារសន្ទនានៅឡើយទេ</div>';
        return;
      }

      var html = '';
      messages.forEach(function(m) {
        // បើសារនោះផ្ញើដោយខ្លួនឯង -> រុញទៅខាងស្ដាំ (Outgoing)
        var isMe = CURRENT_USER && (m.senderCode === CURRENT_USER.code || m.senderName === CURRENT_USER.name);
        var rowClass = isMe ? 'outgoing' : 'incoming';
        
        var isOwner = (m.senderRole === 'admin' || m.senderName.includes('KrouDigital') || m.senderName.includes('Owner'));
        var avatarClass = isOwner ? 'purple-s' : 'green-l';
        var senderClass = isOwner ? 'owner-gold' : 'teacher-grey';
        var initial = isOwner ? 'S' : (m.senderName ? m.senderName.charAt(0) : 'U');

        var contentHtml = '';
        if (m.type === 'image') {
          contentHtml = `
            <a href="${m.content}" target="_blank">
              <img src="${m.content}" class="chat-img-thumb" alt="រូបភាព">
            </a>
            ${m.caption ? `<div>${escapeHtml(m.caption)}</div>` : ''}
          `;
        } else if (m.type === 'audio') {
          contentHtml = `
            <div style="font-size:12px; margin-bottom:2px;">🎙️ សារជាសំឡេង</div>
            <audio src="${m.content}" controls class="chat-audio-player"></audio>
          `;
        } else {
          contentHtml = formatLinks(escapeHtml(m.content));
        }

        html += `
          <div class="msg-group ${rowClass}">
            <div class="msg-avatar ${avatarClass}">${initial}</div>
            <div class="msg-content-wrap">
              <div class="msg-sender-label ${senderClass}">${escapeHtml(m.senderName)}</div>
              <div class="msg-bubble">
                ${contentHtml}
                <div class="msg-time">${m.time || ''}</div>
              </div>
            </div>
          </div>
        `;
      });

      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    function handleInputState(val) {
      var hasText = val.trim().length > 0;
      document.getElementById('micIcon').style.display = hasText ? 'none' : 'inline-block';
      document.getElementById('sendIcon').style.display = hasText ? 'inline-block' : 'none';
    }

    function handleMainAction() {
      var text = document.getElementById('msgInput').value.trim();
      if (text) {
        sendMsg();
      } else {
        toggleVoiceRecording();
      }
    }

    // ── ផ្ញើសារជាអក្សរ ──
    async function sendMsg() {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var input = document.getElementById('msgInput');
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      handleInputState('');

      try {
        await apiCall('sendChatMessage', { roomId: CURRENT_ROOM, text: text, token: TOKEN });
        await loadMessages();
      } catch (err) {
        alert('មិនអាចផ្ញើសារបានទេ៖ ' + err.message);
      }
    }

    // ── ផ្ញើរូបភាព ──
    function handleImageUpload(inputEl) {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var file = inputEl.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = async function(e) {
        var base64 = e.target.result;
        var caption = prompt('បញ្ចូលចំណងជើងរូបភាព (ប្រសិនបើមាន)៖') || '';
        
        try {
          await apiCall('sendChatMedia', {
            roomId: CURRENT_ROOM,
            mediaType: 'image',
            base64Data: base64,
            fileName: file.name,
            caption: caption,
            token: TOKEN
          });
          loadMessages();
        } catch (err) {
          alert('កំហុសផ្ញើរូបភាព៖ ' + err.message);
        } finally {
          inputEl.value = '';
        }
      };
      reader.readAsDataURL(file);
    }

    // ── ថតសំឡេង ──
    var mediaRecorder = null;
    var audioChunks = [];
    var recInterval = null;
    var recSeconds = 0;

    async function toggleVoiceRecording() {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var btn = document.getElementById('mainActionBtn');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        btn.classList.remove('recording');
        clearInterval(recInterval);
        document.getElementById('recIndicator').style.display = 'none';
        document.getElementById('msgInput').style.display = 'block';
      } else {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('ឧបករណ៍របស់អ្នកមិនគាំទ្រការថតសំឡេងឡើយ');
          return;
        }

        try {
          var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function(e) { audioChunks.push(e.data); };
          mediaRecorder.onstop = async function() {
            var audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            var reader = new FileReader();
            reader.onloadend = async function() {
              var base64Audio = reader.result;
              try {
                await apiCall('sendChatMedia', {
                  roomId: CURRENT_ROOM,
                  mediaType: 'audio',
                  base64Data: base64Audio,
                  fileName: 'voice.webm',
                  caption: '',
                  token: TOKEN
                });
                loadMessages();
              } catch (err) {
                alert('កំហុសផ្ញើសំឡេង៖ ' + err.message);
              }
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start();
          btn.classList.add('recording');
          document.getElementById('msgInput').style.display = 'none';
          document.getElementById('recIndicator').style.display = 'flex';

          recSeconds = 0;
          recInterval = setInterval(function() {
            recSeconds++;
            var mins = Math.floor(recSeconds / 60);
            var secs = recSeconds % 60;
            document.getElementById('recTimer').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
          }, 1000);

        } catch (err) {
          alert('សូមអនុញ្ញាតសិទ្ធិប្រើប្រាស់ Microphone៖ ' + err.message);
        }
      }
    }

    function cancelRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.ondataavailable = null;
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
      document.getElementById('mainActionBtn').classList.remove('recording');
      clearInterval(recInterval);
      document.getElementById('recIndicator').style.display = 'none';
      document.getElementById('msgInput').style.display = 'block';
    }

    function formatLinks(text) {
      var urlPattern = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlPattern, function(url) {
        return '<a href="' + url + '" target="_blank">' + url + '</a>';
      });
    }

    function escapeHtml(t) {
      if (!t) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
