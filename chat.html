<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>សារសន្ទនា - KrouDigital</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05131b;
      color: #e2e8f0;
      font-family: 'Kantumruy Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .chat-app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
      display: inline-block;
    }

    /* ============ 1. ROOM HEADER ============ */
    .room-header-wrap {
      flex: 0 0 auto;
      padding: 8px 14px 4px 14px;
      z-index: 30;
      background: #05131b;
    }
    .room-header-card {
      background: #0e202c;
      border: 1px solid #162f40;
      border-radius: 9999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .room-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .room-arrow-btn {
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .room-badge-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .room-badge-logo svg { width: 22px; height: 22px; }
    .room-title-text {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.2px;
    }

    .room-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .room-action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .room-action-btn:hover, .room-action-btn:active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: scale(1.08);
    }

    /* 🔍 Search Bar */
    .search-bar-inline {
      display: none;
      padding: 8px 16px;
      background: #0a1824;
      border-bottom: 1px solid #162f40;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      z-index: 30;
    }
    .search-input-field {
      flex: 1;
      background: #0e202c;
      border: 1.5px solid #1d3a50;
      border-radius: 20px;
      padding: 7px 16px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .search-input-field:focus { border-color: #38bdf8; }

    /* ============ 2. CHAT MESSAGES BODY ============ */
    .chat-messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px 16px 85px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #132a38; border-radius: 4px; }

    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 86%;
      align-items: flex-start;
    }
    .msg-group.incoming { align-self: flex-start; }
    .msg-group.outgoing { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13.5px;
      color: #ffffff;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .msg-avatar.purple-s { background: #9333ea; }
    .msg-avatar.green-l  { background: #059669; }

    .msg-content-wrap { display: flex; flex-direction: column; gap: 3px; }
    .msg-sender-label { font-size: 11.5px; font-weight: 700; line-height: 1.3; }
    .msg-sender-label.owner-gold { color: #facc15; }
    .msg-sender-label.teacher-grey { color: #94a3b8; }
    .msg-group.outgoing .msg-sender-label { text-align: right; color: #38bdf8; }

    .msg-bubble {
      background: #11222e;
      border: 1px solid #162f40;
      border-radius: 14px;
      border-top-left-radius: 3px;
      padding: 9px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #e2e8f0;
      word-break: break-word;
    }
    .msg-group.outgoing .msg-bubble {
      background: #0d3856;
      border-color: #175480;
      border-top-left-radius: 14px;
      border-top-right-radius: 3px;
    }

    .msg-bubble a { color: #38bdf8; text-decoration: underline; word-break: break-all; }
    .msg-time { font-size: 10.5px; color: #64748b; margin-top: 3px; text-align: right; }
    .msg-group.outgoing .msg-time { color: #94a3b8; }

    .chat-img-thumb { max-width: 250px; max-height: 250px; border-radius: 8px; display: block; margin-bottom: 4px; cursor: pointer; }
    .chat-audio-player { width: 220px; height: 34px; margin-top: 4px; outline: none; }

    /* ============ 🌟 3. NATIVE EMOJI PICKER POPUP ============ */
    .emoji-picker-drawer {
      position: absolute;
      bottom: 74px;
      left: 16px;
      width: min(360px, calc(100% - 32px));
      background: #0e202c;
      border: 1.5px solid #183345;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      z-index: 90;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: popEmoji 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes popEmoji {
      from { transform: scale(0.92) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .emoji-drawer-header {
      padding: 8px 12px;
      background: #0a1824;
      border-bottom: 1px solid #162f40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: #94a3b8;
    }
    .emoji-drawer-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 10px;
      max-height: 220px;
      overflow-y: auto;
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    }
    .emoji-drawer-grid::-webkit-scrollbar { width: 4px; }
    .emoji-drawer-grid::-webkit-scrollbar-thumb { background: #162f40; border-radius: 4px; }
    .emoji-btn {
      font-size: 24px;
      line-height: 1.2;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px;
      transition: transform 0.12s, background 0.12s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emoji-btn:hover, .emoji-btn:active {
      background: rgba(56, 189, 248, 0.15);
      transform: scale(1.2);
    }

    /* ============ 4. BOTTOM INPUT BAR ============ */
    .chat-bottom-bar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: 66px !important;
      padding: 8px 14px 12px 14px !important;
      background: #05131b !important;
      border-top: 2px solid #102a3a !important;
      z-index: 100 !important;
      display: flex !important;
      align-items: center !important;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.6) !important;
    }
    .input-capsule {
      width: 100%;
      background: #0e202c;
      border: 1.5px solid #183345;
      border-radius: 9999px;
      padding: 4px 6px 4px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .input-capsule:focus-within { border-color: #0284c7; }

    .left-actions { display: flex; align-items: center; gap: 8px; color: #94a3b8; }
    .left-action-btn {
      background: transparent; border: none; color: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 5px;
      border-radius: 50%; transition: color 0.15s;
    }
    .left-action-btn:hover { color: #38bdf8; }

    .chat-input-field {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f8fafc; font-family: 'Kantumruy Pro', sans-serif;
      font-size: 14px; padding: 6px 2px;
    }
    .chat-input-field::placeholder { color: #64748b; }

    .right-circle-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #0284c7; border: none; color: #ffffff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.15s ease; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .right-circle-btn:hover { background: #0369a1; transform: scale(1.04); }
    .right-circle-btn.recording { background: #ef4444; animation: pulseRec 1s infinite; }
    @keyframes pulseRec { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    .recording-banner { display: none; align-items: center; gap: 8px; color: #ef4444; font-size: 12.5px; font-weight: 700; flex: 1; }

    /* ============ 👥 5. MEMBERS MODAL DIALOG ============ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px); display: none; align-items: center;
      justify-content: center; z-index: 1000; padding: 16px;
    }
    .modal-card {
      width: 100%; max-width: 420px; background: #0e202c; border: 1px solid #1a354a;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex; flex-direction: column; max-height: 80vh; overflow: hidden;
    }
    .modal-head {
      padding: 14px 18px; border-bottom: 1px solid #162f40;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head-title { font-size: 14.5px; font-weight: 700; color: #fff; }
    .modal-close-btn { background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 4px; }
    .members-list { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    .member-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: #11222e; border-radius: 12px; border: 1px solid #162f40;
      transition: all 0.2s;
    }
    .member-item.is-current-user {
      background: #092638 !important;
      border: 1.5px solid #0284c7 !important;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.25) !important;
    }
    .member-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #0284c7; color: #fff; font-weight: 700;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      flex-shrink: 0;
    }
    .member-info { flex: 1; min-width: 0; }
    .member-info .m-name {
      font-size: 13.5px; font-weight: 700; color: #f8fafc;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .member-info .m-sub { font-size: 11px; color: #38bdf8; margin-top: 2px; }

    .badge-current-user {
      background: #059669;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }

    /* Loading Gate */
    .loading-gate {
      position: absolute; inset: 0; background: #05131b;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 100; gap: 12px;
    }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="chat-app-wrapper" id="chatApp">

    <!-- Loading Gate -->
    <div class="loading-gate" id="loadingGate">
      <div class="loading-spinner"></div>
      <div style="font-size: 13px; color: #38bdf8; font-weight: 600;">🔒 កំពុងផ្ទៀងផ្ទាត់គណនីគ្រូ / Admin...</div>
    </div>

    <!-- 1. FLOATING ROOM HEADER -->
    <div class="room-header-wrap">
      <div class="room-header-card">
        <div class="room-left" onclick="openMembersModal()" title="មើលព័ត៌មានបន្ទប់">
          <span class="room-arrow-btn" onclick="event.stopPropagation(); history.back();" title="ថយក្រោយ">
            <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </span>

          <div class="room-badge-logo">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="#0284c7" stroke-width="2"/>
              <path d="M8 12l3 3 5-5" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <span class="room-title-text" id="roomTitle">ក្រុមពិគ្រោះ និងដោះស្រាយចម្ងល់</span>
        </div>

        <div class="room-right">
          <button type="button" class="room-action-btn" onclick="toggleSearch()" title="ស្វែងរកសារ">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>

          <button type="button" class="room-action-btn" onclick="openMembersModal()" title="សមាជិកក្រុម">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar-inline" id="searchBar">
      <input type="text" id="searchInput" class="search-input-field" placeholder="វាយពាក្យស្វែងរកសារ..." oninput="filterMessages(this.value)">
      <button type="button" onclick="toggleSearch()" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer; padding:4px;">✕</button>
    </div>

    <!-- 2. CHAT MESSAGES BODY -->
    <div class="chat-messages" id="chatBox">
      <div style="text-align:center; padding:30px; color:#64748b;">⏳ កំពុងទាញយកសារ...</div>
    </div>

    <!-- 🌟 3. NATIVE EMOJI PICKER POPUP (ទាញចេញពី Emojis ដើមរបស់ទូរស័ព្ទ) -->
    <div class="emoji-picker-drawer" id="emojiDrawer">
      <div class="emoji-drawer-header">
        <span>😀 រូបសញ្ញា EMOJI</span>
        <button type="button" onclick="toggleEmojiPicker()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px;">✕</button>
      </div>
      <div class="emoji-drawer-grid" id="emojiGrid">
        <!-- បញ្ជី Emoji ដើមពេញនិយម -->
      </div>
    </div>

    <!-- 4. BOTTOM INPUT CAPSULE -->
    <div class="chat-bottom-bar" id="chatBottomBar">
      <div class="input-capsule">
        
        <div class="left-actions">
          <!-- 🌟 ប៊ូតុង Emoji (បើកក្ដារ Emoji ដើមរបស់ទូរស័ព្ទ) -->
          <button class="left-action-btn" type="button" onclick="toggleEmojiPicker()" title="Emoji">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
              <line x1="9" y1="9" x2="9.01" y2="9"/>
              <line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
          </button>

          <button class="left-action-btn" type="button" onclick="alert('មុខងារវីដេអូ Call នឹងបើកដំណើរការឆាប់ៗ!')" title="វីដេអូ">
            <svg class="icon" viewBox="0 0 24 24">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </button>

          <button class="left-action-btn" type="button" onclick="document.getElementById('imageFileInput').click()" title="ផ្ញើរូបភាព">
            <svg class="icon" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
        </div>

        <div class="recording-banner" id="recIndicator">
          <span>🔴 កំពុងថតសំឡេង... (<span id="recTimer">0:00</span>)</span>
          <button type="button" onclick="cancelRecording()" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:11px;">[បោះបង់]</button>
        </div>

        <input type="text" id="msgInput" class="chat-input-field" placeholder="ផ្ញើសារ" onfocus="closeEmojiPicker()" oninput="handleInputState(this.value)" onkeydown="if(event.key==='Enter') sendMsg()">

        <button class="right-circle-btn" id="mainActionBtn" type="button" onclick="handleMainAction()" title="ផ្ញើសារ / ថតសំឡេង">
          <svg class="icon" id="micIcon" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>

          <svg class="icon" id="sendIcon" style="display:none;" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>

      </div>
    </div>

  </div>

  <!-- 👥 5. MEMBERS MODAL DIALOG -->
  <div class="modal-overlay" id="membersModal" onclick="if(event.target===this) closeMembersModal()">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-head-title">👥 សមាជិកក្នុងបន្ទប់សន្ទនា</span>
        <button type="button" class="modal-close-btn" onclick="closeMembersModal()">✕</button>
      </div>
      <div class="members-list" id="membersListArea">
        <div style="text-align:center; padding:20px; color:#94a3b8; font-size:12px;">⏳ កំពុងទាញយកសមាជិក...</div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe6vrQshGAPglgmmZykljXazDNh1ZwWSRdFDAip1WWWRky24lmBo-qicLK3_i10AvT/exec';
    var CURRENT_ROOM = 'global';
    
    var _urlParams = new URLSearchParams(window.location.search);
    function _get(k) { try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }

    var TOKEN = (window.parent && window.parent.SESSION_TOKEN)
                || (typeof getStoredToken === 'function' ? getStoredToken() : '') 
                || _urlParams.get('token') 
                || _get('krou_session_token') 
                || _get('school_token') 
                || '';

    var CURRENT_USER = null;
    var allCachedMessages = [];

    // 🌟 បញ្ជី Emoji ដើមរបស់ទូរស័ព្ទ (Unicode Native Emojis)
    var NATIVE_EMOJIS = [
      "😀","😃","😄","😁","😆","😅","😂","🤣","🙂","🙃","😉","😊","😇","🥰","😍","🤩","😘","😗","😚","😋","😛","😜","🤪","😝","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬","🤥","😌","😔","😪","🤤","😴","😷","🤒","🤕","🤢","🤮","🤧","🥵","🥶","🥴","😵","🤯","🤠","🥳","😎","🤓","🧐","👍","👎","👏","🙌","🤝","👊","✊","🤛","🤜","🤞","✌️","🤟","🤘","👌","🤏","👈","👉","👆","👇","☝️","✋","🤚","🖐️","🖖","👋","🤙","💪","🙏","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","🔥","💯","✨","🎉","🎊","⭐","🌟","💡","☕","✅","❌","❓","❗"
    ];

    function initNativeEmojiGrid() {
      var grid = document.getElementById('emojiGrid');
      if (!grid) return;
      var html = '';
      NATIVE_EMOJIS.forEach(function(em) {
        html += `<button type="button" class="emoji-btn" onclick="selectEmoji('${em}')">${em}</button>`;
      });
      grid.innerHTML = html;
    }

    function toggleEmojiPicker() {
      var drawer = document.getElementById('emojiDrawer');
      if (drawer.style.display === 'flex') {
        drawer.style.display = 'none';
      } else {
        drawer.style.display = 'flex';
      }
    }

    function closeEmojiPicker() {
      var drawer = document.getElementById('emojiDrawer');
      if (drawer) drawer.style.display = 'none';
    }

    function selectEmoji(em) {
      var input = document.getElementById('msgInput');
      input.value += em;
      handleInputState(input.value);
      input.focus();
    }

    // ── 🌟 មុខងារស្វ័យប្រវត្តិតម្រឹមផ្ទៃមើល Tablet កុំឱ្យរុញប្រអប់ផ្ញើសារធ្លាក់ចុះក្រោម ──
    function syncVisibleHeight() {
      try {
        var h = window.innerHeight;
        if (window.parent && window.parent !== window) {
          var frame = window.parent.document.getElementById('pageFrame');
          if (frame) {
            var r = frame.getBoundingClientRect();
            var avail = window.parent.innerHeight - r.top;
            if (avail > 200) h = avail;
          }
        }
        var app = document.getElementById('chatApp');
        if (app) app.style.height = h + 'px';
      } catch(e) {}
    }

    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = TOKEN;

      if (typeof callBackendApi === 'function') {
        return callBackendApi(action, params);
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      return await res.json();
    }

    window.onload = async function() {
      initNativeEmojiGrid();
      syncVisibleHeight();
      window.addEventListener('resize', syncVisibleHeight);
      await verifyAuthentication();
    };

    async function verifyAuthentication() {
      if (!TOKEN) {
        redirectToLogin();
        return;
      }

      try {
        var sess = await apiCall('getCurrentSession', { token: TOKEN });
        if (sess && sess.loggedIn) {
          CURRENT_USER = sess;
          document.getElementById('loadingGate').style.display = 'none';
          syncVisibleHeight();

          await loadMessages();
          setInterval(loadMessages, 6000);
        } else {
          redirectToLogin();
        }
      } catch (e) {
        redirectToLogin();
      }
    }

    function redirectToLogin() {
      if (typeof removeStoredToken === 'function') removeStoredToken();
      localStorage.removeItem('krou_session_token');
      if (window.parent && window.parent !== window) {
        window.parent.location.replace('login.html');
      } else {
        window.location.replace('login.html');
      }
    }

    function toggleSearch() {
      var bar = document.getElementById('searchBar');
      var input = document.getElementById('searchInput');
      if (bar.style.display === 'flex') {
        bar.style.display = 'none';
        renderMessages(allCachedMessages);
      } else {
        bar.style.display = 'flex';
        input.value = '';
        input.focus();
      }
    }

    function filterMessages(query) {
      if (!query || !query.trim()) {
        renderMessages(allCachedMessages);
        return;
      }
      var q = query.toLowerCase().trim();
      var filtered = allCachedMessages.filter(function(m) {
        return (m.content && m.content.toLowerCase().includes(q)) ||
               (m.senderName && m.senderName.toLowerCase().includes(q));
      });
      renderMessages(filtered);
    }

    // ── 👥 មុខងារសមាជិកក្រុម (បង្ហាញតែគណនីពិត + Highlight គណនីបច្ចុប្បន្ន) ──
    async function openMembersModal() {
      var modal = document.getElementById('membersModal');
      var area = document.getElementById('membersListArea');
      modal.style.display = 'flex';
      area.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8; font-size:12px;">⏳ កំពុងទាញយកសមាជិក...</div>';

      try {
        var res = await apiCall('getAllTeachers', { token: TOKEN });
        var teachers = (res && res.teachers && Array.isArray(res.teachers)) ? res.teachers : [];

        if (teachers.length === 0) {
          area.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">មិនមានបញ្ជីសមាជិកឡើយ</div>';
          return;
        }

        var html = '';
        teachers.forEach(function(t) {
          var isAdm = String(t.role).toLowerCase() === 'admin';
          var initial = t.name ? t.name.charAt(0) : (t.username ? t.username.charAt(0) : 'U');

          var isCurrent = CURRENT_USER && (
            (t.username && t.username.toLowerCase() === (CURRENT_USER.username || '').toLowerCase()) ||
            (t.code && t.code === CURRENT_USER.code) ||
            (t.name && t.name === CURRENT_USER.name)
          );

          var activeClass = isCurrent ? 'is-current-user' : '';
          var roleSub = isAdm 
            ? 'អ្នកគ្រប់គ្រងប្រព័ន្ធ (Admin)' 
            : (t.assignedClass ? 'គ្រូថ្នាក់ទី ' + t.assignedClass : 'គ្រូបង្រៀន');

          html += `
            <div class="member-item ${activeClass}">
              <div class="member-avatar" style="background:${isAdm ? '#9333ea' : '#059669'};">${initial}</div>
              <div class="member-info">
                <div class="m-name" style="${isAdm ? 'color:#facc15;' : ''}">
                  ${escapeHtml(t.name || t.username)}
                  ${isCurrent ? '<span class="badge-current-user">🟢 គណនីរបស់អ្នក (កំពុងប្រើ)</span>' : ''}
                </div>
                <div class="m-sub">${roleSub}</div>
              </div>
            </div>
          `;
        });

        area.innerHTML = html;
      } catch (err) {
        if (CURRENT_USER) {
          area.innerHTML = `
            <div class="member-item is-current-user">
              <div class="member-avatar" style="background:#059669;">${CURRENT_USER.name.charAt(0)}</div>
              <div class="member-info">
                <div class="m-name">${escapeHtml(CURRENT_USER.name)} <span class="badge-current-user">🟢 គណនីរបស់អ្នក (កំពុងប្រើ)</span></div>
                <div class="m-sub">${CURRENT_USER.role === 'admin' ? 'អ្នកគ្រប់គ្រង' : (CURRENT_USER.assignedClass ? 'គ្រូថ្នាក់ទី ' + CURRENT_USER.assignedClass : 'គ្រូបង្រៀន')}</div>
              </div>
            </div>
          `;
        } else {
          area.innerHTML = '<div style="text-align:center; color:#ef4444; padding:15px;">មិនអាចទាញយកបញ្ជីបានទេ</div>';
        }
      }
    }

    function closeMembersModal() {
      document.getElementById('membersModal').style.display = 'none';
    }

    // ── 🌟 ទាញយកសារពិតប្រាកដ (លុបសារស្វាគមន៍ចាស់ចោលស្វ័យប្រវត្តិ) ──
    async function loadMessages() {
      if (!CURRENT_USER) return;
      try {
        var res = await apiCall('getChatMessages', { roomId: CURRENT_ROOM, token: TOKEN });
        if (res && res.success && Array.isArray(res.messages)) {
          allCachedMessages = res.messages.filter(function(m) {
            var c = String(m.content || m.text || '').trim();
            return c.indexOf('សូមស្វាគមន៍') === -1;
          });
          renderMessages(allCachedMessages);
        }
      } catch (e) {
        console.warn('loadMessages error:', e);
      }
    }

    function renderMessages(messages) {
      var box = document.getElementById('chatBox');
      if (messages.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">មិនទាន់មានសារសន្ទនានៅឡើយទេ<br><small style="color:#475569;">វាយបញ្ចូលសារខាងក្រោមដើម្បីចាប់ផ្តើម</small></div>';
        return;
      }

      var html = '';
      messages.forEach(function(m) {
        var isMe = CURRENT_USER && (m.senderCode === CURRENT_USER.code || m.senderCode === CURRENT_USER.username || m.senderName === CURRENT_USER.name);
        var rowClass = isMe ? 'outgoing' : 'incoming';
        
        var isAdm = (m.senderRole === 'admin');
        var avatarClass = isAdm ? 'purple-s' : 'green-l';
        var senderClass = isAdm ? 'owner-gold' : 'teacher-grey';
        var initial = m.senderName ? m.senderName.charAt(0) : 'U';

        var senderTitle = m.senderName;
        if (m.caption) {
          senderTitle += ' • ' + m.caption;
        } else if (isAdm) {
          senderTitle += ' • Admin';
        }

        var contentHtml = '';
        if (m.type === 'image') {
          contentHtml = `
            <a href="${m.content}" target="_blank">
              <img src="${m.content}" class="chat-img-thumb" alt="រូបភាព">
            </a>
            ${m.caption ? `<div>${escapeHtml(m.caption)}</div>` : ''}
          `;
        } else if (m.type === 'audio') {
          contentHtml = `
            <div style="font-size:12px; margin-bottom:2px;">🎙️ សារជាសំឡេង</div>
            <audio src="${m.content}" controls class="chat-audio-player"></audio>
          `;
        } else {
          contentHtml = formatLinks(escapeHtml(m.content));
        }

        html += `
          <div class="msg-group ${rowClass}">
            <div class="msg-avatar ${avatarClass}">${initial}</div>
            <div class="msg-content-wrap">
              <div class="msg-sender-label ${senderClass}">${escapeHtml(senderTitle)}</div>
              <div class="msg-bubble">
                ${contentHtml}
                <div class="msg-time">${m.time || ''}</div>
              </div>
            </div>
          </div>
        `;
      });

      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    function handleInputState(val) {
      var hasText = val.trim().length > 0;
      document.getElementById('micIcon').style.display = hasText ? 'none' : 'inline-block';
      document.getElementById('sendIcon').style.display = hasText ? 'inline-block' : 'none';
    }

    function handleMainAction() {
      var text = document.getElementById('msgInput').value.trim();
      if (text) {
        sendMsg();
      } else {
        toggleVoiceRecording();
      }
    }

    // ── ផ្ញើសារអក្សរ ──
    async function sendMsg() {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var input = document.getElementById('msgInput');
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      handleInputState('');
      closeEmojiPicker();

      try {
        await apiCall('sendChatMessage', { roomId: CURRENT_ROOM, text: text, token: TOKEN });
        await loadMessages();
      } catch (err) {
        alert('មិនអាចផ្ញើសារបានទេ៖ ' + err.message);
      }
    }

    // ── ផ្ញើរូបភាព ──
    function handleImageUpload(inputEl) {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var file = inputEl.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = async function(e) {
        var base64 = e.target.result;
        var caption = prompt('បញ្ចូលចំណងជើងរូបភាព (ប្រសិនបើមាន)៖') || '';
        
        try {
          await apiCall('sendChatMedia', {
            roomId: CURRENT_ROOM,
            mediaType: 'image',
            base64Data: base64,
            fileName: file.name,
            caption: caption,
            token: TOKEN
          });
          loadMessages();
        } catch (err) {
          alert('កំហុសផ្ញើរូបភាព៖ ' + err.message);
        } finally {
          inputEl.value = '';
        }
      };
      reader.readAsDataURL(file);
    }

    // ── ថតសំឡេង ──
    var mediaRecorder = null;
    var audioChunks = [];
    var recInterval = null;
    var recSeconds = 0;

    async function toggleVoiceRecording() {
      if (!CURRENT_USER) { redirectToLogin(); return; }
      var btn = document.getElementById('mainActionBtn');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        btn.classList.remove('recording');
        clearInterval(recInterval);
        document.getElementById('recIndicator').style.display = 'none';
        document.getElementById('msgInput').style.display = 'block';
      } else {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('ឧបករណ៍របស់អ្នកមិនគាំទ្រការថតសំឡេងឡើយ');
          return;
        }

        try {
          var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function(e) { audioChunks.push(e.data); };
          mediaRecorder.onstop = async function() {
            var audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            var reader = new FileReader();
            reader.onloadend = async function() {
              var base64Audio = reader.result;
              try {
                await apiCall('sendChatMedia', {
                  roomId: CURRENT_ROOM,
                  mediaType: 'audio',
                  base64Data: base64Audio,
                  fileName: 'voice.webm',
                  caption: '',
                  token: TOKEN
                });
                loadMessages();
              } catch (err) {
                alert('កំហុសផ្ញើសំឡេង៖ ' + err.message);
              }
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start();
          btn.classList.add('recording');
          document.getElementById('msgInput').style.display = 'none';
          document.getElementById('recIndicator').style.display = 'flex';

          recSeconds = 0;
          recInterval = setInterval(function() {
            recSeconds++;
            var mins = Math.floor(recSeconds / 60);
            var secs = recSeconds % 60;
            document.getElementById('recTimer').textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
          }, 1000);

        } catch (err) {
          alert('សូមអនុញ្ញាតសិទ្ធិប្រើប្រាស់ Microphone៖ ' + err.message);
        }
      }
    }

    function cancelRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.ondataavailable = null;
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
      document.getElementById('mainActionBtn').classList.remove('recording');
      clearInterval(recInterval);
      document.getElementById('recIndicator').style.display = 'none';
      document.getElementById('msgInput').style.display = 'block';
    }

    function formatLinks(text) {
      var urlPattern = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlPattern, function(url) {
        return '<a href="' + url + '" target="_blank">' + url + '</a>';
      });
    }

    function escapeHtml(t) {
      if (!t) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
