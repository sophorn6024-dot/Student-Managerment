<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សៀវភៅតាមដានការសិក្សា</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      /* Theme Tokens - Light Mode */
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.95);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Booklet Document Colors */
      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      /* Theme Tokens - Dark Mode */
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.94);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* =========================================================
       🎛️ NEW PREMIUM TOOLBAR DESIGN
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 12px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .form-control {
      padding: 6px 10px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .form-control:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* 🌟 Badge ថ្នាក់គ្រូ */
    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
      user-select: none;
    }

    /* ── Action Buttons ── */
    .btn {
      padding: 6px 14px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: var(--ctrl-group-bg);
      color: var(--text-main);
      border-color: var(--input-border);
    }
    .btn-secondary:hover {
      border-color: var(--input-focus);
      color: var(--input-focus);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .btn-purple {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      box-shadow: 0 3px 10px rgba(124, 58, 237, 0.25);
    }
    .btn-purple:hover {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      transform: translateY(-1px);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
    }
    .btn-toggle:hover {
      background: linear-gradient(135deg, #047857, #065f46);
      transform: translateY(-1px);
    }

    /* ── Zoom Buttons ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--ctrl-group-bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--tb-border);
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* =========================================================
       📄 BOOKLET PREVIEW (សៀវភៅតាមដានការសិក្សា - រក្សាពណ៌សជានិច្ច)
    ========================================================= */
    .preview-wrapper {
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      transition: zoom 0.2s ease;
    }

    .booklet-container {
      background: #ffffff !important;
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      min-height: 210mm;
      padding: 6mm 7.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      page-break-after: always;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy);
      padding: 13px 18px 10px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      background: #ffffff !important;
      color: var(--navy) !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14.5px; letter-spacing: 6px; color: var(--red-star); margin: 2px 0 4px 0; }

    .cover-title-block { text-align: center; margin: 10px 0 8px 0; color: var(--navy); }
    .cover-title-block h2 { font-size: 17px; margin-bottom: 3px; }
    .cover-title-block h3 { font-size: 15.5px; margin-bottom: 6px; }
    .cover-title-block h1 { font-size: 29px; margin: 8px 0; letter-spacing: 0.5px; line-height: 1.35; }
    .cover-title-block .school-name { font-size: 16.5px; margin-top: 5px; }

    .dotted-info-list {
      margin: 14px 0 8px 0;
      display: flex;
      flex-direction: column;
      gap: 15.5px;
      font-size: 15.5px;
    }
    .info-row { display: flex; align-items: flex-end; width: 100%; }
    .info-label { white-space: nowrap; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; color: var(--navy); font-weight: bold; font-size: 15.5px; }
    .info-dots {
      flex: 1; border-bottom: 1.5px dotted #132d56; margin-left: 6px; padding-left: 6px; min-height: 23px;
      color: #0f172a; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-size: 15.5px;
    }

    .cover-footer { text-align: center; font-size: 21px; color: var(--navy); margin-top: 6px; margin-bottom: 2px; }

    .report-meta-grid {
      display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; margin: 2px 0 4px 0; font-size: 13.5px; color: var(--navy);
    }

    /* ── Table Styling (ការពារកុំឱ្យខ្មៅពេល Dark Mode) ── */
    .score-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      margin-bottom: 3px; 
      border: 1.4px solid var(--navy) !important; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .score-table th, .score-table td { 
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 0.5px; 
      height: 22px; 
      vertical-align: middle; 
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .score-table th { 
      background-color: #f8fafc !important; 
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; 
      font-weight: bold; 
      color: var(--navy) !important; 
      font-size: 13.5px; 
    }
    .score-table td.subject-name {
      text-align: left; padding-left: 7px; font-size: 13px; color: var(--navy) !important; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-table .val-cell { font-weight: bold; color: var(--navy) !important; font-size: 15.5px; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; }

    .th-grade { width: 8.8%; white-space: nowrap; padding: 1px 0 !important; }
    .grade-range { font-size: 8.8px; font-weight: normal; white-space: nowrap; display: inline-block; letter-spacing: -0.3px; font-family: 'Arial', 'Kantumruy Pro', sans-serif; line-height: 1.1; }

    .summary-text { font-size: 12.5px; margin-top: 3px; line-height: 1.45; color: var(--navy); }
    .summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; }

    .signature-grid {
      display: grid; grid-template-columns: 1.25fr 1.05fr 1.4fr; text-align: center; font-size: 12px; margin-top: 14px; align-items: start; color: var(--navy);
    }
    .sig-col { display: flex; flex-direction: column; align-items: center; }
    .sig-lunar { font-size: 9px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; line-height: 1.25; white-space: nowrap; }
    .sig-solar { font-size: 9.5px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; margin-bottom: 2px; line-height: 1.25; white-space: nowrap; }
    .sig-title { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-size: 11.5px; color: var(--navy); white-space: nowrap; }
    .sig-name { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; font-size: 13.5px; margin-top: 38px; white-space: nowrap; }

    @media screen and (max-width: 768px) {
      .no-print-bar { padding: 10px 14px; }
      .toolbar-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .toolbar-section { width: 100%; justify-content: space-between; }
      .panel-pill-box { width: 100%; }
      .zoom-btn-group { width: 100%; justify-content: center; }
      .zoom-btn { flex: 1; text-align: center; }
    }

    /* =========================================================
       🖨️ PRINT RULES (A4 LANDSCAPE)
    ========================================================= */
    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .booklet-container {
        box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important; max-height: 210mm !important; min-height: 210mm !important; padding: 6mm 7.5mm !important; page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important; border-radius: 0 !important;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       🎛️ NEW PREMIUM TOOLBAR DESIGN
  ========================================================= -->
  <div class="no-print-bar">
    <div class="toolbar-row">
      <div class="toolbar-section">
        <button class="btn btn-secondary" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i> ត្រឡប់
        </button>

        <!-- 🌟 បង្ហាញ Dropdown តែពេល Admin -->
        <div class="panel-pill-box" id="adminClassBox" style="display:none;">
          <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
          <select id="classSelect" class="form-control" onchange="onClassChange()">
            <option value="">កំពុងទាញយក...</option>
          </select>
        </div>

        <!-- 🌟 ផ្លាកថ្នាក់របស់គ្រូ (ពេលជាគ្រូ Dropdown នឹងលាក់) -->
        <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span id="teacherClassText">ថ្នាក់ទី...</span>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> ខែ៖</span>
          <select id="monthSelect" class="form-control" onchange="loadReportData()">
            <option value="មករា">មករា</option><option value="កុម្ភៈ">កុម្ភៈ</option>
            <option value="មីនា">មីនា</option><option value="មេសា">មេសា</option>
            <option value="ឧសភា">ឧសភា</option><option value="មិថុនា">មិថុនា</option>
            <option value="កក្កដា">កក្កដា</option><option value="សីហា">សីហា</option>
            <option value="កញ្ញា">កញ្ញា</option><option value="តុលា">តុលា</option>
            <option value="វិច្ឆិកា">វិច្ឆិកា</option><option value="ធ្នូ">ធ្នូ</option>
          </select>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-user" style="color:#10b981;"></i> សិស្ស៖</span>
          <select id="studentSelect" class="form-control" style="min-width:140px;" onchange="renderFilteredView()">
            <option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>
          </select>
        </div>
      </div>

      <div class="toolbar-section">
        <!-- 🔍 Zoom Buttons -->
        <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំ">
          <button type="button" class="zoom-btn active" id="z100" onclick="setZoom(1, 'z100')">100%</button>
          <button type="button" class="zoom-btn" id="z75" onclick="setZoom(0.75, 'z75')">75%</button>
          <button type="button" class="zoom-btn" id="z50" onclick="setZoom(0.5, 'z50')">50%</button>
        </div>

        <button class="btn btn-toggle" id="btnDisplayMode" onclick="toggleDisplayMode()">
          <i class="fa-solid fa-font"></i> បង្ហាញ: ធីក (និទ្ទេស)
        </button>

        <button class="btn btn-purple" id="btnCoverToggle" onclick="toggleCover()">
          <i class="fa-solid fa-book-open"></i> យកក្រប (១ សិស្ស/សន្លឹក)
        </button>

        <button class="btn btn-success" onclick="doPrint()" title="បោះពុម្ពសៀវភៅតាមដាន">
          <i class="fa-solid fa-print"></i> បោះពុម្ព (Print)
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       📄 BOOKLET PREVIEW CONTAINER
  ========================================================= -->
  <div class="preview-wrapper" id="reportContainer">
    <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
      <p style="margin-top:12px;">កំពុងរៀបចំទាញទិន្នន័យសៀវភៅតាមដាន...</p>
    </div>
  </div>

  <script>
    // =========================================================
    // ⚙️ THEME MANAGEMENT (SYNC 100% WITH HOMEPAGE)
    // =========================================================
    var _urlParams = new URLSearchParams(window.location.search);
    function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }
    function _set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

    function applyTheme(theme) {
      theme = theme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }

    var initialTheme = _urlParams.get('theme') || _get('krou_theme_manual') || 'dark';
    applyTheme(initialTheme);

    window.addEventListener('message', function(event) {
      if (event.data && (event.data.type === 'THEME_CHANGE' || event.data.theme)) {
        applyTheme(event.data.theme || event.data);
      }
    });

    // =========================================================
    // ⚙️ BACKEND API & CONFIGURATION
    // =========================================================
    var SCRIPT_URL = (window.parent && window.parent.BACKEND_URL)
      || _urlParams.get('apiUrl')
      || 'https://script.google.com/macros/s/AKfycbz9GLD2TJS4UPKVGxrc3H73tGCtjlMI7-56E7TlKcLHyBwqCiZ1jPF_okv2m1ubTjpy/exec';

    var TOKEN        = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('user_token') || _get('school_token') || '';
    var USER_ROLE    = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || 'teacher';
    var USER_CLASS   = (window.parent && window.parent.USER_CLASS)    || _urlParams.get('cls')   || _urlParams.get('class')   || _get('krou_assigned_class') || _get('krou_user_class') || '';
    var TEACHER_NAME = (window.parent && window.parent.TEACHER_NAME) || _get('krou_teacher_name') || '';

    const KHMER_MONTHS = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];

    function initCurrentMonth() {
      var now = new Date();

      if (select && currentMonthKh) {

    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = params.token || TOKEN;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[action](params);
        });
      }

      if (typeof callBackendApi === 'function') {
        try {
          var res = await callBackendApi(action, params);
          if (res && res.classes !== undefined) return res.classes;
          if (res && res.data !== undefined) return res.data;
          return res;
        } catch(e) {}
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      if (json && json.success === false) throw new Error(json.error || json.message || 'Server error');
      if (json && json.classes !== undefined) return json.classes;
      if (json && json.data !== undefined) return json.data;
      return json;
    }

              <div class="sig-col">
                <div>
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="f-bold" style="margin-top: 3px;">នាយកសាលា</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-title">មតិរបស់មាតាបិតា</div>
                  <div class="f-bold" style="margin-top: 3px;">ឬអាណាព្យាបាលសិស្ស</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-lunar">ថ្ងៃ.................... .... ខែ.......... ឆ្នាំ........... ព.ស. ២៥៧០</div>
                  <div class="sig-solar">ត្រូវនឹងថ្ងៃទី...... ខែ${month} ឆ្នាំ ២០២៦</div>
                  <div class="sig-title" style="margin-top: 3px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
                </div>
                <div class="sig-name">${TEACHER_NAME || ''}</div>
              </div>
            </div>
          </div>
        `;

        booklet.appendChild(leftPage);
        booklet.appendChild(rightPage);
        container.appendChild(booklet);
      });
    }

    function getGradeLetter(num) {
      if (num === null || isNaN(num) || num <= 0) return '';
      if (num >= 9.00) return 'A';
      if (num >= 8.00) return 'B';
      if (num >= 7.00) return 'C';
      if (num >= 6.00) return 'D';
      if (num >= 5.00) return 'E';
      return 'F';
    }
  </script>
</body>
