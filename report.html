<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សៀវភៅតាមដានការសិក្សា</title>
  
  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: #2b3544;
      color: var(--navy);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* ================= Top Action Toolbar ================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid #4b5563;
      background: #1f2937;
      color: #f3f4f6;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover { background: #374151; border-color: #9ca3af; }
    .btn.active { background: #2563eb; border-color: #60a5fa; color: #fff; }
    .btn-primary { background: #2563eb; border-color: #1d4ed8; color: #fff; font-weight: bold; }
    .btn-purple { background: #7c3aed; border-color: #6d28d9; color: #fff; }
    .btn-toggle { background: #059669; border-color: #047857; color: #fff; font-weight: bold; }

    select {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1f2937;
      color: #fff;
      border: 1px solid #4b5563;
      outline: none;
    }

    .preview-wrapper {
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: zoom 0.2s ease;
    }

    .booklet-container {
      background: #ffffff;
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      padding: 6mm 7.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
      page-break-after: always;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .page-box {
      border: 3.5px double var(--navy);
      padding: 13px 18px 10px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      background: #ffffff;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14.5px; letter-spacing: 6px; color: var(--red-star); margin: 2px 0 4px 0; }

    .cover-title-block { text-align: center; margin: 10px 0 8px 0; color: var(--navy); }
    .cover-title-block h2 { font-size: 17px; margin-bottom: 3px; }
    .cover-title-block h3 { font-size: 15.5px; margin-bottom: 6px; }
    .cover-title-block h1 { font-size: 29px; margin: 8px 0; letter-spacing: 0.5px; line-height: 1.35; }
    .cover-title-block .school-name { font-size: 16.5px; margin-top: 5px; }

    .dotted-info-list {
      margin: 14px 0 8px 0;
      display: flex;
      flex-direction: column;
      gap: 15.5px;
      font-size: 15.5px;
    }
    .info-row { display: flex; align-items: flex-end; width: 100%; }
    .info-label { white-space: nowrap; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; color: var(--navy); font-weight: bold; font-size: 15.5px; }
    .info-dots {
      flex: 1; border-bottom: 1.5px dotted #132d56; margin-left: 6px; padding-left: 6px; min-height: 23px;
      color: #0f172a; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-size: 15.5px;
    }

    .cover-footer { text-align: center; font-size: 21px; color: var(--navy); margin-top: 6px; margin-bottom: 2px; }

    .report-meta-grid {
      display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; margin: 2px 0 4px 0; font-size: 13.5px; color: var(--navy);
    }

    .score-table {
      width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; margin-bottom: 3px; border: 1.4px solid var(--navy); table-layout: fixed;
    }
    .score-table th, .score-table td { border: 1.15px solid var(--navy); padding: 1.8px 0.5px; height: 22px; vertical-align: middle; }
    .score-table th { background-color: #f8fafc; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; color: var(--navy); font-size: 13.5px; }
    .score-table td.subject-name {
      text-align: left; padding-left: 7px; font-size: 13px; color: var(--navy); font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-table .val-cell { font-weight: bold; color: var(--navy); font-size: 15.5px; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; }

    .th-grade { width: 8.8%; white-space: nowrap; padding: 1px 0 !important; }
    .grade-range { font-size: 8.8px; font-weight: normal; white-space: nowrap; display: inline-block; letter-spacing: -0.3px; font-family: 'Arial', 'Kantumruy Pro', sans-serif; line-height: 1.1; }

    .summary-text { font-size: 12.5px; margin-top: 3px; line-height: 1.45; color: var(--navy); }
    .summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; }

    .signature-grid {
      display: grid; grid-template-columns: 1.25fr 1.05fr 1.4fr; text-align: center; font-size: 12px; margin-top: 14px; align-items: start; color: var(--navy);
    }
    .sig-col { display: flex; flex-direction: column; align-items: center; }
    .sig-lunar { font-size: 9px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; line-height: 1.25; white-space: nowrap; }
    .sig-solar { font-size: 9.5px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; margin-bottom: 2px; line-height: 1.25; white-space: nowrap; }
    .sig-title { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-size: 11.5px; color: var(--navy); white-space: nowrap; }
    .sig-name { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; font-size: 13.5px; margin-top: 38px; white-space: nowrap; }

    @media print {
      html, body { background: none; padding: 0; margin: 0; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0; gap: 0; zoom: 1 !important; transform: none !important; }
      .booklet-container {
        box-shadow: none; margin: 0; width: 297mm; height: 210mm; max-height: 210mm; min-height: 210mm; padding: 6mm 7.5mm; page-break-after: always; break-after: page; page-break-inside: avoid;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- Top Action Toolbar -->
  <div class="no-print-bar">
    <div class="tool-group">
      <button class="btn" onclick="window.history.back()">⬅ ត្រឡប់</button>
      <button class="btn active" id="z100" onclick="setZoom(1, 'z100')">100%</button>
      <button class="btn" id="z75" onclick="setZoom(0.75, 'z75')">75%</button>
      <button class="btn" id="z50" onclick="setZoom(0.5, 'z50')">50%</button>
      <button class="btn btn-toggle" id="btnDisplayMode" onclick="toggleDisplayMode()">🔤A បង្ហាញ: ធីក (និទ្ទេស)</button>
      <button class="btn btn-purple" id="btnCoverToggle" onclick="toggleCover()">យកក្រប (១ សិស្ស/សន្លឹក)</button>
    </div>

    <div class="tool-group">
      <label>ថ្នាក់:</label>
      <select id="classSelect" onchange="onClassChange()">
        <option value="">កំពុងទាញយក...</option>
      </select>

      <label>ខែ:</label>
      <select id="monthSelect" onchange="loadReportData()">
        <option value="មករា">មករា</option><option value="កុម្ភៈ">កុម្ភៈ</option>
        <option value="មីនា">មីនា</option><option value="មេសា">មេសា</option>
        <option value="ឧសភា">ឧសភា</option><option value="មិថុនា">មិថុនា</option>
        <option value="កក្កដា">កក្កដា</option><option value="សីហា">សីហា</option>
        <option value="កញ្ញា" selected>កញ្ញា</option><option value="តុលា">តុលា</option>
        <option value="វិច្ឆិកា">វិច្ឆិកា</option><option value="ធ្នូ">ធ្នូ</option>
      </select>

      <label>សិស្ស:</label>
      <select id="studentSelect" onchange="renderFilteredView()">
        <option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>
      </select>

      <button class="btn btn-primary" onclick="doPrint()">🖨️ បោះពុម្ព (Print)</button>
    </div>
  </div>

  <div class="preview-wrapper" id="reportContainer">
    <div style="color: #fff; text-align: center; padding: 40px; font-size: 14px;">⚡ កំពុងរៀបចំទាញទិន្នន័យ...</div>
  </div>

  <!-- 🔗 ភ្ជាប់ api.js (បើមាន) -->
  <script src="api.js"></script>

  <script>
    // =========================================================
    // ⚙️ CONFIG & GITHUB/APPS SCRIPT BRIDGING
    // =========================================================
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe6vrQshGAPglgmmZykljXazDNh1ZwWSRdFDAip1WWWRky24lmBo-qicLK3_i10AvT/exec';

    var _urlParams = new URLSearchParams(window.location.search);
    function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }

    var TOKEN        = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('school_token') || '';
    var USER_ROLE    = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || _get('school_user_role')  || 'teacher';
    var USER_CLASS   = _urlParams.get('cls') || _urlParams.get('class') || _get('krou_user_class') || _get('school_user_class') || '';
    var TEACHER_NAME = (window.parent && window.parent.TEACHER_NAME) || _get('krou_teacher_name') || '';
    var TEACHER_SEX  = (window.parent && window.parent.TEACHER_SEX)  || _get('krou_teacher_sex') || '';

    // ── Universal API Caller ──
    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = params.token || TOKEN;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[action](params);
        });
      }

      if (typeof callBackendApi === 'function') {
        return callBackendApi(action, params);
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      if (json && json.success === false) throw new Error(json.error || json.message || 'Server error');
      if (json && json.data !== undefined) return json.data;
      return json;
    }

    var SUBJECTS = [
      { key: 'kh_listen', label: 'សមត្ថភាពស្តាប់' },
      { key: 'kh_write',  label: 'សមត្ថភាពសរសេរ' },
      { key: 'kh_read',   label: 'សមត្ថភាពអាន' },
      { key: 'kh_speak',  label: 'សមត្ថភាពនិយាយ' },
      { key: 'm_num',     label: 'ចំនួន' },
      { key: 'm_measure', label: 'រង្វាស់រង្វាល់' },
      { key: 'm_geo',     label: 'ធរណីមាត្រ' },
      { key: 'm_algebra', label: 'ពិជគណិត' },
      { key: 'm_stat',    label: 'ស្ថិតិ' },
      { key: 'science',   label: 'វិទ្យាសាស្ត្រ' },
      { key: 'social',    label: 'សិក្សាសង្គម' },
      { key: 'a_craft',   label: 'គេហវិទ្យា-អប់រំសិល្បៈ' },
      { key: 'a_pe',      label: 'អប់រំកាយ-កីឡា' },
      { key: 'a_health',  label: 'សុខភាព-អនាម័យ' },
      { key: 'a_env',     label: 'អប់រំបរិស្ថាន' },
      { key: 'foreign',   label: 'ភាសាបរទេស' }
    ];

    var showCover = true;
    var displayMode = 'tick';
    var allStudentsData = [];
    var classSavedScores = {};
    var classAttendanceMap = {};
    var currentClassName = '';

    window.onload = function() {
      initClasses();
    };

    function toggleDisplayMode() {
      if (displayMode === 'tick') {
        displayMode = 'score';
        document.getElementById('btnDisplayMode').textContent = '🔢 បង្ហាញ: ពិន្ទុ (លេខ)';
      } else {
        displayMode = 'tick';
        document.getElementById('btnDisplayMode').textContent = '🔤A បង្ហាញ: ធីក (និទ្ទេស)';
      }
      renderFilteredView();
    }

    function setZoom(scale, btnId) {
      var container = document.getElementById('reportContainer');
      if (container) container.style.zoom = scale;
      ['z100', 'z75', 'z50'].forEach(id => {
        var el = document.getElementById(id);
        if (el) el.classList.remove('active');
      });
      var matched = document.getElementById(btnId);
      if (matched) matched.classList.add('active');
    }

    function doPrint() {
      window.focus();
      setTimeout(function() {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    function toggleCover() {
      showCover = !showCover;
      document.getElementById('btnCoverToggle').textContent = showCover ? 'យកក្រប (១ សិស្ស/សន្លឹក)' : 'មិនយកក្រប (តែតារាង)';
      document.querySelectorAll('.page-left').forEach(el => {
        el.style.display = showCover ? 'flex' : 'none';
      });
      document.querySelectorAll('.booklet-container').forEach(el => {
        el.style.gridTemplateColumns = showCover ? '1fr 1fr' : '1fr';
        el.style.width = showCover ? '297mm' : '160mm';
      });
    }

    async function initClasses() {
      var sel = document.getElementById('classSelect');
      sel.innerHTML = '<option value="">កំពុងទាញយក...</option>';

      try {
        var res = await apiCall('getClassListForSession', { token: TOKEN });
        var classes = Array.isArray(res) ? res : (res && res.classes ? res.classes : []);
        sel.innerHTML = '';

        if (!classes || classes.length === 0) {
          sel.innerHTML = '<option value="">គ្មានថ្នាក់</option>';
          return;
        }

        classes.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'ថ្នាក់ទី ' + c;
          sel.appendChild(opt);
        });

        if (USER_CLASS && USER_ROLE !== 'admin') {
          sel.value = USER_CLASS;
          sel.disabled = true;
        }

        onClassChange();
      } catch(err) {
        console.error(err);
        sel.innerHTML = '<option value="">បរាជ័យក្នុងការទាញយក</option>';
      }
    }

    function onClassChange() {
      currentClassName = document.getElementById('classSelect').value;
      if (!currentClassName) return;
      loadReportData();
    }

    async function loadReportData() {
      var cls = document.getElementById('classSelect').value;
      var month = document.getElementById('monthSelect').value;
      if (!cls || !month) return;

      document.getElementById('reportContainer').innerHTML = '<div style="color: #fff; text-align: center; padding: 40px; font-size: 14px;">⚡ កំពុងទាញយកទិន្នន័យយ៉ាងរហ័ស...</div>';

      try {
        var res = await apiCall('getReportBundleSecured', { token: TOKEN, className: cls, cls: cls, month: month });
        if (!res || res.success === false) {
          document.getElementById('reportContainer').innerHTML = '<div style="color: #f87171; text-align: center; padding: 40px;">កំហុស៖ ' + (res ? (res.error || res.message) : 'មិនអាចទាញទិន្នន័យ') + '</div>';
          return;
        }

        allStudentsData = res.students || [];
        classSavedScores = res.scores || {};
        classAttendanceMap = res.attendance || {};

        var sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>';
        allStudentsData.forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.id + ' - ' + s.name;
          sSelect.appendChild(opt);
        });

        renderFilteredView();
      } catch(err) {
        document.getElementById('reportContainer').innerHTML = '<div style="color: #f87171; text-align: center; padding: 40px;">កំហុស Server: ' + (err.message || err) + '</div>';
      }
    }

    function renderFilteredView() {
      var selectedSid = document.getElementById('studentSelect').value;
      var month = document.getElementById('monthSelect').value;
      var cls = document.getElementById('classSelect').value;
      var container = document.getElementById('reportContainer');
      container.innerHTML = '';

      var targetList = (selectedSid === 'ALL') ? allStudentsData : allStudentsData.filter(s => s.id === selectedSid);

      if (!targetList || targetList.length === 0) {
        container.innerHTML = '<div style="color: #fff; text-align: center; padding: 40px;">មិនមានទិន្នន័យសិស្សឡើយ</div>';
        return;
      }

      var sortedRanks = Object.keys(classSavedScores).map(function(k) {
        return { id: k, avg: parseFloat(classSavedScores[k].avg) || 0 };
      }).sort((a,b) => b.avg - a.avg);

      var rankMap = {};
      sortedRanks.forEach((r, idx) => {
        rankMap[r.id] = (idx > 0 && r.avg === sortedRanks[idx-1].avg) ? rankMap[sortedRanks[idx-1].id] : idx + 1;
      });

      targetList.forEach(function(student, index) {
        var scoreData = classSavedScores[student.id] || {};
        var attData = classAttendanceMap[student.id] || { totalPermission: 0, totalAbsent: 0 };
        var totalAbs = (attData.totalPermission || 0) + (attData.totalAbsent || 0);

        var avg = parseFloat(scoreData.avg) || 0;
        var rank = rankMap[student.id] || '-';
        var gradeLetter = getGradeLetter(avg);

        var booklet = document.createElement('div');
        booklet.className = 'booklet-container';
        booklet.style.gridTemplateColumns = showCover ? '1fr 1fr' : '1fr';
        booklet.style.width = showCover ? '297mm' : '160mm';

        // ================= LEFT COVER =================
        var leftPage = document.createElement('div');
        leftPage.className = 'page-box page-left';
        leftPage.style.display = showCover ? 'flex' : 'none';
        leftPage.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
            <div>
              <div class="header-text">
                <h2 class="f-moul">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                <h3 class="f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                <div class="header-icons">✻ ✻ ✻ 📖 ✻ ✻ ✻</div>
              </div>

              <div class="cover-title-block">
                <h2 class="f-moul">ក្រសួងអប់រំ យុវជន និងកីឡា</h2>
                <h3 class="f-moul">ការិយាល័យអប់រំ យុវជន និងកីឡា</h3>
                <h1 class="f-moul">សៀវភៅតាមដានការសិក្សា</h1>
                <h3 class="f-moul school-name">សាលាបឋមសិក្សាកំពង់ល្ពៅ</h3>
              </div>

              <div class="dotted-info-list">
                <div class="info-row">
                  <span class="info-label">ឈ្មោះសិស្ស:</span>
                  <span class="info-dots" style="max-width: 155px; font-weight: bold;">${student.name || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ភេទ:</span>
                  <span class="info-dots" style="max-width: 60px;">${student.sex || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ថ្នាក់:</span>
                  <span class="info-dots">ថ្នាក់ទី ${cls}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អត្តលេខ:</span>
                  <span class="info-dots" style="max-width: 80px;">${student.id || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ថ្ងៃ ខែ ឆ្នាំកំណើត:</span>
                  <span class="info-dots">${student.dob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ទីកន្លែងកំណើត:</span>
                  <span class="info-dots">${student.pob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ឪពុកឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.father || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.fatherJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ម្តាយឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.mother || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.motherJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អាណាព្យាបាលឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.guardian || student.father || student.mother || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.guardianJob || student.fatherJob || student.motherJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អាសយដ្ឋានបច្ចុប្បន្ន:</span>
                  <span class="info-dots">${student.address || ''}</span>
                </div>
              </div>
            </div>

            <div class="cover-footer f-moul">
              ឆ្នាំសិក្សា ២០២៦-២០២៧
            </div>
          </div>
        `;

        // ================= RIGHT REPORT =================
        var tableRowsHtml = '';
        SUBJECTS.forEach(function(sub) {
          var rawVal = scoreData[sub.key];
          var val = (rawVal !== undefined && rawVal !== null && rawVal !== '') ? Number(rawVal) : null;
          var sGrade = val !== null ? getGradeLetter(val) : '';

          function getCellContent(gradeCode) {
            if (sGrade !== gradeCode || val === null) return '';
            return displayMode === 'tick' ? '✔' : val.toFixed(val % 1 === 0 ? 0 : 1);
          }

          tableRowsHtml += `
            <tr>
              <td class="subject-name">${sub.label}</td>
              <td class="val-cell">${getCellContent('A')}</td>
              <td class="val-cell">${getCellContent('B')}</td>
              <td class="val-cell">${getCellContent('C')}</td>
              <td class="val-cell">${getCellContent('D')}</td>
              <td class="val-cell">${getCellContent('E')}</td>
              <td class="val-cell">${getCellContent('F')}</td>
              <td></td>
            </tr>
          `;
        });

        var rightPage = document.createElement('div');
        rightPage.className = 'page-box page-right';
        rightPage.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            <div>
              <div class="header-text">
                <h2 class="f-moul" style="font-size: 16px;">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                <h3 class="f-moul" style="font-size: 14.5px;">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                <div class="f-bold" style="font-size: 13.5px; margin-top: 1px;">ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
              </div>

              <div class="report-meta-grid">
                <div class="f-bold">ថ្នាក់ទី ${cls}</div>
                <div class="f-bold" style="text-align: right;">លទ្ធផលនៃការសិក្សាប្រចាំខែ${month}</div>
                <div style="grid-column: span 2; display: flex; justify-content: space-between; margin-top: 2px;">
                  <span>លេខរៀងទី: <strong class="f-bold">${index + 1}</strong></span>
                  <span>សិស្សឈ្មោះ: <strong class="f-bold">${student.name}</strong></span>
                  <span>ភេទ: <strong class="f-bold">${student.sex}</strong></span>
                  <span>អត្តលេខ: <strong class="f-bold">${student.id}</strong></span>
                </div>
              </div>

              <table class="score-table">
                <thead>
                  <tr>
                    <th rowspan="2" style="width: 29%; font-size: 13px;">មុខវិជ្ជា</th>
                    <th colspan="6" style="font-size: 13px;">និទ្ទេស</th>
                    <th rowspan="2" style="width: 18.2%; font-size: 11px; line-height: 1.25;">ចំណុចដែលត្រូវ<br>ជួយពង្រឹងបន្ថែម</th>
                  </tr>
                  <tr>
                    <th class="th-grade">A<br><span class="grade-range">9.00-10</span></th>
                    <th class="th-grade">B<br><span class="grade-range">8.00-8.99</span></th>
                    <th class="th-grade">C<br><span class="grade-range">7.00-7.99</span></th>
                    <th class="th-grade">D<br><span class="grade-range">6.00-6.99</span></th>
                    <th class="th-grade">E<br><span class="grade-range">5.00-5.99</span></th>
                    <th class="th-grade">F<br><span class="grade-range">4.99-0</span></th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>

              <div class="summary-text">
                <div class="summary-row">
                  <span>-មធ្យមភាគ <strong class="f-bold">${avg > 0 ? avg.toFixed(2) : '-'}</strong></span>
                  <span>-ចំណាត់ថ្នាក់ <strong class="f-bold">${rank}</strong></span>
                  <span>-និទ្ទេស <strong class="f-bold">${gradeLetter || '-'}</strong></span>
                  <span>អវត្តមាន: ឥត.ច្បាប់ <strong class="f-bold">${attData.totalAbsent || 0}</strong> - ម.ច្បាប់ <strong class="f-bold">${attData.totalPermission || 0}</strong> - សរុប <strong class="f-bold">${totalAbs}</strong></span>
                </div>
                <div style="margin-top: 2px;">
                  វិន័យនិងសីលធម៌: ............................................................................................................
                </div>
              </div>
            </div>

            <div class="signature-grid">
              <div class="sig-col">
                <div>
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="f-bold" style="margin-top: 3px;">នាយកសាលា</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-title">មតិរបស់មាតាបិតា</div>
                  <div class="f-bold" style="margin-top: 3px;">ឬអាណាព្យាបាលសិស្ស</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-lunar">ថ្ងៃ.................... .... ខែ.......... ឆ្នាំ........... ព.ស. ២៥៧០</div>
                  <div class="sig-solar">ត្រូវនឹងថ្ងៃទី...... ខែ${month} ឆ្នាំ ២០២៦</div>
                  <div class="sig-title" style="margin-top: 3px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
                </div>
                <div class="sig-name">${TEACHER_NAME || ''}</div>
              </div>
            </div>
          </div>
        `;

        booklet.appendChild(leftPage);
        booklet.appendChild(rightPage);
        container.appendChild(booklet);
      });
    }

    function getGradeLetter(num) {
      if (num === null || isNaN(num) || num <= 0) return '';
      if (num >= 9.00) return 'A';
      if (num >= 8.00) return 'B';
      if (num >= 7.00) return 'C';
      if (num >= 6.00) return 'D';
      if (num >= 5.00) return 'E';
      return 'F';
    }
  </script>
</body>
</html>
