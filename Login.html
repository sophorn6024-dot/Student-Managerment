<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ចូលប្រើប្រាស់ប្រព័ន្ធ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Kantumruy Pro',sans-serif}
    html,body{width:100%;height:100%;overflow:hidden}
    body{background:radial-gradient(circle at 50% 10%,#294aa0 0,#172554 36%,#07111f 100%);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
    body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(3px);pointer-events:none}
    body:before{width:360px;height:360px;right:-130px;top:-120px;background:rgba(59,130,246,.18)}
    body:after{width:300px;height:300px;left:-140px;bottom:-120px;background:rgba(124,58,237,.18)}
    .stars{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:42px 42px}
    .login-wrap{width:min(92vw,430px);position:relative;z-index:2}
    .mascot{height:112px;display:flex;justify-content:center;align-items:flex-end;position:relative;margin-bottom:-18px;z-index:3}
    .husky{width:112px;height:88px;position:relative;animation:float 3s ease-in-out infinite}
    .ear{position:absolute;top:4px;width:36px;height:42px;background:#cbd5e1;border:4px solid #e2e8f0;transform:rotate(28deg);border-radius:10px 24px 8px 22px;z-index:0}
    .ear.left{left:11px}.ear.right{right:11px;transform:scaleX(-1) rotate(28deg)}
    .head{position:absolute;left:12px;top:17px;width:88px;height:68px;border-radius:48% 48% 44% 44%;background:linear-gradient(180deg,#e5e7eb,#94a3b8);border:4px solid #e2e8f0;box-shadow:0 10px 24px rgba(0,0,0,.22);overflow:hidden}
    .mask{position:absolute;left:9px;top:7px;width:70px;height:54px;background:linear-gradient(135deg,#1e293b,#334155);clip-path:polygon(50% 0,72% 25%,100% 55%,78% 100%,50% 77%,22% 100%,0 55%,28% 25%)}
    .muzzle{position:absolute;left:25px;bottom:6px;width:38px;height:27px;border-radius:50%;background:#f8fafc}
    .nose{position:absolute;left:14px;top:3px;width:10px;height:7px;border-radius:50%;background:#111827}
    .eye{position:absolute;top:27px;width:14px;height:14px;border-radius:50%;background:#f8fafc;border:3px solid #0f172a;overflow:hidden;animation:blink 4.5s infinite}
    .eye:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#0f172a;left:3px;top:3px;animation:look 2.4s ease-in-out infinite}
    .eye.left{left:21px}.eye.right{right:21px}
    .paw{position:absolute;bottom:-8px;width:31px;height:25px;background:#e2e8f0;border:3px solid #cbd5e1;border-radius:50%;z-index:4;animation:paw 2.2s ease-in-out infinite}
    .paw.left{left:17px;transform:rotate(10deg)}.paw.right{right:17px;transform:rotate(-10deg);animation-delay:.15s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}
    @keyframes look{0%,100%{transform:translate(0)}50%{transform:translate(3px,1px)}}
    @keyframes paw{0%,100%{transform:translateY(0) rotate(10deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
    .paw.right{animation-name:pawRight}@keyframes pawRight{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-5px) rotate(3deg)}}
    .card{background:rgba(255,255,255,.97);color:#0f172a;border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:34px 28px 25px;box-shadow:0 25px 70px rgba(0,0,0,.34),0 0 0 1px rgba(255,255,255,.08);backdrop-filter:blur(18px)}
    .brand{text-align:center}.brand h1{font-family:'Moul',serif;font-size:18px;font-weight:400;color:#0f172a;line-height:1.7}.brand p{font-size:12px;color:#64748b;margin-top:2px}
    .line{height:1px;background:linear-gradient(90deg,transparent,#dbeafe,transparent);margin:20px 0}
    .field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:7px}.input-wrap{position:relative}.input-wrap input{width:100%;height:48px;border:1px solid #dbe3ef;border-radius:14px;background:#f8fafc;color:#0f172a;padding:0 14px;font-size:14px;outline:none;transition:.2s}.input-wrap input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1);background:#fff}.toggle{position:absolute;right:8px;top:7px;width:34px;height:34px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:16px}.toggle:hover{background:#eff6ff}
    .error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:13px}.error.show{display:block;animation:shake .3s ease}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    .quick{display:none;margin-bottom:13px;padding:11px 12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:13px;color:#1e40af;font-size:12px}.quick.show{display:flex;align-items:center;justify-content:space-between;gap:8px}.quick button{border:0;background:#2563eb;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px;cursor:pointer}
    .login-btn{position:relative;width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;box-shadow:0 12px 24px rgba(37,99,235,.25);transition:transform .15s,box-shadow .2s}.login-btn:hover{box-shadow:0 15px 28px rgba(37,99,235,.32);transform:translateY(-1px)}.login-btn:active{transform:scale(.985)}.login-btn:disabled{cursor:default}
    .btn-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;z-index:5}.door{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:37px;height:38px;border:2px solid rgba(255,255,255,.78);border-radius:6px 6px 3px 3px;background:rgba(15,23,42,.2);transform-origin:left center;transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:3}.door:after{content:"";position:absolute;right:4px;top:18px;width:4px;height:4px;border-radius:50%;background:#fff}.person{position:absolute;left:50%;top:9px;width:10px;height:29px;transform:translateX(-50%) translateX(0);opacity:0;z-index:2;transition:transform .76s linear,opacity .15s}.person:before{content:"";position:absolute;left:1px;top:0;width:8px;height:8px;border-radius:50%;background:#fef3c7}.bodyp{position:absolute;left:3px;top:8px;width:4px;height:12px;border-radius:4px;background:#fef3c7}.leg{position:absolute;top:19px;width:3px;height:10px;border-radius:3px;background:#fef3c7;transform-origin:top center}.leg.one{left:2px}.leg.two{right:2px}.login-btn.dooropen .btn-label,.login-btn.walking .btn-label{opacity:0}.login-btn.dooropen .door{transform:translateX(-50%) rotateY(72deg)}.login-btn.dooropen .person{opacity:1}.login-btn.walking .person{transform:translateX(-50%) translateX(38px)}.login-btn.walking .leg.one{animation:walk1 .16s linear infinite alternate}.login-btn.walking .leg.two{animation:walk2 .16s linear infinite alternate}@keyframes walk1{to{transform:rotate(35deg)}}@keyframes walk2{to{transform:rotate(-35deg)}}.login-btn.success{background:linear-gradient(135deg,#059669,#10b981)}.login-btn.success .door{opacity:0}.login-btn.success .person{opacity:0;transform:translateX(-50%) translateX(60px)}
    .footer{text-align:center;margin-top:18px;color:#94a3b8;font-size:10.5px}.footer strong{color:#64748b}
    .loading{display:none;position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}.login-btn.loading-state .loading{display:block;left:50%;top:18px;transform:translateX(-50%)}.login-btn.dooropen.loading-state .loading,.login-btn.walking.loading-state .loading{display:none}.login-btn.verify.loading-state .btn-label{opacity:0}.login-btn.verify.loading-state .loading{display:block}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
    @media(max-height:650px){.mascot{height:85px}.card{padding-top:25px}.line{margin:13px 0}.field{margin-bottom:11px}}
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="login-wrap">
    <div class="mascot" aria-hidden="true">
      <div class="husky">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="head"><div class="mask"></div><div class="eye left"></div><div class="eye right"></div><div class="muzzle"><div class="nose"></div></div></div>
        <div class="paw left"></div><div class="paw right"></div>
      </div>
    </div>
    <section class="card">
      <div class="brand">
        <h1>សាលាបឋមសិក្សាកំពង់ល្ពៅ</h1>
        <p>ប្រព័ន្ធគ្រប់គ្រងសិស្ស និងគ្រូបង្រៀន</p>
      </div>
      <div class="line"></div>
      <div class="quick" id="quickBox"><span>🔐 មានគណនីដែលបានចូលពីមុន</span><button type="button" onclick="continueToDashboard()">បន្តចូល</button></div>
      <div class="error" id="errorBox"></div>
      <form id="loginForm" onsubmit="doLogin(event)" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap"><input id="username" name="username" type="text" autocomplete="username" placeholder="បញ្ចូល Username" required></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="បញ្ចូល Password" required><button class="toggle" type="button" onclick="togglePass()" aria-label="បង្ហាញ Password">👁️</button></div>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">
          <span class="btn-label"><span>🚪</span><span>ចូលប្រើប្រាស់ប្រព័ន្ធ</span></span>
          <span class="door"></span><span class="person"><i class="bodyp"></i><i class="leg one"></i><i class="leg two"></i></span><span class="loading"></span>
        </button>
      </form>
      <div class="footer">© <span id="year"></span> <strong></strong> សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
    </section>
  </div>
<script>
  var WEBAPP_URL = "<?= scriptUrl ?>";
  var TOKEN_KEY = 'school_persistent_token';
  var loginBtn = document.getElementById('loginBtn');
  var errorBox = document.getElementById('errorBox');

  function hideError(){ errorBox.classList.remove('show'); errorBox.textContent=''; }
  function showError(msg){ errorBox.textContent = msg || 'មានបញ្ហាក្នុងការចូលប្រព័ន្ធ។'; errorBox.classList.add('show'); }
  function setLoading(on){ loginBtn.disabled=on; loginBtn.classList.toggle('loading-state',on); }
  function wait(ms){ return new Promise(function(resolve){setTimeout(resolve,ms);}); }
  function getWebAppUrl(){ return WEBAPP_URL || window.location.href.split('?')[0]; }

  function safeRedirect(token){
    if(!token){
      showError('មិនអាចបង្កើត Session បានទេ។ សូមព្យាយាមម្ដងទៀត។');
      setLoading(false);
      return;
    }

    try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}

    var base = getWebAppUrl();
    var sep = base.indexOf('?') >= 0 ? '&' : '?';
    var url = base + sep + 'token=' + encodeURIComponent(token);

    try{
      window.top.location.replace(url);
    }catch(e){
      window.location.href = url;
    }
  }

  function continueToDashboard(){
    hideError();
    var token=''; try{ token=localStorage.getItem(TOKEN_KEY)||''; }catch(e){}
    if(!token){ document.getElementById('quickBox').classList.remove('show'); return; }
    google.script.run.withSuccessHandler(function(s){
      if(s && s.loggedIn){ safeRedirect(token); }
      else { try{localStorage.removeItem(TOKEN_KEY)}catch(e){}; document.getElementById('quickBox').classList.remove('show'); showError('Session ចាស់មិនអាចប្រើបានទៀតទេ។ សូម Login ម្ដងទៀត។'); }
    }).withFailureHandler(function(){
      try{localStorage.removeItem(TOKEN_KEY)}catch(e){}; document.getElementById('quickBox').classList.remove('show'); showError('មិនអាចពិនិត្យ Session បានទេ។ សូម Login ម្ដងទៀត។');
    }).getCurrentSession(token);
  }

  async function doLogin(ev){
    ev.preventDefault(); hideError();
    var username=document.getElementById('username').value.trim();
    var password=document.getElementById('password').value;
    if(!username || !password){ showError('សូមបញ្ចូល Username និង Password។'); return; }
    setLoading(true);
    loginBtn.classList.add('dooropen');
    await wait(380);
    loginBtn.classList.add('walking');
    google.script.run.withSuccessHandler(async function(result){
      if(result && result.success && result.token){
        await wait(760);
        loginBtn.classList.remove('walking'); loginBtn.classList.remove('dooropen');
        loginBtn.classList.add('verify');
        try{ localStorage.setItem(TOKEN_KEY,result.token); }catch(e){}
        await wait(280);
        loginBtn.classList.remove('verify');
        loginBtn.classList.add('success');
        await wait(220);
        safeRedirect(result.token);
      }else{
        loginBtn.classList.remove('walking','dooropen','verify'); setLoading(false); showError(result && result.message ? result.message : 'Username ឬ Password មិនត្រឹមត្រូវទេ។');
      }
    }).withFailureHandler(function(err){
      loginBtn.classList.remove('walking','dooropen','verify'); setLoading(false); showError(err && err.message ? err.message : 'មានបញ្ហាក្នុងការភ្ជាប់ទៅ Server។');
    }).checkLogin(username,password);
  }

  function togglePass(){ var p=document.getElementById('password'), b=document.querySelector('.toggle'); if(p.type==='password'){p.type='text';b.textContent='🙈'}else{p.type='password';b.textContent='👁️'} }
  document.getElementById('year').textContent=new Date().getFullYear();
  document.addEventListener('DOMContentLoaded',function(){
    var token=''; try{token=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
    if(token) document.getElementById('quickBox').classList.add('show');
    document.getElementById('username').focus();
  });
</script>
</body>
</html>
