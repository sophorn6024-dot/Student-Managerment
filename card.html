<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កាតសម្គាល់ខ្លួនសិស្ស - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --c-blue: #001fd1;
      --c-green: #009639;
      --c-orange: #c85000;
      --c-red: #e60000;
      --c-border: #0022cc;
      --stamp-w: 34mm;
      --stamp-h: 23.8mm;
      --stamp-top: -3px;
      --stamp-left: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* ── អូស Scroll មើលសិស្សចុងក្រោយបានរលូន ── */
    html, body {
      min-height: 100%;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: 'Siemreap', 'Battambang', Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding-bottom: 120px;
    }

    /* ── Toolbar ── */
    .no-print-toolbar {
      position: sticky; top: 0; z-index: 1000;
      background: #fff; padding: 10px 18px;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.08);
      border-bottom: 1.5px solid #e2e8f0;
    }
    .toolbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .form-control {
      padding: 6px 9px; font-family: inherit; font-size: 13px;
      border: 1.5px solid #cbd5e1; border-radius: 6px; outline: none; background: #fff;
    }
    .form-control:disabled {
      background: #e2e8f0; color: #1e3a8a; cursor: not-allowed;
      font-weight: 700; border-color: #94a3b8;
    }

    .btn {
      padding: 6px 12px; font-family: inherit; font-size: 13px; font-weight: 700;
      border-radius: 6px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: all .2s;
    }
    .btn-primary  { background: #2563eb; color: #fff; }
    .btn-primary:hover  { background: #1d4ed8; }
    .btn-success  { background: #16a34a; color: #fff; }
    .btn-success:hover  { background: #15803d; }
    .btn-danger   { background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; }
    .btn-danger:hover   { background: #fecaca; }
    .btn-outline  { background: #fff; border: 1.5px solid #cbd5e1; color: #334155; }
    .btn-outline:hover  { background: #f8fafc; border-color: #94a3b8; }

    /* ── STYLES FOR ZOOM BUTTONS ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #0f172a;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .zoom-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #64748b;
    }
    .zoom-btn.active {
      background: #2563eb !important;
      border-color: #3b82f6 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.45);
    }

    /* ── Print area ── */
    .print-area {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 15px; gap: 20px;
      padding-bottom: 80px;
      transition: transform 0.2s ease, zoom 0.2s ease;
    }

    .a4-page {
      width: 297mm;
      height: 209mm;
      background: #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,.1);
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* ── 3x2 (6 កាត) រក្សាទំហំ 7cm × 10cm ── */
    .a4-page.layout-6 {
      display: grid;
      grid-template-columns: repeat(3, 70mm);
      grid-template-rows: repeat(2, 100mm);
      justify-content: center;
      align-content: center;
      gap: 3mm 14mm;
      padding: 2mm 4mm;
    }

    /* ── 4x2 (8 កាត) ទំហំ 7cm × 10cm ── */
    .a4-page.layout-8 {
      display: grid;
      grid-template-columns: repeat(4, 70mm);
      grid-template-rows: repeat(2, 100mm);
      justify-content: center;
      align-content: center;
      gap: 3mm 3mm;
      padding: 2mm 4mm;
    }

    /* ── Student Card ── */
    .student-card {
      width: 70mm;
      height: 100mm;
      border: 1.8px solid var(--c-border);
      background: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .card-top-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1.8px solid var(--c-border);
      padding: 1px 4px;
      background: #fff;
      height: 33px;
      flex-shrink: 0;
    }
    .header-logo-box {
      position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .header-logo-img { width: 26px; height: 26px; object-fit: contain; }
    .header-kingdom { width: 100%; text-align: center; line-height: 1.15; z-index: 1; }
    .kingdom-title    { font-family: 'Moul', serif; font-size: 8.2px; color: #000; letter-spacing: -.1px; }
    .kingdom-subtitle { font-family: 'Moul', serif; font-size: 7.5px; color: #000; margin-top: 1px; }
    .kingdom-divider  { display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .kingdom-divider svg { width: 72px; height: 3.5px; }

    .card-main-body {
      flex: 1; padding: 2px 5px 2px 5px; position: relative;
      display: flex; flex-direction: column; justify-content: flex-start;
    }
    .card-watermark {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 44mm; height: 44mm; opacity: .22; pointer-events: none; z-index: 0; object-fit: contain;
    }

    /* ── ផ្នែកចំណងជើង ── */
    .card-titles {
      position: relative; z-index: 1; text-align: center;
      display: flex; flex-direction: column; align-items: center;
      gap: 1px;
      margin-bottom: 1px;
    }
    .title-badge        { font-family: 'Moul', serif; font-size: 9.2px; color: var(--c-blue); letter-spacing: .2px; line-height: 1.35; }
    .title-school       { font-family: 'Moul', serif; font-size: 8.3px; color: var(--c-green); line-height: 1.35; }
    .title-id           { font-family: 'Moul', serif; font-size: 8.8px; color: var(--c-orange); line-height: 1.35; }

    /* ── 🌟 កែសម្រួលឈ្មោះសិស្ស៖ មិនឱ្យដាច់ស្រៈខាងលើ (ស្រៈ ី, ឺ, ើ, ័, ៍...) ── */
    .title-student-name-center {
      font-family: 'Moul', 'Khmer OS Muol Light', serif;
      font-size: 12.2px;
      color: var(--c-blue);
      text-align: center;
      line-height: 1.65; /* ផ្តល់គម្លាតកម្ពស់ឱ្យស្រៈលើខ្ពស់ស្រឡះ */
      padding-top: 4px;   /* ធានាថាមិនប៉ះគែមលើដែលនាំឱ្យដាច់ស្រៈ */
      padding-bottom: 1px;
      width: 100%;
      white-space: nowrap;
      overflow: visible;  /* ការពារកុំឱ្យកាត់ក្បាលស្រៈ */
      letter-spacing: .2px;
    }

    /* ── លើកតារាងព័ត៌មានឱ្យកៀកនឹងឈ្មោះសិស្ស ── */
    .content-container { 
      position: relative; 
      z-index: 1; 
      display: flex; 
      flex-direction: column; 
      margin-top: 1px; 
    }
    
    .mid-split { 
      display: flex; 
      justify-content: space-between; 
      align-items: stretch; 
      gap: 5px; 
      height: 25.5mm; 
    }
    .left-profile-block { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    /* ── គម្លាតជួរអក្សរក្នុងតារាងលើក្រោម ── */
    .info-table-top  { width: 100%; height: 100%; border-collapse: collapse; font-size: 8.8px; line-height: 1.42; }
    .info-table-top tr { height: 20%; }
    .info-table-top td { padding: 1.2px 0; vertical-align: middle; }

    .info-table-bottom { width: 100%; border-collapse: collapse; font-size: 8.8px; line-height: 1.42; margin-top: 2.5px; }
    .info-table-bottom tr { height: 15.5px; }
    .info-table-bottom td { padding: 1.2px 0; vertical-align: middle; }

    .lbl-col { width: 68px; color: var(--c-red); font-weight: 700; white-space: nowrap; text-align: left; }
    .cln-col { width: 8px; color: var(--c-red); font-weight: 700; text-align: center; padding-right: 1px; }
    .val-col { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-size: 9px; }
    .val-blue  { color: var(--c-blue); }
    .val-green { color: var(--c-green); }

    /* ── រូបថតសិស្ស ── */
    .student-photo-box {
      width: 19mm; height: 25.5mm; border: 1.5px solid #000;
      border-radius: 4px; background: #fff; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .student-photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .student-photo-box i { font-size: 24px; color: #cbd5e1; }

    /* ── ផ្នែកខាងក្រោម (ហត្ថលេខា & ត្រា មានផ្ទៃទំនេរធំទូលាយ) ── */
    .card-bottom-signature {
      position: relative; z-index: 2;
      display: flex; justify-content: flex-start;
      padding-left: 3px;
      margin-top: auto;
      margin-bottom: 3.5mm;
    }
    .signature-box { display: flex; flex-direction: column; align-items: center; position: relative; width: 44mm; text-align: center; }
    .sig-date { font-family: inherit; font-weight: 700; font-size: 6.8px; color: #000; line-height: 1.15; white-space: nowrap; text-align: center; }

    .sig-stamp-wrapper {
      position: relative; display: flex; flex-direction: column; align-items: center;
      width: 100%; margin-top: 1px; min-height: 21mm;
    }
    .sig-title { font-family: 'Moul', serif; font-size: 7.2px; color: #000; line-height: 1.25; margin-top: 1px; white-space: nowrap; text-align: center; position: relative; z-index: 2; }
    .sig-role  { font-family: 'Moul', serif; font-size: 7px; color: #000; line-height: 1.25; margin-top: 1px; white-space: nowrap; text-align: center; position: relative; z-index: 2; }

    .stamp-overlay-box {
      position: absolute;
      top: var(--stamp-top);
      left: calc(50% + var(--stamp-left));
      transform: translateX(-50%);
      width: var(--stamp-w);
      height: var(--stamp-h);
      pointer-events: none; z-index: 6;
      display: flex; align-items: center; justify-content: center;
    }
    .stamp-overlay-box img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }

    /* ── Print settings ── */
    @page {
      size: A4 landscape;
      margin: 0;
    }
    @media print {
      html, body {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        overflow: visible !important;
      }
      .no-print-toolbar { display: none !important; }
      .print-area {
        zoom: 1 !important;
        transform: none !important;
        margin: 0 !important;
        gap: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .a4-page {
        box-shadow: none !important;
        margin: 0 !important;
        border: none !important;
        width: 297mm !important;
        height: 209mm !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }
    }
  </style>
</head>
<body>

<!-- ── Toolbar ── -->
<div class="no-print-toolbar">
  <div class="toolbar-row">
    <div class="toolbar-group">
      <label style="font-weight:700;font-size:13px;">ថ្នាក់៖</label>
      <select id="classSelect" class="form-control" onchange="onClassChange()">
        <option value="">កំពុងទាញយក...</option>
      </select>

      <label style="font-weight:700;font-size:13px;color:#1e40af;">ទម្រង់កាត៖</label>
      <select id="layoutSelect" class="form-control" onchange="switchLayout(this.value)"
              style="font-weight:700;color:#1e3a8a;background:#eff6ff;border:1.5px solid #60a5fa;cursor:pointer;">
        <option value="8">៨ កាត (៧×១០ សង់ទីម៉ែត្រ ៤×២)</option>
        <option value="6">៦ កាត (៧×១០ សង់ទីម៉ែត្រ ៣×២)</option>
      </select>

      <label style="font-weight:700;font-size:13px;">សាលា៖</label>
      <input type="text" id="schoolName" class="form-control" value="សាលាបឋមសិក្សាកំពង់ល្ពៅ"
             style="width:165px;" oninput="refreshDisplay()">

      <label style="font-weight:700;font-size:13px;">ឆ្នាំសិក្សា៖</label>
      <input type="text" id="schoolYear" class="form-control" value="២០២៥~២០២៦"
             style="width:95px;" oninput="refreshDisplay()">
    </div>

    <div class="toolbar-group">
      <!-- 🔍 ZOOM BUTTONS -->
      <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំមើលកាតលើអេក្រង់">
        <button type="button" class="zoom-btn active" data-zoom="1" onclick="setZoom(1, this)">100%</button>
        <button type="button" class="zoom-btn" data-zoom="0.75" onclick="setZoom(0.75, this)">75%</button>
        <button type="button" class="zoom-btn" data-zoom="0.5" onclick="setZoom(0.5, this)">50%</button>
      </div>

      <button class="btn btn-primary" onclick="initPage()">
        <i class="fa-solid fa-rotate"></i> ផ្ទុកឡើងវិញ
      </button>
      <button class="btn btn-success" onclick="doPrintCards()">
        <i class="fa-solid fa-print"></i> បោះពុម្ព A4
      </button>
    </div>
  </div>

  <div class="toolbar-row" style="background:#f8fafc;padding:6px 10px;border-radius:8px;border:1px solid #e2e8f0;">
    <div class="toolbar-group">
      <label class="btn btn-outline" style="cursor:pointer;" title="ជ្រើសរើសរូប Logo">
        <i class="fa-solid fa-cloud-arrow-up" style="color:#2563eb;"></i> ប្តូរ Logo
        <input type="file" id="logoUploadInput" accept="image/*" style="display:none;" onchange="handleCustomLogo(event)">
      </label>
      <button class="btn btn-danger" onclick="clearCustomLogo()">
        <i class="fa-solid fa-trash-can"></i> លុប Logo
      </button>

      <label style="font-size:12px;font-weight:700;color:#475569;margin-left:6px;">Watermark:</label>
      <input type="range" id="opacitySlider" min="0.10" max="0.35" step="0.02" value="0.22"
             style="width:55px;cursor:pointer;" oninput="updateWatermarkOpacity(this.value)">
    </div>

    <div class="toolbar-group">
      <label class="btn btn-outline" style="cursor:pointer;border-color:#fca5a5;color:#b91c1c;" title="បញ្ចូលត្រានាយក">
        <i class="fa-solid fa-stamp" style="color:#dc2626;"></i> បញ្ចូលត្រា
        <input type="file" id="stampUploadInput" accept="image/*" style="display:none;" onchange="handleCustomStamp(event)">
      </label>
      <button class="btn btn-danger" onclick="clearCustomStamp()">
        <i class="fa-solid fa-trash-can"></i> លុបត្រា
      </button>

      <span style="font-size:11.5px;font-weight:700;color:#475569;margin-left:6px;">ទំហំត្រា:</span>
      <input type="range" id="stampSizeSlider" min="20" max="55" value="34"
             style="width:60px;cursor:pointer;" oninput="updateStampSize(this.value)">

      <span style="font-size:11.5px;font-weight:700;color:#475569;">លើ/ក្រោម:</span>
      <input type="range" id="stampTopSlider" min="-60" max="60" value="-3"
             style="width:65px;cursor:pointer;" oninput="updateStampTop(this.value)">

      <span style="font-size:11.5px;font-weight:700;color:#475569;">ឆ្វេង/ស្តាំ:</span>
      <input type="range" id="stampLeftSlider" min="-120" max="120" value="0"
             style="width:75px;cursor:pointer;" oninput="updateStampLeft(this.value)">

      <button class="btn btn-outline" onclick="resetStampPosition()" style="padding:5px 8px;font-size:11.5px;">
        🎯 កណ្តាលដើម
      </button>
    </div>
  </div>
</div>

<!-- ── Print area ── -->
<div class="print-area" id="printArea">
  <div style="text-align:center;padding:50px;color:#64748b;">
    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
    <p style="margin-top:10px;">សូមរង់ចាំ កំពុងទាញយកទិន្នន័យ...</p>
  </div>
</div>

<script>
// =========================================================
// ⚙️ CONFIG & SCRIPT URL
// =========================================================
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe6vrQshGAPglgmmZykljXazDNh1ZwWSRdFDAip1WWWRky24lmBo-qicLK3_i10AvT/exec';
var OFFICIAL_LOGO = 'https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/thumb/8/85/Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg/300px-Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg.png';

// ── Session Handling ──
var _urlParams = new URLSearchParams(window.location.search);
function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }
function _set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
function _del(key) { try { localStorage.removeItem(key); } catch(e) {} }

var TOKEN      = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('school_token') || '';
var USER_ROLE  = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || _get('school_user_role')  || 'teacher';
var USER_CLASS = _urlParams.get('cls') || _urlParams.get('class') || _get('krou_user_class') || _get('school_user_class') || '';

// ── Persisted state ──
var customLogoUrl  = _get('school_user_logo_url')       || OFFICIAL_LOGO;
var customStampUrl = _get('school_principal_stamp_url') || '';
var currentOpacity = '0.22';
var currentLayout  = parseInt(_get('school_cards_layout') || '8');
var currentZoom    = parseFloat(_get('school_cards_zoom') || '1');

var stampSettings = { size: '34', top: '-3', left: '0' };
try {
  var _sp = _get('school_stamp_settings');
  if (_sp) stampSettings = JSON.parse(_sp);
} catch(e) {}

var allStudents = [];

// ── Khmer Formatting Helpers ──
var _KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
function toKhmerNum(val) {
  if (val === null || val === undefined || val === '') return '';
  return val.toString().replace(/[0-9]/g, function(d) { return _KHMER_DIGITS[+d]; });
}

function getAutoKhmerDate() {
  var now = new Date();
  var months = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
  return 'ធ្វើនៅកំពង់ល្ពៅ ថ្ងៃទី' + toKhmerNum(now.getDate())
       + ' ខែ' + months[now.getMonth()]
       + ' ឆ្នាំ' + toKhmerNum(now.getFullYear());
}

// ── API Caller ──
async function apiCall(action, params) {
  params = params || {};
  if (TOKEN) params.token = params.token || TOKEN;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[action](params);
    });
  }

  if (typeof callBackendApi === 'function') return callBackendApi(action, params);
  if (typeof api !== 'undefined' && typeof api.request === 'function') return api.request(action, params);

  var res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, params))
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var json = await res.json();
  if (json && json.success === false) throw new Error(json.error || 'Server error');

  if (json && json.data !== undefined)    return json.data;
  if (json && json.classes !== undefined) return json.classes;
  return json;
}

// ── 🔍 មុខងារ ZOOM ──
function setZoom(scale, btnEl) {
  currentZoom = scale;
  var printArea = document.getElementById('printArea');
  if (printArea) {
    printArea.style.zoom = scale;
  }

  document.querySelectorAll('.zoom-btn').forEach(function(b) {
    b.classList.remove('active');
  });

  if (btnEl) {
    btnEl.classList.add('active');
  } else {
    var matchedBtn = document.querySelector('.zoom-btn[data-zoom="' + scale + '"]');
    if (matchedBtn) matchedBtn.classList.add('active');
  }

  _set('school_cards_zoom', scale);
}

// ── Stamp Styles ──
function applyStampStyles() {
  var sz  = parseFloat(stampSettings.size)  || 34;
  var top = parseFloat(stampSettings.top)   || -3;
  var lft = parseFloat(stampSettings.left)  || 0;
  document.documentElement.style.setProperty('--stamp-w', sz + 'mm');
  document.documentElement.style.setProperty('--stamp-h', (sz * 0.70).toFixed(1) + 'mm');
  document.documentElement.style.setProperty('--stamp-top',  top + 'px');
  document.documentElement.style.setProperty('--stamp-left', lft + 'px');
  _set('school_stamp_settings', JSON.stringify(stampSettings));
}
function updateStampSize(v)  { stampSettings.size = v;  applyStampStyles(); }
function updateStampTop(v)   { stampSettings.top  = v;  applyStampStyles(); }
function updateStampLeft(v)  { stampSettings.left = v;  applyStampStyles(); }
function resetStampPosition() {
  stampSettings = { size:'34', top:'-3', left:'0' };
  document.getElementById('stampSizeSlider').value = 34;
  document.getElementById('stampTopSlider').value  = -3;
  document.getElementById('stampLeftSlider').value = 0;
  applyStampStyles();
}

// ── Upload Logo / Stamp ──
function handleCustomLogo(event) {
  var file = event.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(e) {
    customLogoUrl = e.target.result;
    _set('school_user_logo_url', customLogoUrl);
    renderCards();
  };
  r.readAsDataURL(file);
}
function clearCustomLogo() {
  customLogoUrl = '';
  _del('school_user_logo_url');
  document.getElementById('logoUploadInput').value = '';
  renderCards();
}

function handleCustomStamp(event) {
  var file = event.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(e) {
    customStampUrl = e.target.result;
    _set('school_principal_stamp_url', customStampUrl);
    renderCards();
  };
  r.readAsDataURL(file);
}
function clearCustomStamp() {
  customStampUrl = '';
  _del('school_principal_stamp_url');
  document.getElementById('stampUploadInput').value = '';
  renderCards();
}

function updateWatermarkOpacity(val) {
  currentOpacity = val;
  document.querySelectorAll('.card-watermark').forEach(function(m) { m.style.opacity = val; });
}

// ── Layout Switch ──
function switchLayout(val) {
  currentLayout = parseInt(val);
  _set('school_cards_layout', currentLayout);
  renderCards();
}
function refreshDisplay() { renderCards(); }

// ── 🖨️ មុខងារបោះពុម្ពកាត ──
function doPrintCards() {
  if (!allStudents || allStudents.length === 0) {
    alert('⚠️ សូមជ្រើសរើសថ្នាក់ និងរង់ចាំឱ្យទិន្នន័យកាតបង្ហាញសិន ទើបអាចបោះពុម្ពបាន!');
    return;
  }
  window.focus();
  setTimeout(function() {
    try {
      window.print();
    } catch(err) {
      window.parent.print();
    }
  }, 100);
}

// ── Init & Life Cycle ──
window.onload = function() {
  document.getElementById('stampSizeSlider').value = stampSettings.size;
  document.getElementById('stampTopSlider').value  = stampSettings.top;
  document.getElementById('stampLeftSlider').value = stampSettings.left;
  document.getElementById('layoutSelect').value    = currentLayout;
  applyStampStyles();
  setZoom(currentZoom);
  initPage();
};

async function initPage() {
  var s = document.getElementById('classSelect');
  s.innerHTML = '<option value="">-- កំពុងទាញយកថ្នាក់ --</option>';

  try {
    var classes = await apiCall('getClassListForSession');
    s.innerHTML = '<option value="">-- ជ្រើសរើសថ្នាក់ --</option>';

    (classes || []).forEach(function(c) {
      var o = document.createElement('option');
      o.value = c;
      o.textContent = c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c;
      s.appendChild(o);
    });

    if (USER_CLASS && USER_ROLE !== 'admin') {
      s.value = USER_CLASS;
      s.disabled = true;
      s.title = 'លោកគ្រូ/អ្នកគ្រូមានសិទ្ធិមើលតែថ្នាក់ទី ' + USER_CLASS;
      onClassChange();
    } else if (s.options.length > 1) {
      s.selectedIndex = 1;
      onClassChange();
    }
  } catch (e) {
    console.error(e);
    s.innerHTML = '<option value="">បរាជ័យក្នុងការទាញយក</option>';
  }
}

async function onClassChange() {
  var c = document.getElementById('classSelect').value || USER_CLASS;
  if (!c) {
    document.getElementById('printArea').innerHTML = '<div style="text-align:center;padding:50px;color:#64748b;">សូមជ្រើសរើសថ្នាក់</div>';
    return;
  }

  document.getElementById('printArea').innerHTML = `
    <div style="text-align:center;padding:50px;color:#64748b;">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top:10px;">កំពុងទាញយកទិន្នន័យសិស្សថ្នាក់ទី ${c}...</p>
    </div>`;

  try {
    var list = await apiCall('getAllStudentsCardData', { className: c, classFilter: c });
    if (typeof list === 'string') {
      try { list = JSON.parse(list); } catch (e) {}
    }
    allStudents = Array.isArray(list) ? list : (list && list.data ? list.data : []);
    renderCards();
  } catch (err) {
    document.getElementById('printArea').innerHTML = `
      <div style="color:red;text-align:center;padding:30px;">
        កំហុសក្នុងការទាញយកទិន្នន័យ៖ ${err.message || err}
      </div>`;
  }
}

// ── Render Card HTML ──
function renderCards() {
  var container = document.getElementById('printArea');
  if (!allStudents || allStudents.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:50px;color:#64748b;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះទេ</div>';
    return;
  }

  var schoolName   = document.getElementById('schoolName').value || 'សាលាបឋមសិក្សាកំពង់ល្ពៅ';
  var schoolYear   = document.getElementById('schoolYear').value || '២០២៥~២០២៦';
  var autoDateText = getAutoKhmerDate();

  var cardsPerPage = currentLayout;
  var layoutClass  = (cardsPerPage === 6) ? 'layout-6' : 'layout-8';
  var totalPages   = Math.ceil(allStudents.length / cardsPerPage);
  var html = '';

  for (var p = 0; p < totalPages; p++) {
    html += `<div class="a4-page ${layoutClass}">`;
    var pageStudents = allStudents.slice(p * cardsPerPage, (p + 1) * cardsPerPage);

    for (var i = 0; i < pageStudents.length; i++) {
      var s = pageStudents[i];
      var khmerId = toKhmerNum(s.id);
      var dobFormatted = toKhmerNum(s.dob || '');
      var addressText = s.address || s.pob || 'ស្វាយជ្រុំ កំពង់ល្ពៅ សំឡូត បាត់ដំបង';
      var cleanGrade = (s.grade || '').toString().replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/, '');

      var photoHtml = (s.imageUrl && s.imageUrl.length > 5)
        ? `<img src="${s.imageUrl}" alt="រូបថត" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-user\\'></i>'">`
        : `<i class="fa-solid fa-user"></i>`;

      var stampHtml = customStampUrl
        ? `<div class="stamp-overlay-box"><img src="${customStampUrl}" alt="ត្រានាយក"></div>`
        : '';

      var headerLogoHtml = customLogoUrl
        ? `<img src="${customLogoUrl}" class="header-logo-img" alt="Logo" onerror="this.style.display='none'">`
        : '';

      var watermarkHtml = customLogoUrl
        ? `<img src="${customLogoUrl}" class="card-watermark" style="opacity:${currentOpacity};" alt="Watermark" onerror="this.style.display='none'">`
        : '';

      html += `
        <div class="student-card">
          <div class="card-top-header">
            <div class="header-logo-box">${headerLogoHtml}</div>
            <div class="header-kingdom">
              <div class="kingdom-title">ព្រះរាជាណាចក្រកម្ពុជា</div>
              <div class="kingdom-subtitle">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
              <div class="kingdom-divider">
                <svg viewBox="0 0 140 8">
                  <line x1="10" y1="4" x2="60" y2="4" stroke="#000" stroke-width="0.8"/>
                  <circle cx="8" cy="4" r="1.4" fill="#000"/>
                  <polygon points="70,1 74,4 70,7 66,4" fill="#000"/>
                  <circle cx="63" cy="4" r="1.2" fill="#000"/>
                  <circle cx="77" cy="4" r="1.2" fill="#000"/>
                  <line x1="80" y1="4" x2="130" y2="4" stroke="#000" stroke-width="0.8"/>
                  <circle cx="132" cy="4" r="1.4" fill="#000"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="card-main-body">
            ${watermarkHtml}

            <!-- 🌟 ផ្នែកចំណងជើង និងឈ្មោះសិស្ស (មិនដាច់ស្រៈខាងលើ) -->
            <div class="card-titles">
              <div class="title-badge">កាតសម្គាល់ខ្លួនសិស្ស</div>
              <div class="title-school">${schoolName}</div>
              <div class="title-id">អត្តលេខ៖ ${khmerId}</div>
              <div class="title-student-name-center">${s.name || ''}</div>
            </div>

            <div class="content-container">
              <div class="mid-split">
                <div class="left-profile-block">
                  <table class="info-table-top">
                    <tr>
                      <td class="lbl-col">ភេទ</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${s.sex || ''}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ថ្ងៃខែឆ្នាំកំណើត</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${dobFormatted}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ថ្នាក់ទី</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${toKhmerNum(cleanGrade)}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ឈ្មោះឪពុក</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-green">${s.father || '—'}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ឈ្មោះម្តាយ</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-green">${s.mother || '—'}</td>
                    </tr>
                  </table>
                </div>

                <div class="student-photo-box">${photoHtml}</div>
              </div>

              <table class="info-table-bottom">
                <tr>
                  <td class="lbl-col">អាសយដ្ឋាន</td>
                  <td class="cln-col">៖</td>
                  <td class="val-col val-blue" style="font-size: 8.8px;" title="${addressText}">${addressText}</td>
                </tr>
                <tr>
                  <td class="lbl-col">ឆ្នាំសិក្សា</td>
                  <td class="cln-col">៖</td>
                  <td class="val-col val-green">${toKhmerNum(schoolYear)}</td>
                </tr>
              </table>
            </div>

            <div class="card-bottom-signature">
              <div class="signature-box">
                <div class="sig-date">${autoDateText}</div>
                <div class="sig-stamp-wrapper">
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="sig-role">នាយកសាលា</div>
                  ${stampHtml}
                </div>
              </div>
            </div>

          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  container.innerHTML = html;
}
</script>
