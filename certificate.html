<!DOCTYPE html>
<html lang="km" data-theme="dark">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>បណ្ណសរសើរសិស្ស (ប្រចាំឆ្នាំ លេខ១ ដល់ ៥)</title>

  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Moul&family=Siemreap&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =====================================================
       🌟 ភ្ជាប់ពុម្ពអក្សរ TACTEING ពិតប្រាកដ
    ===================================================== */
    @font-face {
      font-family: 'Tacteing';
      src: local('Tacteing'),
           local('Khmer OS Tacteing'),
           local('Tacteing Regular'),
           local('Tacteing-Regular'),
           url('https://cdn.jsdelivr.net/gh/SOMONSOUM/Latex-Project@master/pptexam/Tacteing.ttf') format('truetype');
      font-display: block;
    }

    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      /* Theme Tokens - Light Mode */
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.95);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    [data-theme="dark"] {
      /* Theme Tokens - Dark Mode */
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.94);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-family: 'Siemreap', sans-serif;
      padding: 0 0 120px 0 !important;
      overflow-x: auto;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* =====================================================
       🎛️ NEW PREMIUM TOOLBAR DESIGN
    ===================================================== */
    .no-print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 12px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .form-control {
      padding: 6px 10px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* 🌟 Badge បង្ហាញថ្នាក់គ្រូ */
    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
      user-select: none;
    }

    /* ── Action Buttons ── */
    .btn {
      padding: 6px 14px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    /* ── Zoom Buttons ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--ctrl-group-bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--tb-border);
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* =====================================================
       📜 CERTIFICATES LIST & CANVAS (រក្សាពណ៌មាស-សដើម)
    ===================================================== */
    .certificate-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
      transition: zoom 0.2s ease;
      margin-top: 20px;
    }

    /* 🌟 បណ្ណសរសើរត្រូវតែពណ៌សជានិច្ច មិនរងឥទ្ធិពលពី Dark Mode */
    .certificate-container {
      width: 960px;
      height: 710px;
      margin: 0 auto;
      background-color: #fffdf7 !important;
      color: #000000 !important;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      flex-shrink: 0;
      border-radius: 4px;
    }

    /* ── Default Border ── */
    .outer-border {
      border: 4px solid #800000;
      padding: 5px;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .inner-border {
      border: 2px solid #d4af37;
      outline: 1px solid #800000;
      outline-offset: 4px;
      height: 100%;
      padding: 22px 35px 18px 35px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 55%, rgba(253, 248, 235, 1) 100%);
    }

    /* ── Frame Overlay ── */
    .frame-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
      display: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .frame-overlay.active {
      display: block;
    }

    .certificate-container.has-frame {
      padding: 130px 55px 70px 55px;
    }

    /* ── Corner Kbach ── */
    .corner-kbach {
      position: absolute;
      width: 48px;
      height: 48px;
      fill: #d4af37;
      z-index: 2;
    }

    .top-left { top: -2px; left: -2px; }
    .top-right { top: -2px; right: -2px; transform: rotate(90deg); }
    .bottom-left { bottom: -2px; left: -2px; transform: rotate(-90deg); }
    .bottom-right { bottom: -2px; right: -2px; transform: rotate(180deg); }

    /* ── Header ── */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      padding: 0 45px;
    }

    .header-left {
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .header-right { 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: -5px;
    }

    .header-admin-line1, .header-admin-line2 {
      font-family: 'Moul', serif;
      color: #002b66;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      white-space: nowrap;
    }

    .kingdom-line {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      text-align: center;
      white-space: nowrap;
    }

    .motto-line {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 12.5px;
      line-height: 1.7;
      margin: 0;
      text-align: center;
      white-space: nowrap;
    }

    .flagRow {
      color: #d4af37;
      font-family: 'Tacteing', 'Khmer OS Tacteing', sans-serif;
      font-size: 40px;
      line-height: 0.3;
      margin-top: 8px;
      user-select: none;
      display: block;
      text-align: center;
    }

    /* ── Title ── */
    .cert-title-block {
      margin-top: -10px;
      text-align: center;
    }

    .cert-title {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 32px;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0px rgba(212, 175, 55, 0.4);
    }

    .cert-subtitle-school {
      font-family: 'Moul', serif;
      color: #4B0082;
      font-size: 15px;
      margin-top: 3px;
    }

    /* ── Body ── */
    .cert-body {
      font-family: 'Siemreap', sans-serif;
      font-size: 13px;
      color: #222;
      line-height: 1.8;
    }

    .nowrap-group {
      white-space: nowrap;
      display: inline-block;
      margin: 0 1px;
    }

    .field-highlight {
      font-family: 'Moul', serif;
      font-weight: 400;
      font-size: 14.5px;
      color: #800000;
      padding: 0 3px;
      line-height: 1.6;
    }

    .student-name {
      font-family: 'Moul', serif;
      font-weight: 400;
      font-size: 15px;
      color: #800000;
      display: inline-block;
      padding: 4px 10px 2px 10px;
      line-height: 1.6;
    }

    /* ── Photo ── */
    .student-photo-box {
      width: 113px;
      height: 151px;
      transform: translateY(-8px);
      flex-shrink: 0;
      flex-grow: 0;
      border: 3px solid #d4af37;
      border-radius: 4px;
      background-color: #f8f9fa;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .student-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Footer ── */
    .footer-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: 10px;
      font-family: 'Siemreap', sans-serif;
      font-size: 13px;
    }

    .signature-box {
      text-align: center;
      justify-self: center;
    }

    .signature-title {
      font-family: 'Moul', serif;
      font-size: 12px;
      color: #002b66;
      margin-top: 4px;
    }

    .signature-space {
      height: 62px;
    }

    @media screen and (max-width: 768px) {
      .no-print-toolbar { padding: 10px 14px; }
      .toolbar-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .toolbar-section { width: 100%; justify-content: space-between; }
      .panel-pill-box { width: 100%; }
      .zoom-btn-group { width: 100%; justify-content: center; }
      .zoom-btn { flex: 1; text-align: center; }
    }

    /* =====================================================
       🖨️ PRINT A4 LANDSCAPE (STRICT WHITE BACKGROUND)
    ===================================================== */
    @media print {
      html, body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }

      .no-print-toolbar {
        display: none !important;
      }

      .certificate-list {
        gap: 0 !important;
        zoom: 1 !important;
        transform: none !important;
        margin-top: 0 !important;
      }

      .certificate-container {
        width: 297mm !important;
        height: 210mm !important;
        max-height: 210mm !important;
        margin: 0 !important;
        padding: 10mm 15mm !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        overflow: hidden !important;
        transform: none !important;
        border-radius: 0 !important;
      }

      .certificate-container.has-frame {
        padding: 38mm 18mm 20mm 18mm !important;
      }

      .header-row {
        padding: 0 12mm !important;
      }

      @page {
        size: A4 landscape;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       🎛️ NEW MODERN CONTROL TOOLBAR
  ===================================================== -->
  <div class="no-print-toolbar">
    <!-- ជួរទី ១៖ ការកំណត់ថ្នាក់, ស៊ុម, សាលា, ឆ្នាំ, Zoom និងបោះពុម្ព -->
    <div class="toolbar-row">
      <div class="toolbar-section">
        <!-- 🌟 បង្ហាញ Dropdown តែពេល Admin (បើជាគ្រូ Dropdown នឹងលាក់) -->
        <div class="panel-pill-box" id="adminClassBox" style="display:none;">
          <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
          <select id="selectClass" class="form-control" onchange="loadTopStudents()">
            <option value="">កំពុងទាញយក...</option>
          </select>
        </div>

        <!-- 🌟 ផ្លាកថ្នាក់របស់គ្រូ (បង្ហាញតែពេលជាគ្រូ) -->
        <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span id="teacherClassText">ថ្នាក់ទី...</span>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-border-all" style="color:#7c3aed;"></i> ស៊ុម៖</span>
          <select id="selectFrame" class="form-control" onchange="updateAllFrames()">
            <option value="">ស៊ុមលំនាំដើម (Kbach)</option>
            <option value="1">ស៊ុមទី១</option>
            <option value="2">ស៊ុមទី២</option>
            <option value="3">ស៊ុមទី៣</option>
            <option value="4">ស៊ុមទី៤</option>
            <option value="5">ស៊ុមទី៥</option>
            <option value="6">ស៊ុមទី៦</option>
            <option value="7">ស៊ុមទី៧</option>
            <option value="8">ស៊ុមទី៨</option>
            <option value="9">ស៊ុមទី៩</option>
            <option value="10">ស៊ុមទី១០</option>
            <option value="11">ស៊ុមទី១១</option>
          </select>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-school" style="color:#10b981;"></i> សាលារៀន៖</span>
          <input type="text" id="inSchool" class="form-control" value="សាលាបឋមសិក្សាកំពង់ល្ពៅ" oninput="updateAllCertText()">
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> ឆ្នាំសិក្សា៖</span>
          <input type="text" id="inYear" class="form-control" value="" style="width:130px;" oninput="updateAllCertText()">
        </div>
      </div>

      <div class="toolbar-section">
        <!-- 🔍 Zoom Buttons -->
        <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំមើល">
          <button type="button" class="zoom-btn active" data-zoom="1" onclick="setZoom(1, this)">100%</button>
          <button type="button" class="zoom-btn" data-zoom="0.75" onclick="setZoom(0.75, this)">75%</button>
          <button type="button" class="zoom-btn" data-zoom="0.5" onclick="setZoom(0.5, this)">50%</button>
        </div>

        <button class="btn btn-primary" onclick="loadTopStudents()" title="ផ្ទុកទិន្នន័យឡើងវិញ">
          <i class="fa-solid fa-rotate"></i> ផ្ទុកទិន្នន័យ
        </button>

        <button class="btn btn-success" onclick="doPrint()" title="បោះពុម្ពបណ្ណសរសើរទាំងអស់">
          <i class="fa-solid fa-print"></i> បោះពុម្ពទាំងអស់
        </button>
      </div>
    </div>

    <!-- ជួរទី ២៖ កាលបរិច្ឆេទចន្ទគតិ និងសុរិយគតិ -->
    <div class="toolbar-row" style="background:var(--ctrl-group-bg); padding:6px 12px; border-radius:12px; border:1px solid var(--tb-border);">
      <div class="toolbar-section" style="width:100%;">
        <span class="toolbar-label"><i class="fa-solid fa-pen-nib" style="color:#0284c7;"></i> កាលបរិច្ឆេទ៖</span>
        <textarea id="inDate" rows="2" class="form-control" style="flex:1; max-width:650px; resize:vertical; font-size:12px; line-height:1.4;" oninput="updateAllCertText()">ថ្ងៃព្រហស្បតិ៍ ១៤កើត ខែស្រាពណ៍ ឆ្នាំមមី អដ្ឋស័ក ព.ស ២៥៧០
កំពង់ល្ពៅ ថ្ងៃទី២៧ ខែសីហា ឆ្នាំ២០២៦</textarea>
        <span id="roleNotice" style="font-size:12px; color:#0284c7; font-weight:700; margin-left:auto;">
          <i class="fa-solid fa-award"></i> បង្ហាញសិស្សពូកែប្រចាំឆ្នាំ លេខ ១ ដល់ ៥
        </span>
      </div>
    </div>
  </div>

  <!-- =====================================================
       📜 CERTIFICATES CONTAINER
  ===================================================== -->
  <div id="certificateList" class="certificate-list">
    <div style="text-align:center; padding:60px 20px; font-size:15px; color:var(--text-muted); font-weight:600;">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
      <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យសិស្សពូកែ...</p>
    </div>
  </div>

  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->
  <script>
    // =========================================================
    // ⚙️ THEME MANAGEMENT (SYNC 100% WITH HOMEPAGE)
    // =========================================================
    var _urlParams = new URLSearchParams(window.location.search);
    function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }
    function _set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

    function applyTheme(theme) {
      theme = theme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }

    var initialTheme = _urlParams.get('theme') || _get('krou_theme_manual') || 'dark';
    applyTheme(initialTheme);

    window.addEventListener('message', function(event) {
      if (event.data && (event.data.type === 'THEME_CHANGE' || event.data.theme)) {
        applyTheme(event.data.theme || event.data);
      }
    });

    // =========================================================
    // ⚙️ BACKEND API & CONFIGURATION (ដូច card.html & group.html)
    // =========================================================
    var SCRIPT_URL = (window.parent && window.parent.BACKEND_URL)
      || _urlParams.get('apiUrl')
      || 'https://script.google.com/macros/s/AKfycbz9GLD2TJS4UPKVGxrc3H73tGCtjlMI7-56E7TlKcLHyBwqCiZ1jPF_okv2m1ubTjpy/exec';

    var token      = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('user_token') || _get('school_token') || '';
    var userRole   = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || 'teacher';
    var userClass  = (window.parent && window.parent.USER_CLASS)    || _urlParams.get('cls')   || _urlParams.get('class')   || _get('krou_assigned_class') || _get('krou_user_class') || '';

    async function apiCall(action, params) {
      params = params || {};
      if (token) params.token = params.token || token;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[action](params);
        });
      }

      if (typeof callBackendApi === 'function') {
        try {
          var res = await callBackendApi(action, params);
          if (res && res.classes !== undefined) return res.classes;
          if (res && res.data !== undefined) return res.data;
          return res;
        } catch(e) {}
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      if (json && json.success === false) throw new Error(json.error || json.message || 'Server error');
      if (json && json.classes !== undefined) return json.classes;
      if (json && json.data !== undefined) return json.data;
      return json;
    }

    let fetchedStudents = [];
    let classesLoaded = false;

    const FRAME_IMAGES = {
      "1": "https://lh3.googleusercontent.com/d/1N57PmjOvX02wM-yGow7sef2DrWoGg8qq",
      "2": "https://lh3.googleusercontent.com/d/1JssVh9vT0J0Iq3PKK0USsBIwngD-OGv2",
      "3": "https://lh3.googleusercontent.com/d/1Xf0jwMiDuDa8kyN858mISM0iZLzK06GG",
      "4": "https://lh3.googleusercontent.com/d/1FrGrRAz6now1IbDnK_umDSNNcIMFT5_J",
      "5": "https://lh3.googleusercontent.com/d/11hrJOsGUv_X4HAOcrKi6gqfDrCGHjEvK",
      "6": "https://lh3.googleusercontent.com/d/1Ws58mgtFQLxAne6AUoUaovCeirskyj68",
      "7": "https://lh3.googleusercontent.com/d/1AiYIycD4gxMcFSd6rPBX2TEW-sDIc6qS",
      "8": "https://lh3.googleusercontent.com/d/13XXPmD2pTLAgmO_5-RB6TjzKEH0x9ybH",
      "9": "https://lh3.googleusercontent.com/d/17d-TZq4oTkrjtRp_nzXbKbj4vyfJsQ3N",
      "10": "https://lh3.googleusercontent.com/d/1NBl8VJXqPRvFCLcu9VYUbFXE98-dT8Y7",
      "11": "https://lh3.googleusercontent.com/d/1cyb6NhrT93aNXrSrDDelvin3alc46lTH"
    };

    const NO_PHOTO_SRC = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><rect width='100%25' height='100%25' fill='%23f0f0f0'/><text x='50%25' y='50%25' font-size='14' text-anchor='middle' fill='%23999' dy='.3em'>NO PHOTO</text></svg>";
    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];

    function toKhmerDigits(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[0-9]/g, function(d) {
        return KHMER_DIGITS[d];
      });
    }

    function defaultAcademicYear() {
      const now = new Date();
      const y = now.getFullYear();
      const startYear = now.getMonth() >= 7 ? y : y - 1;
      return (toKhmerDigits(startYear) + ' - ' + toKhmerDigits(startYear + 1));
    }

    function setZoom(scale, btnEl) {
      var container = document.getElementById('certificateList');
      if (container) container.style.zoom = scale;

      document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) {
        btnEl.classList.add('active');
      } else {
        var matched = document.querySelector('.zoom-btn[data-zoom="' + scale + '"]');
        if (matched) matched.classList.add('active');
      }
      _set('cert_zoom_level', scale);
    }

    function doPrint() {
      window.focus();
      setTimeout(function() {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    // =========================================================
    // 🚀 INITIALIZATION (លាក់ DROPDOWN សម្រាប់គ្រូ)
    // =========================================================
    window.onload = async function() {
      document.getElementById('inYear').value = defaultAcademicYear();

      var savedZoom = parseFloat(_get('cert_zoom_level') || '1');
      setZoom(savedZoom);

      if (!userClass && token) {
        try {
          var session = await apiCall('getCurrentSession');
          if (session && session.loggedIn) {
            userRole = session.role || userRole;
            userClass = session.assignedClass || userClass;
          }
        } catch(e) {}
      }

      var isAdmin = (String(userRole).toLowerCase().trim() === 'admin');

      if (!isAdmin) {
        // 🏫 គ្រូបង្រៀន -> លាក់ Dropdown បង្ហាញតែ Badge ថ្នាក់របស់គាត់
        document.getElementById('adminClassBox').style.display = 'none';

        var badge = document.getElementById('teacherClassBadge');
        var text = document.getElementById('teacherClassText');
        var cleanCls = (userClass || '').toString().replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/, '');

        if (cleanCls) {
          text.innerText = 'ថ្នាក់ទី ' + cleanCls;
          badge.style.display = 'inline-flex';

          var sel = document.getElementById('selectClass');
          sel.innerHTML = '<option value="' + cleanCls + '">ថ្នាក់ទី ' + cleanCls + '</option>';
          sel.value = cleanCls;
          classesLoaded = true;
          loadTopStudents();
        } else {
          document.getElementById('certificateList').innerHTML = 
            '<div style="text-align:center; padding:50px; color:#f59e0b; font-weight:700;">⚠️ គណនីរបស់អ្នកមិនទាន់ត្រូវបានចាត់តាំងថ្នាក់នៅឡើយទេ។ សូមទាក់ទងអ្នកគ្រប់គ្រង។</div>';
        }
      } else {
        // 👑 Admin -> បង្ហាញ Dropdown ជ្រើសរើសថ្នាក់
        document.getElementById('teacherClassBadge').style.display = 'none';
        document.getElementById('adminClassBox').style.display = 'flex';

        const classSelect = document.getElementById('selectClass');
        classSelect.innerHTML = '<option value="">-- កំពុងទាញយកថ្នាក់... --</option>';

        try {
          var res = await apiCall('getClassList');
          if (!res || !res.length) res = await apiCall('getClassListForSession');
          var classes = Array.isArray(res) ? res : (res && res.classes ? res.classes : (res && res.data ? res.data : []));

          classSelect.innerHTML = '';
          (classes || []).forEach(function(c) {
            const opt = document.createElement('option');
            opt.value = c;
            opt.innerText = c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c;
            classSelect.appendChild(opt);
          });

          classesLoaded = true;
          if (classSelect.options.length > 0) {
            loadTopStudents();
          } else {
            document.getElementById('certificateList').innerHTML = 
              '<div style="text-align:center; padding:50px; color:#ef4444; font-weight:700;">រកមិនឃើញថ្នាក់ណាមួយទេ!</div>';
          }
        } catch (err) {
          alert('កំហុសក្នុងការទាញបញ្ជីថ្នាក់៖ ' + err.message);
        }
      }
    };

    // 🌟 ទាញយកពិន្ទុសិស្សពូកែប្រចាំឆ្នាំ
    async function loadTopStudents() {
      if (!classesLoaded) return;
      let selectedClass = document.getElementById('selectClass').value || userClass;
      if (!selectedClass) return;

      document.getElementById('certificateList').innerHTML = 
        `<div style="text-align:center; padding:60px 20px; font-size:15px; color:var(--text-muted); font-weight:600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យសិស្សពូកែលេខ ១ ដល់ ៥ ប្រចាំឆ្នាំ (ថ្នាក់ទី ${selectedClass})...</p>
        </div>`;

      try {
        const [rankRes, cardRes] = await Promise.all([
          apiCall('getTopStudentsDataSecured', { 
            token: token, 
            className: selectedClass, 
            cls: selectedClass, 
            period: 'ប្រចាំឆ្នាំ', 
            month: 'ប្រចាំឆ្នាំ', 
            limit: 5 
          }),
          apiCall('getAllStudentsCardData', { 
            token: token, 
            className: selectedClass, 
            classFilter: selectedClass, 
            cls: selectedClass 
          }).catch(() => [])
        ]);

        var rankData = Array.isArray(rankRes) 
          ? rankRes 
          : (rankRes && rankRes.scores ? rankRes.scores : (rankRes && rankRes.data ? rankRes.data : []));
        
        var cardData = Array.isArray(cardRes) 
          ? cardRes 
          : (cardRes && cardRes.data ? cardRes.data : []);

        const studentInfoMap = {};
        cardData.forEach(s => {
          if (s.id) studentInfoMap[String(s.id).trim()] = s;
        });

        renderAllCertificates({ 
          success: true, 
          scores: rankData, 
          studentMap: studentInfoMap, 
          selectedClass: selectedClass
        });
      } catch (err) {
        document.getElementById('certificateList').innerHTML = 
          '<div style="text-align:center; padding:50px; color:#ef4444; font-weight:700;">❌ កំហុស៖ ' + (err.message || err) + '</div>';
      }
    }

    function renderAllCertificates(res) {
      const container = document.getElementById('certificateList');
      const studentList = (res && res.scores) ? res.scores : (Array.isArray(res) ? res : []);

      if (!studentList || studentList.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted); font-size:15px; font-weight:600;">ពុំទាន់មានទិន្នន័យពិន្ទុសម្រាប់ <strong>ប្រចាំឆ្នាំ</strong> ក្នុងថ្នាក់នេះនៅឡើយទេ!</div>`;
        return;
      }

      fetchedStudents = studentList;
      const studentMap = res.studentMap || {};
      const selectedClass = res.selectedClass || document.getElementById('selectClass').value;
      const schoolInput = document.getElementById('inSchool').value || 'សាលាបឋមសិក្សាកំពង់ល្ពៅ';
      const yearInput = document.getElementById('inYear').value || defaultAcademicYear();
      const dateInput = document.getElementById('inDate').value || '';

      let html = '';

      fetchedStudents.forEach(function(st, idx) {
        const studentDetail = studentMap[String(st.id).trim()] || {};
        
        const sName = st.name || st.studentName || studentDetail.name || '...............................';
        const sGender = st.sex || st.gender || studentDetail.sex || '.........';
        const sDob = studentDetail.dob || st.dob || '........................................';
        const sClass = st.grade || st.className || studentDetail.grade || selectedClass || '........';
        const sRank = st.rank !== undefined ? st.rank : (idx + 1);
        const sAvg = st.avg !== undefined ? st.avg : '';
        const photoSrc = (st.imageUrl || studentDetail.imageUrl || '').trim() || NO_PHOTO_SRC;

        html += `
        <div class="certificate-container" id="cert-${idx}">
          <div class="frame-overlay" id="frameOverlay-${idx}"></div>

          <div class="outer-border">
            <svg class="corner-kbach top-left" viewBox="0 0 100 100"><path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" /><circle cx="35" cy="35" r="10" /></svg>
            <svg class="corner-kbach top-right" viewBox="0 0 100 100"><path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" /><circle cx="35" cy="35" r="10" /></svg>
            <svg class="corner-kbach bottom-left" viewBox="0 0 100 100"><path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" /><circle cx="35" cy="35" r="10" /></svg>
            <svg class="corner-kbach bottom-right" viewBox="0 0 100 100"><path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" /><circle cx="35" cy="35" r="10" /></svg>

            <div class="inner-border">
              <!-- HEADER -->
              <div class="header-row">
                <div class="header-left">
                  <div class="header-admin-line1">រដ្ឋបាលស្រុកសំឡូត</div>
                  <div class="header-admin-line2">សាលារៀន ៖ <span class="cert-out-school">${schoolInput}</span></div>
                </div>
                <div class="header-right">
                  <div class="kingdom-line">ព្រះរាជាណាចក្រកម្ពុជា</div>
                  <div class="motto-line">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
                  <div class="flagRow">3</div>
                </div>
              </div>

              <!-- TITLE -->
              <div class="cert-title-block">
                <h1 class="cert-title">បណ្ណសរសើរ</h1>
                <p style="font-family:'Kantumruy Pro'; font-size:12px; color:#555; letter-spacing:2px; margin-top:2px;">CERTIFICATE OF COMMENDATION</p>
                <div class="cert-subtitle-school">នាយក${schoolInput}</div>
              </div>

              <!-- BODY -->
              <div class="cert-body">
                សូមសរសើរចំពោះសិស្សឈ្មោះ
                <div class="student-name">${sName}</div>
                <span class="nowrap-group">ភេទ <span class="field-highlight">${sGender}</span></span>
                <span class="nowrap-group">កើតថ្ងៃទី <span class="field-highlight">${toKhmerDigits(sDob)}</span></span>
                <span class="nowrap-group">រៀនថ្នាក់ទី <span class="field-highlight">${toKhmerDigits(sClass)}</span></span>
                <br>
                នៃ <span class="field-highlight cert-out-school">${schoolInput}</span> ។ ដែលបានខិតខំសិក្សារៀនសូត្រ
                <span class="nowrap-group">
                  ទទួលបានចំណាត់ថ្នាក់លេខ <span class="field-highlight">${toKhmerDigits(sRank)}</span>
                  មធ្យមភាគ <span class="field-highlight">${toKhmerDigits(sAvg)}</span>
                </span>
                <br>
                <span class="nowrap-group">ក្នុងឆ្នាំសិក្សា <span class="field-highlight cert-out-year">${toKhmerDigits(yearInput)}</span></span> ។
                <br>
                បណ្ណសរសើរនេះប្រគល់ជូនសាមីខ្លួនប្រើប្រាស់តាមការដែលអាចប្រើបាន ។
              </div>

              <!-- FOOTER -->
              <div class="footer-section">
                <div class="signature-box">
                  <span>បានឃើញ និងឯកភាព</span><br>
                  <div class="signature-title">នាយកសាលា</div>
                  <div class="signature-space"></div>
                </div>

                <div class="student-photo-box">
                  <img src="${photoSrc}" alt="Student Photo" onerror="this.onerror=null; this.src=NO_PHOTO_SRC;">
                </div>

                <div class="signature-box" style="align-self:start; margin-top:6px;">
                  <span class="cert-out-date" style="display:inline-block; white-space:pre; font-size:12px; line-height:1.5;">${toKhmerDigits(dateInput)}</span><br>
                  <div class="signature-title">គ្រូបន្ទុកថ្នាក់</div>
                  <div class="signature-space"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        `;
      });

      container.innerHTML = html;
      updateAllFrames();
    }

    function updateAllCertText() {
      const schoolVal = document.getElementById('inSchool').value || '...................';
      const yearVal = toKhmerDigits(document.getElementById('inYear').value || '...................');
      const dateVal = toKhmerDigits(document.getElementById('inDate').value || '');

      document.querySelectorAll('.cert-out-school').forEach(el => el.innerText = schoolVal);
      document.querySelectorAll('.cert-subtitle-school').forEach(el => el.innerText = 'នាយក' + schoolVal);
      document.querySelectorAll('.cert-out-year').forEach(el => el.innerText = yearVal);
      document.querySelectorAll('.cert-out-date').forEach(el => el.innerText = dateVal);
    }

    function updateAllFrames() {
      const val = document.getElementById('selectFrame').value;

      document.querySelectorAll('.certificate-container').forEach(function(container, idx) {
        const overlay = container.querySelector('.frame-overlay');
        const outerBorder = container.querySelector('.outer-border');
        const innerBorder = container.querySelector('.inner-border');
        const cornerKbachEls = container.querySelectorAll('.corner-kbach');

        if (val && FRAME_IMAGES[val]) {
          overlay.style.backgroundImage = "url('" + FRAME_IMAGES[val] + "')";
          overlay.classList.add('active');
          container.classList.add('has-frame');
          outerBorder.style.border = 'none';
          innerBorder.style.border = 'none';
          innerBorder.style.outline = 'none';
          innerBorder.style.background = 'transparent';
          cornerKbachEls.forEach(el => el.style.display = 'none');
        } else {
          overlay.classList.remove('active');
          overlay.style.backgroundImage = '';
          container.classList.remove('has-frame');
          outerBorder.style.border = '';
          innerBorder.style.border = '';
          innerBorder.style.outline = '';
          innerBorder.style.background = '';
          cornerKbachEls.forEach(el => el.style.display = '');
        }
      });
    }
  </script>
</body>
</html>
