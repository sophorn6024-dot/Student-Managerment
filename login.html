<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ចូលប្រើប្រាស់ប្រព័ន្ធ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Kantumruy Pro',sans-serif}
    html,body{width:100%;height:100%;overflow:hidden}
    body{background:radial-gradient(circle at 50% 10%,#294aa0 0,#172554 36%,#07111f 100%);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
    body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(3px);pointer-events:none}
    body:before{width:360px;height:360px;right:-130px;top:-120px;background:rgba(59,130,246,.18)}
    body:after{width:300px;height:300px;left:-140px;bottom:-120px;background:rgba(124,58,237,.18)}
    .stars{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:42px 42px}
    .login-wrap{width:min(92vw,430px);position:relative;z-index:2}
    .mascot{height:112px;display:flex;justify-content:center;align-items:flex-end;position:relative;margin-bottom:-18px;z-index:3}
    .husky{width:112px;height:88px;position:relative;animation:float 3s ease-in-out infinite}
    .ear{position:absolute;top:4px;width:36px;height:42px;background:#cbd5e1;border:4px solid #e2e8f0;transform:rotate(28deg);border-radius:10px 24px 8px 22px;z-index:0}
    .ear.left{left:11px}.ear.right{right:11px;transform:scaleX(-1) rotate(28deg)}
    .head{position:absolute;left:12px;top:17px;width:88px;height:68px;border-radius:48% 48% 44% 44%;background:linear-gradient(180deg,#e5e7eb,#94a3b8);border:4px solid #e2e8f0;box-shadow:0 10px 24px rgba(0,0,0,.22);overflow:hidden}
    .mask{position:absolute;left:9px;top:7px;width:70px;height:54px;background:linear-gradient(135deg,#1e293b,#334155);clip-path:polygon(50% 0,72% 25%,100% 55%,78% 100%,50% 77%,22% 100%,0 55%,28% 25%)}
    .muzzle{position:absolute;left:25px;bottom:6px;width:38px;height:27px;border-radius:50%;background:#f8fafc}
    .nose{position:absolute;left:14px;top:3px;width:10px;height:7px;border-radius:50%;background:#111827}
    .eye{position:absolute;top:27px;width:14px;height:14px;border-radius:50%;background:#f8fafc;border:3px solid #0f172a;overflow:hidden;animation:blink 4.5s infinite}
    .eye:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#0f172a;left:3px;top:3px;animation:look 2.4s ease-in-out infinite}
    .eye.left{left:21px}.eye.right{right:21px}
    .paw{position:absolute;bottom:-8px;width:31px;height:25px;background:#e2e8f0;border:3px solid #cbd5e1;border-radius:50%;z-index:4;animation:paw 2.2s ease-in-out infinite}
    .paw.left{left:17px;transform:rotate(10deg)}.paw.right{right:17px;transform:rotate(-10deg);animation-delay:.15s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}
    @keyframes look{0%,100%{transform:translate(0)}50%{transform:translate(3px,1px)}}
    @keyframes paw{0%,100%{transform:translateY(0) rotate(10deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
    .paw.right{animation-name:pawRight}@keyframes pawRight{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-5px) rotate(3deg)}}
    .card{background:rgba(255,255,255,.97);color:#0f172a;border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:34px 28px 25px;box-shadow:0 25px 70px rgba(0,0,0,.34);backdrop-filter:blur(18px)}
    .brand{text-align:center}.brand h1{font-family:'Moul',serif;font-size:18px;color:#0f172a;line-height:1.7}.brand p{font-size:12px;color:#64748b;margin-top:2px}
    .line{height:1px;background:linear-gradient(90deg,transparent,#dbeafe,transparent);margin:20px 0}
    .field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:7px}
    .input-wrap{position:relative}.input-wrap input{width:100%;height:48px;border:1px solid #dbe3ef;border-radius:14px;background:#f8fafc;color:#0f172a;padding:0 14px;font-size:14px;outline:none;transition:.2s}
    .input-wrap input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1);background:#fff}
    .toggle{position:absolute;right:8px;top:7px;width:34px;height:34px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:16px}
    .error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:13px}.error.show{display:block;animation:shake .3s ease}
    @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    .quick{display:none;margin-bottom:13px;padding:11px 12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:13px;color:#1e40af;font-size:12px}.quick.show{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .quick button{border:0;background:#2563eb;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px;cursor:pointer}
    .login-btn{position:relative;width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;box-shadow:0 12px 24px rgba(37,99,235,.25);transition:transform .15s}
    .btn-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;z-index:5}
    .footer{text-align:center;margin-top:18px;color:#94a3b8;font-size:10.5px}
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="login-wrap">
    <div class="mascot" aria-hidden="true">
      <div class="husky">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="head"><div class="mask"></div><div class="eye left"></div><div class="eye right"></div><div class="muzzle"><div class="nose"></div></div></div>
        <div class="paw left"></div><div class="paw right"></div>
      </div>
    </div>
    <section class="card">
      <div class="brand">
        <h1>សាលាបឋមសិក្សាកំពង់ល្ពៅ</h1>
        <p>ប្រព័ន្ធគ្រប់គ្រងសិស្ស និងគ្រូបង្រៀន</p>
      </div>
      <div class="line"></div>
      <div class="quick" id="quickBox">
        <span>🔐 មានគណនីបានចូលពីមុន</span>
        <button type="button" onclick="continueToDashboard()">បន្តចូល</button>
      </div>
      <div class="error" id="errorBox"></div>
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap"><input id="username" type="text" placeholder="បញ្ចូល Username" required></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="បញ្ចូល Password" required>
            <button class="toggle" type="button" onclick="togglePass()">👁️</button>
          </div>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">
          <span class="btn-label" id="btnText">🚪 ចូលប្រើប្រាស់ប្រព័ន្ធ</span>
        </button>
      </form>
      <div class="footer">© <span id="year"></span> សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
    </section>
  </div>

  <script src="api.js"></script>
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const errorBox = document.getElementById('errorBox');

    function showError(msg){ errorBox.textContent = msg; errorBox.classList.add('show'); }
    function hideError(){ errorBox.classList.remove('show'); errorBox.textContent = ''; }

    function togglePass(){
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function continueToDashboard(){
      hideError();
      const token = getStoredToken();
      if(!token) return;
      btnText.innerText = '⏳ កំពុងពិនិត្យ...';
      try {
        const s = await callBackendApi('getCurrentSession', { token: token });
        if(s && s.loggedIn){
          window.location.replace('index.html');
        } else {
          removeStoredToken();
          document.getElementById('quickBox').classList.remove('show');
          showError('Session ចាស់ផុតកំណត់ សូម Login ឡើងវិញ');
          btnText.innerText = '🚪 ចូលប្រើប្រាស់ប្រព័ន្ធ';
        }
      } catch(err) {
        showError('មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ');
        btnText.innerText = '🚪 ចូលប្រើប្រាស់ប្រព័ន្ធ';
      }
    }

    async function doLogin(ev){
      ev.preventDefault();
      hideError();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if(!u || !p) return showError('សូមបញ្ចូល Username និង Password!');

      loginBtn.disabled = true;
      btnText.innerText = '⏳ កំពុងផ្ទៀងផ្ទាត់...';

      try {
        const res = await callBackendApi('checkLogin', { username: u, password: p });
        if(res && res.success && res.token){
          setStoredToken(res.token);
          btnText.innerText = '✅ ជោគជ័យ!';
          setTimeout(() => window.location.replace('index.html'), 300);
        } else {
          loginBtn.disabled = false;
          btnText.innerText = '🚪 ចូលប្រើប្រាស់ប្រព័ន្ធ';
          showError(res.message || 'Username ឬ Password មិនត្រឹមត្រូវ!');
        }
      } catch(err) {
        loginBtn.disabled = false;
        btnText.innerText = '🚪 ចូលប្រើប្រាស់ប្រព័ន្ធ';
        showError('មានបញ្ហាក្នុងការភ្ជាប់ទៅកាន់ប្រព័ន្ធ Google Sheets!');
      }
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    document.addEventListener('DOMContentLoaded', () => {
      const token = getStoredToken();
      if(token) document.getElementById('quickBox').classList.add('show');
    });
  </script>
</body>
</html>
