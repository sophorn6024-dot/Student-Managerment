<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធស្រង់ពិន្ទុ - KrouDigital</title>
  
  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- 📄 Html2Pdf Library for High Resolution PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --navy: #132d56;
      --bg: #f0f4f8;
      --border: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      
      /* Subject Group Colors */
      --khmer-bg: #dbeafe; --khmer-txt: #1e40af; --khmer-col: #eff6ff; --khmer-brd: #93c5fd;
      --math-bg: #ede9fe; --math-txt: #5b21b6; --math-col: #f5f3ff; --math-brd: #c4b5fd;
      --sci-bg: #dcfce7; --sci-txt: #15803d; --sci-col: #dcfce7; --sci-brd: #86efac;
      --soc-bg: #fef3c7; --soc-txt: #b45309; --soc-col: #fef3c7; --soc-brd: #fde68a;
      --art-bg: #ffe4e6; --art-txt: #be123c; --art-col: #fff1f2; --art-brd: #fecdd3;
      --for-bg: #cffafe; --for-txt: #0e7490; --for-col: #cffafe; --for-brd: #a5f3fc;
      --res-bg: #e0e7ff; --res-txt: #3730a3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; }
    .f-bold { font-weight: 700; }

    /* ================= LANDING CARDS ================= */
    #landingPage {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px;
    }
    .landing-header {
      margin-bottom: 30px;
    }
    .landing-header h1 {
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .landing-header p {
      font-size: 14px;
      color: var(--text-muted);
    }
    .cards-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
    }
    .score-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 22px;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
    }
    .score-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
    }
    .score-card.monthly { border-left: 5px solid #0284c7; }
    .score-card.semester { border-left: 5px solid #7c3aed; }
    
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .card-icon.m { background: #e0f2fe; color: #0284c7; }
    .card-icon.s { background: #ede9fe; color: #7c3aed; }
    
    .card-info h2 { font-size: 17px; margin-bottom: 4px; }
    .card-info p { font-size: 12.5px; color: var(--text-muted); }
    
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
    }
    .card-badge {
      font-size: 11.5px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #334155;
    }
    .card-arrow {
      font-size: 18px;
      color: #94a3b8;
      transition: transform 0.2s;
    }
    .score-card:hover .card-arrow {
      transform: translateX(4px);
      color: var(--primary);
    }

    /* ================= MAIN SCORE TABLE UI ================= */
    #mainForm {
      display: none;
      padding: 14px;
      max-width: 100%;
    }
    .table-container-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 25px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .top-toolbar {
      background: #ffffff;
      padding: 10px 14px;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tb-left, .tb-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-select {
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: bold;
      background: #f8fafc;
      color: var(--text);
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      cursor: pointer;
      outline: none;
      transition: border 0.15s;
    }
    .pill-select:focus, .pill-select:hover {
      border-color: var(--primary);
      background: #fff;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 5px 14px;
      background: #f8fafc;
      min-width: 180px;
    }
    .search-input-wrap input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 12.5px;
      font-family: inherit;
      width: 100%;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      font-size: 12.5px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .action-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .action-btn.btn-save { background: #16a34a; border-color: #15803d; color: #fff; }
    .action-btn.btn-save:hover { background: #15803d; }
    .action-btn.btn-report { background: #0284c7; border-color: #0369a1; color: #fff; }
    .action-btn.btn-report:hover { background: #0369a1; }
    .action-btn.btn-back { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }

    .autosave-pill {
      font-size: 11.5px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .autosave-pill.saving { background: #fef3c7; color: #b45309; }
    .autosave-pill.saved { background: #dcfce7; color: #15803d; }
    .autosave-pill.error { background: #fee2e2; color: #b91c1c; }

    /* ================= SCORE TABLE ================= */
    .table-scroll-wrap {
      overflow: auto;
      max-height: calc(100vh - 145px);
      position: relative;
      background: #ffffff;
    }

    .modern-score-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: center;
      border: 1px solid #cbd5e1;
    }

    .modern-score-table th, .modern-score-table td {
      border: 1px solid #cbd5e1;
      padding: 4px 2px;
      height: 38px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .stk {
      position: sticky !important;
      background: #ffffff;
      z-index: 20;
    }
    .stk-1 { left: 0; min-width: 45px; max-width: 45px; }
    .stk-2 { left: 45px; min-width: 85px; max-width: 85px; text-align: left; padding-left: 8px; }
    .stk-3 { left: 130px; min-width: 95px; max-width: 95px; text-align: left; padding-left: 8px; font-weight: bold; }
    .stk-4 { left: 225px; min-width: 55px; max-width: 55px; box-shadow: 3px 0 6px -2px rgba(0,0,0,0.12); }

    .modern-score-table thead th.stk {
      z-index: 40;
      background: #f8fafc;
    }

    .th-group-kh { background: var(--khmer-bg); color: var(--khmer-txt); }
    .th-group-ma { background: var(--math-bg); color: var(--math-txt); }
    .th-group-sc { background: var(--sci-bg); color: var(--sci-txt); }
    .th-group-so { background: var(--soc-bg); color: var(--soc-txt); }
    .th-group-ar { background: var(--art-bg); color: var(--art-txt); }
    .th-group-fo { background: var(--for-bg); color: var(--for-txt); }
    .th-group-res { background: var(--res-bg); color: var(--res-txt); }

    .th-vertical-cell {
      height: 125px !important;
      max-height: 125px;
      vertical-align: middle !important;
      text-align: center;
      padding: 4px 1px !important;
      position: relative;
    }

    .th-vertical-wrap {
      display: inline-block;
      white-space: nowrap;
      transform: rotate(-90deg);
      font-size: 11.5px;
      font-weight: bold;
      letter-spacing: 0.3px;
      margin: 0 auto;
      line-height: 1;
    }

    .th-sub-kh { background: var(--khmer-col); color: var(--khmer-txt); }
    .th-sub-ma { background: var(--math-col); color: var(--math-txt); }
    .th-sub-sc { background: var(--sci-col); color: var(--sci-txt); }
    .th-sub-so { background: var(--soc-col); color: var(--soc-txt); }
    .th-sub-ar { background: var(--art-col); color: var(--art-txt); }
    .th-sub-fo { background: var(--for-col); color: var(--for-txt); }
    .th-sub-res { background: #f8fafc; color: var(--res-txt); }

    .coef-row {
      background: #f8fafc;
      font-size: 11.5px;
      font-weight: bold;
      color: #64748b;
      height: 34px;
    }
    .coef-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .coef-zero { color: #94a3b8; }
    .coef-active { color: #2563eb; font-weight: bold; }

    .score-box {
      width: 44px;
      height: 30px;
      text-align: center;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 13.5px;
      font-weight: bold;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      outline: none;
      transition: all 0.15s ease;
      background: #ffffff;
    }
    .score-box:focus {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
      background: #eff6ff !important;
    }
    
    .box-kh { border-color: var(--khmer-brd); }
    .box-ma { border-color: var(--math-brd); }
    .box-sc { border-color: var(--sci-brd); }
    .box-so { border-color: var(--soc-brd); }
    .box-ar { border-color: var(--art-brd); }
    .box-fo { border-color: var(--for-brd); }

    .score-box.filled {
      background: #fef9c3;
      border-color: #f59e0b;
      color: #92400e;
    }

    .col-res-tot   { min-width: 78px !important; font-size: 13px; color: #475569; }
    .col-res-avg   { min-width: 78px !important; font-size: 14px; font-weight: bold; color: #0f172a; }
    .col-res-rank  { min-width: 78px !important; font-size: 14px; font-weight: bold; color: #dc2626; }
    .col-res-grade { min-width: 90px !important; }
    .col-res-note  { min-width: 78px !important; font-size: 13px; }
    .col-res-abs   { min-width: 70px !important; font-size: 13px; color: #b91c1c; font-weight: bold; }
    
    .badge-grade {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
    }
    .grade-a { background: #dcfce7; color: #15803d; }
    .grade-b { background: #ecfdf5; color: #047857; }
    .grade-c { background: #eff6ff; color: #1d4ed8; }
    .grade-d { background: #fef3c7; color: #b45309; }
    .grade-e { background: #fed7aa; color: #c2410c; }
    .grade-f { background: #fee2e2; color: #b91c1c; }

    .status-pass { color: #16a34a; font-weight: bold; }
    .status-fail { color: #dc2626; font-weight: bold; }

    .dr:hover { background-color: #f1f5f9; }
    .dr:hover .stk { background-color: #f1f5f9; }
    .focused-row { background-color: #e0f2fe !important; }
    .focused-row .stk { background-color: #e0f2fe !important; }

    /* ================= 🖨️ 3. SCORE REPORT VIEWER & PRINT SETUP ================= */
    #scoreReportModal {
      display: none;
      position: fixed;
      inset: 0;
      background: #090d16;
      z-index: 3000;
      overflow-y: auto;
      padding: 10px 10px 40px;
    }
    .viewer-top-bar {
      position: sticky;
      top: 0;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      z-index: 100;
    }
    .report-paper-container {
      background: #ffffff;
      width: 297mm;
      max-width: 100%;
      min-height: 210mm;
      margin: 0 auto;
      padding: 10mm 12mm;
      border-radius: 4px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.7);
      color: #0f172a;
      font-size: 11px;
    }
    .rpt-header-banner { text-align: center; color: #000; margin-bottom: 10px; }
    
    .print-report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      text-align: center;
      border: 1px solid #1e293b;
      margin: 6px 0;
    }
    .print-report-table th, .print-report-table td {
      border: 1px solid #1e293b;
      padding: 3px 1px;
      vertical-align: middle;
    }
    .print-report-table thead th {
      background: #f8fafc;
      font-weight: bold;
    }
    .th-rpt-group { background: #e0f2fe !important; color: #1e3a8a; }
    
    /* 🌟 អក្សរបញ្ឈរច្បាស់ម៉ត់ មិនបាក់បែកជើងអក្សរ */
    .th-rpt-vert-box {
      width: 26px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      overflow: visible;
    }
    .th-rpt-vert {
      display: inline-block;
      white-space: nowrap;
      transform: rotate(-90deg);
      font-size: 10px;
      font-weight: bold;
      color: #1e3a8a;
      line-height: 1;
    }

    /* 🌟 ថ្ងៃខែចន្ទគតិធម្មតា គ្មានប្រអប់ឡើយ (No Box) */
    .clean-lunar-input {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      font-size: 12.5px;
      font-weight: bold;
      color: #1e3a8a;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      text-align: center;
      width: 100%;
      max-width: 480px;
      outline: none;
      margin: 0 auto;
      display: block;
    }

    @page {
      size: A4 landscape;
      margin: 5mm 6mm;
    }
    @media print {
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #landingPage, #mainForm, .viewer-top-bar {
        display: none !important;
      }
      #scoreReportModal {
        display: block !important;
        position: static !important;
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        inset: auto !important;
        overflow: visible !important;
        width: 100% !important;
      }
      .report-paper-container {
        width: 100% !important;
        max-width: 100% !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      .clean-lunar-input {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- ══════════════ 1. LANDING PAGE ══════════════ -->
  <div id="landingPage">
    <div class="landing-header">
      <h1 class="f-moul">ស្រង់ពិន្ទុ</h1>
      <p>បញ្ចូលពិន្ទុសិស្ស តាមប្រភេទនីមួយៗ</p>
    </div>

    <div class="cards-wrapper">
      <div class="score-card monthly" onclick="openScoreForm('monthly')">
        <div class="card-top">
          <div class="card-icon m">📋</div>
          <div class="card-info">
            <h2 class="f-moul" style="color: #0369a1;">ស្រង់ពិន្ទុខែ</h2>
            <p>ពិន្ទុប្រចាំខែ តាមមុខវិជ្ជា</p>
          </div>
        </div>
        <div class="card-bottom">
          <span class="card-badge">សីហា · រួចរាល់</span>
          <span class="card-arrow">➔</span>
        </div>
      </div>

      <div class="score-card semester" onclick="openScoreForm('semester')">
        <div class="card-top">
          <div class="card-icon s">📝</div>
          <div class="card-info">
            <h2 class="f-moul" style="color: #6d28d9;">ស្រង់ពិន្ទុឆមាស</h2>
            <p>ពិន្ទុប្រឡងឆមាសទី១ និងទី២</p>
          </div>
        </div>
        <div class="card-bottom">
          <span class="card-badge">ឆមាសទី១ · រួចរាល់</span>
          <span class="card-arrow">➔</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════ 2. MAIN SCORE TABLE ══════════════ -->
  <div id="mainForm">
    <div class="table-container-card">
      
      <!-- Top Action Toolbar -->
      <div class="top-toolbar">
        <div class="tb-left">
          <button class="action-btn btn-back" onclick="goBackLanding()">⬅ ត្រឡប់</button>
          
          <select id="classSelect" onchange="loadStudents()" class="pill-select">
            <option value="">កំពុងទាញយកថ្នាក់...</option>
          </select>

          <select id="monthSelect" onchange="loadStudents()" class="pill-select">
            <option value="មករា">មករា</option>
            <option value="កុម្ភៈ">កុម្ភៈ</option>
            <option value="មីនា">មីនា</option>
            <option value="មេសា">មេសា</option>
            <option value="ឧសភា">ឧសភា</option>
            <option value="មិថុនា">មិថុនា</option>
            <option value="កក្កដា">កក្កដា</option>
            <option value="សីហា" selected>សីហា</option>
            <option value="កញ្ញា">កញ្ញា</option>
            <option value="តុលា">តុលា</option>
            <option value="វិច្ឆិកា">វិច្ឆិកា</option>
            <option value="ធ្នូ">ធ្នូ</option>
          </select>

          <select id="semesterSelect" onchange="loadStudents()" class="pill-select" style="display:none;">
            <option value="ឆមាសទី១" selected>ឆមាសទី ១</option>
            <option value="ឆមាសទី២">ឆមាសទី ២</option>
          </select>

          <div class="search-input-wrap">
            <span>🔍</span>
            <input type="text" id="searchBox" placeholder="ស្វែងរកសិស្ស..." oninput="renderTable()">
          </div>
        </div>

    var RES_COLS = [

    var scoreType = 'monthly';

    function groups() { return scoreType === 'monthly' ? MONTHLY_GROUPS : SEMESTER_GROUPS; }

      }

      var cs = document.getElementById('classSelect');
      if (!cs.options.length || cs.options[0].value === '') {

      } else {

    function goBackLanding() {
      document.getElementById('mainForm').style.display = 'none';
      document.getElementById('landingPage').style.display = 'block';
    }

    function initCoefState() {
      coefState = {};
      allKeys().forEach(k => { coefState[k] = 1; });
    }

    function toggleLock() {
      isLocked = !isLocked;
      var btn = document.getElementById('btnLock');
      btn.textContent = isLocked ? '🔒 ចាក់សោ' : '🔓 ដោះសោ';
      btn.style.background = isLocked ? '#fee2e2' : '#ffffff';
      btn.style.color = isLocked ? '#b91c1c' : '#1e293b';
      document.querySelectorAll('.score-box').forEach(el => {
        el.disabled = isLocked;
      });
    }

    function loadClassList() {
      google.script.run
        .withSuccessHandler(function(classes) {
          var sel = document.getElementById('classSelect');
          sel.innerHTML = '';
          if (classes && classes.length) {
            classes.forEach(function(c) {
              var o = document.createElement('option');
              o.value = c.toString().trim();
              o.textContent = c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c;
              sel.appendChild(o);
            });
            if (USER_CLASS) sel.value = USER_CLASS;
            loadStudents();
          } else {
            sel.innerHTML = '<option value="">-- ពុំមានថ្នាក់ --</option>';
          }
        })
        .getClassListForSession(TOKEN);
    }

    /* 🌟 មុខងារទាញយកអវត្តមានសិស្សពីសន្លឹកវត្តមាន */
    function loadAttendanceData(cls, period, callback) {
      studentAbsenceData = {};
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        if (callback) callback();
        return;
      }
      
      // ១. បើមាន getStudentAbsenceMapSecured ក្នុង Code.gs
      if (typeof google.script.run.getStudentAbsenceMapSecured === 'function') {
        google.script.run
          .withSuccessHandler(function(map) {
            studentAbsenceData = map || {};
            if (callback) callback();
          })
          .withFailureHandler(function() {
            if (callback) callback();
          })
          .getStudentAbsenceMapSecured(TOKEN, cls, period);
      } else {
        // ២. Fallback: ប្រើ getMonthlyAttendanceForClassSecured ដែលមានស្រាប់
        google.script.run
          .withSuccessHandler(function(stList) {
            if (stList && Array.isArray(stList)) {
              stList.forEach(function(st) {
                var days = st.days || {};
                var count = 0;
                for (var d in days) {
                  if (days[d] === 'C' || days[d] === 'A') count++;
                }
                if (count > 0) studentAbsenceData[st.id] = count;
              });
            }
            if (callback) callback();
          })
          .withFailureHandler(function() {
            if (callback) callback();
          })
          .getMonthlyAttendanceForClassSecured(TOKEN, cls, period);
      }
    }

    function loadStudents() {
      var cls = document.getElementById('classSelect').value;
      var period = getSelectedPeriod();
      if (!cls) return;

      setAutoSaveStatus('✓ រួចរាល់', 'saved');
      document.getElementById('tableArea').innerHTML = '<div style="text-align:center; padding: 50px; color:#64748b;">⚡ កំពុងទាញយកទិន្នន័យ...</div>';

      google.script.run
        .withSuccessHandler(function(data) {
          displayedStudents = data || [];
          
          google.script.run
            .withSuccessHandler(function(result) {
              savedScoresData = (result && result.scores) || {};
              if (result && result.coefficients) {
                coefState = Object.assign({}, coefState, result.coefficients);
              }
              
              // 🌟 ទាញយកទិន្នន័យអវត្តមានមកបង្ហាញក្នុងតារាង និងក្នុងរបាយការណ៍
              loadAttendanceData(cls, period, function() {
                renderTable();
              });
            })
            .getSavedScores(cls, period);
        })
        .getStudentsForScoreEntrySecured(TOKEN, cls, period);
    }

    function cleanScore(input) {
      var v = String(input.value || '').replace(/,/g, '.').replace(/[^0-9.]/g, '');
      var firstDot = v.indexOf('.');
      if (firstDot !== -1) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
      }
      input.value = v;
      if (v !== '' && v !== '.') {
        input.classList.add('filled');
      } else {
        input.classList.remove('filled');
      }
    }

    function validateScore(input) {
      cleanScore(input);
      var v = parseFloat(input.value);
      if (isNaN(v)) {
        input.value = '';
        input.classList.remove('filled');
      } else {
        if (v < 0) v = 0;
        if (v > 10) v = 10;
        input.value = String(v);
        input.classList.add('filled');
      }
      var sid = input.getAttribute('data-sid');
      var key = input.getAttribute('data-key');
      if (sid && key) {
        syncScore(sid, key, input.value);
      }
    }

    function syncScore(sid, key, val) {
      if (!savedScoresData[sid]) savedScoresData[sid] = {};
      if (val === '' || val === '.') {
        delete savedScoresData[sid][key];
      } else {
        savedScoresData[sid][key] = val;
      }
      updateRowTotals(sid);
      updateAutoCoef();
      scheduleAutoSave();
    }

    function updateAutoCoef() {
      var keys = allKeys();
      var activeCount = 0;
      keys.forEach(k => {
        var has = displayedStudents.some(s => {
          var v = parseFloat((savedScoresData[s.id] || {})[k]);
          return !isNaN(v);
        });
        var el = document.getElementById('ac-' + k);
        if (el) {
          el.textContent = has ? '×1' : '×0';
          el.className = 'coef-tag ' + (has ? 'coef-active' : 'coef-zero');
        }
        if (has) activeCount++;
      });
      var totCoefEl = document.getElementById('totalCoefCount');
      if (totCoefEl) totCoefEl.textContent = activeCount;
    }

    function calcTotal(sid) {
      var keys = allKeys(), tot = 0;
      keys.forEach(k => {
        var v = parseFloat((savedScoresData[sid] || {})[k]);
        if (!isNaN(v)) tot += v;
      });
      return tot;
    }

    function calcAvg(sid) {
      var keys = allKeys(), tot = 0, count = 0;
      keys.forEach(k => {
        var v = parseFloat((savedScoresData[sid] || {})[k]);
        if (!isNaN(v)) { tot += v; count++; }
      });
      return count > 0 ? tot / count : 0;
    }

    function getGradeBadge(avg) {
      if (avg >= 9) return { g: 'ល្អប្រសើរ', c: 'grade-a' };
      if (avg >= 8) return { g: 'ល្អណាស់',  c: 'grade-b' };
      if (avg >= 7) return { g: 'ល្អ',       c: 'grade-c' };
      if (avg >= 6) return { g: 'បង្គួរ',     c: 'grade-d' };
      if (avg >= 5) return { g: 'មធ្យម',    c: 'grade-e' };
      return { g: 'ខ្សោយ',   c: 'grade-f' };
    }

    function computeRanks() {
      var list = displayedStudents.map(s => ({ id: s.id, avg: calcAvg(s.id) }));
      list.sort((a, b) => b.avg - a.avg);
      var ranks = {}, prev = null, pr = 0;
      list.forEach((item, i) => {
        if (item.avg === prev) {
          ranks[item.id] = pr;
        } else {
          ranks[item.id] = i + 1;
          pr = i + 1;
          prev = item.avg;
        }
      });
      return ranks;
    }

    function updateRowTotals(sid) {
      var tot = calcTotal(sid);
      var avg = calcAvg(sid);
      
      var tEl = document.getElementById('rt-' + sid);
      if (tEl) tEl.textContent = tot > 0 ? tot.toFixed(2) : '—';

      var aEl = document.getElementById('ra-' + sid);
      if (aEl) aEl.textContent = avg > 0 ? avg.toFixed(2) : '—';

      var gEl = document.getElementById('rg-' + sid);
      if (gEl) {
        if (avg > 0) {
          var gr = getGradeBadge(avg);
          gEl.innerHTML = '<span class="badge-grade ' + gr.c + '">' + gr.g + '</span>';
        } else {
          gEl.textContent = '—';
        }
      }

      var nEl = document.getElementById('rn-' + sid);
      if (nEl) {
        if (avg > 0) {
          nEl.innerHTML = avg >= 5 ? '<span class="status-pass">ជាប់</span>' : '<span class="status-fail">ធ្លាក់</span>';
        } else {
          nEl.textContent = '—';
        }
      }

      var ranks = computeRanks();
      displayedStudents.forEach(s => {
        var rEl = document.getElementById('rr-' + s.id);
        if (rEl) {
          var rVal = ranks[s.id];
          var aVal = calcAvg(s.id);
          rEl.textContent = aVal > 0 ? rVal : '—';
        }
      });
    }

    function renderTable() {
      var area = document.getElementById('tableArea');
      var grps = groups();
      var keys = allKeys();
      var q = (document.getElementById('searchBox').value || '').trim();
      var list = displayedStudents.slice();

      if (q) {
        list = list.filter(s => (s.name || '').includes(q) || (s.id || '').includes(q));
      }

      var ranks = computeRanks();

      var h = '<table class="modern-score-table"><thead>';

      // ── Row 1: Main Group Headers ──
      h += '<tr>'
        +  '<th class="stk stk-1" rowspan="2">ល.រ</th>'
        +  '<th class="stk stk-2" rowspan="2">គោត្តនាម</th>'
        +  '<th class="stk stk-3" rowspan="2">នាម</th>'
        +  '<th class="stk stk-4" rowspan="2">ភេទ</th>';
      
      grps.forEach(g => {
        if (g.cols.length > 1) {
          h += '<th class="th-group-' + g.grp + ' f-bold" colspan="' + g.cols.length + '" style="font-size:13.5px; height:36px;">' + g.label + '</th>';
        } else {
          h += '<th class="th-group-' + g.grp + ' th-vertical-cell" rowspan="2"><div class="th-vertical-wrap">' + g.cols[0].label + '</div></th>';
        }
      });

      h += '<th class="th-group-res f-bold" colspan="' + RES_COLS.length + '" style="font-size:13.5px; height:36px;">' + (scoreType === 'monthly' ? 'លទ្ធផលខែ' : 'លទ្ធផលឆមាស') + '</th>'
        +  '</tr>';

      // ── Row 2: Sub-headers ──
      h += '<tr>';
      grps.forEach(g => {
        if (g.cols.length > 1) {
          g.cols.forEach(c => {
            h += '<th class="th-sub-' + g.grp + ' th-vertical-cell"><div class="th-vertical-wrap">' + c.label + '</div></th>';
          });
        }
      });
      RES_COLS.forEach(c => {
        h += '<th class="th-sub-res th-vertical-cell ' + c.cls + '"><div class="th-vertical-wrap">' + c.label + '</div></th>';
      });
      h += '</tr>';

      // ── Row 3: Coefficient Row ──
      h += '<tr class="coef-row">'
        +  '<td colspan="4" class="stk stk-1" style="text-align:right; padding-right:12px; font-weight:bold;">មេគុណតាមមុខវិជ្ជា</td>';

      grps.forEach(g => {
        g.cols.forEach(c => {
          h += '<td class="th-sub-' + g.grp + '"><span class="coef-tag coef-zero" id="ac-' + c.key + '">×0</span></td>';
        });
      });

      h += '<td class="col-res-tot" style="color:#2563eb; font-weight:bold;" id="totalCoefCount">0</td>'
        +  '<td colspan="' + (RES_COLS.length - 1) + '"></td>'
        +  '</tr>';

      h += '</thead><tbody>';

      if (!list.length) {
        h += '<tr><td colspan="' + (4 + keys.length + RES_COLS.length) + '" style="padding:30px; color:#ef4444;">⚠️ មិនមានទិន្នន័យសិស្សឡើយ</td></tr>';
      } else {
        list.forEach((s, idx) => {
          var sc = savedScoresData[s.id] || {};
          var isF = s.sex === 'ស្រី' || s.sex === 'F';
          
          var parts = (s.name || '').trim().split(/\s+/);
          var lastName = parts.length > 1 ? parts[0] : '';
          var firstName = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];

          var avg = calcAvg(s.id);
          var tot = calcTotal(s.id);
          var gr = getGradeBadge(avg);
          var absVal = (studentAbsenceData[s.id] !== undefined && studentAbsenceData[s.id] > 0) ? studentAbsenceData[s.id] : '—';

          h += '<tr class="dr" data-id="' + s.id + '">'
            +  '<td class="stk stk-1" style="color:#64748b;">' + (idx + 1) + '</td>'
            +  '<td class="stk stk-2">' + lastName + '</td>'
            +  '<td class="stk stk-3">' + firstName + '</td>'
            +  '<td class="stk stk-4" style="font-weight:bold; color:' + (isF ? '#db2777' : '#1e293b') + ';">' + (isF ? 'ស្រី' : 'ប្រុស') + '</td>';

          grps.forEach(g => {
            g.cols.forEach(c => {
              var val = sc[c.key] !== undefined ? sc[c.key] : '';
              var isFilled = val !== '' && val !== '.';
              h += '<td style="background:' + (g.grp === 'kh' ? '#fcfdff' : g.grp === 'ma' ? '#fdfcff' : '#ffffff') + ';">'
                +  '<input type="text" inputmode="decimal" autocomplete="off" value="' + val + '"'
                +  ' data-sid="' + s.id + '" data-key="' + c.key + '"'
                +  ' class="score-box box-' + g.grp + (isFilled ? ' filled' : '') + '"'
                +  (isLocked ? ' disabled' : '')
                +  ' oninput="cleanScore(this);syncScore(\'' + s.id + '\',\'' + c.key + '\',this.value)"'
                +  ' onblur="validateScore(this)">'
                +  '</td>';
            });
          });

          h += '<td class="col-res-tot" id="rt-' + s.id + '">' + (tot > 0 ? tot.toFixed(2) : '—') + '</td>'
            +  '<td class="col-res-avg" id="ra-' + s.id + '">' + (avg > 0 ? avg.toFixed(2) : '—') + '</td>'
            +  '<td class="col-res-rank" id="rr-' + s.id + '">' + (avg > 0 ? (ranks[s.id] || '') : '—') + '</td>'
            +  '<td class="col-res-grade" id="rg-' + s.id + '">' + (avg > 0 ? '<span class="badge-grade ' + gr.c + '">' + gr.g + '</span>' : '—') + '</td>'
            +  '<td class="col-res-note" id="rn-' + s.id + '">' + (avg > 0 ? (avg >= 5 ? '<span class="status-pass">ជាប់</span>' : '<span class="status-fail">ធ្លាក់</span>') : '—') + '</td>'
            +  '<td class="col-res-abs" id="rabs-' + s.id + '">' + absVal + '</td>'
            +  '</tr>';
        });
      }

      h += '</tbody></table>';
      area.innerHTML = h;
      updateAutoCoef();
    }

    function setupArrowKeys() {
      document.addEventListener('keydown', function(e) {
        if (isLocked) return;
        var active = document.activeElement;
        if (!active || !active.classList.contains('score-box')) return;
        var row = active.closest('tr');
        var cell = active.closest('td');
        if (!row || !cell) return;
        var cells = Array.from(row.querySelectorAll('td'));
        var rows = Array.from(row.closest('tbody').querySelectorAll('tr.dr'));
        var ci = cells.indexOf(cell), ri = rows.indexOf(row);
        var myInputs = Array.from(row.querySelectorAll('.score-box'));
        var mp = myInputs.indexOf(active);
        var target = null;
        if (e.key === 'ArrowRight') {
          for (var c = ci + 1; c < cells.length; c++) {
            var i = cells[c].querySelector('.score-box');
            if (i) { target = i; break; }
          }
        } else if (e.key === 'ArrowLeft') {
          for (var c = ci - 1; c >= 0; c--) {
            var i = cells[c].querySelector('.score-box');
            if (i) { target = i; break; }
          }
        } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
          if (ri + 1 < rows.length) {
            var ni = rows[ri + 1].querySelectorAll('.score-box');
            target = ni[mp] || ni[0];
          }
        } else if (e.key === 'ArrowUp') {
          if (ri - 1 >= 0) {
            var pi = rows[ri - 1].querySelectorAll('.score-box');
            target = pi[mp] || pi[0];
          }
        }
        if (target) {
          e.preventDefault();
          target.focus();
          target.select();
          document.querySelectorAll('.focused-row').forEach(r => r.classList.remove('focused-row'));
          target.closest('tr').classList.add('focused-row');
        }
      });

      document.addEventListener('focusin', function(e) {
        if (e.target.classList && e.target.classList.contains('score-box')) {
          document.querySelectorAll('.focused-row').forEach(r => r.classList.remove('focused-row'));
          if (e.target.closest('tr')) e.target.closest('tr').classList.add('focused-row');
        }
      });
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      setAutoSaveStatus('⏳ កំពុងរង់ចាំ...', 'saving');
      autoSaveTimer = setTimeout(function() {
        autoSaveNow();
      }, 1000);
    }

    function buildPayload() {
      var cls = document.getElementById('classSelect').value;
      var period = getSelectedPeriod();
      var grps = groups();
      var keys = allKeys();
      var subjectLabels = grps.flatMap(g => g.cols.map(c => c.label));

      var scoreData = displayedStudents.map(s => {
        var sc = savedScoresData[s.id] || {};
        var entry = { id: s.id, name: s.name, sex: s.sex };
        keys.forEach(k => { entry[k] = sc[k] !== undefined ? sc[k] : ''; });
        return entry;
      });

      return {
        className: cls,
        scoreType: scoreType,
        period: period,
        month: period,
        scores: scoreData,
        activeKeys: keys,
        subjectLabels: subjectLabels,
        coefficients: coefState
      };
    }

    function autoSaveNow() {
      if (isLocked) return;
      var cls = document.getElementById('classSelect').value;
      if (!cls || !displayedStudents.length) return;
      if (isAutoSaving) return;

      isAutoSaving = true;
      setAutoSaveStatus('⏳ កំពុងរក្សាទុក...', 'saving');

      google.script.run
        .withSuccessHandler(function() {
          isAutoSaving = false;
          setAutoSaveStatus('✓ បានរក្សាទុក', 'saved');
        })
        .withFailureHandler(function(err) {
          isAutoSaving = false;
          setAutoSaveStatus('⚠ រក្សាមិនបាន', 'error');
          console.warn('Auto-save error:', err);
        })
        .saveMonthlyScoresSecured(TOKEN, buildPayload());
    }

    function saveScores() {
      if (isLocked) { alert('🔒 ពិន្ទុត្រូវបានចាក់សោ!'); return; }
      var cls = document.getElementById('classSelect').value;
      if (!cls) { alert('សូមជ្រើសរើសថ្នាក់!'); return; }
      
      var btn = document.getElementById('btnSave');
      btn.textContent = '⏳ កំពុងរក្សា...';
      btn.disabled = true;
      setAutoSaveStatus('⏳ កំពុងរក្សាទុក...', 'saving');

      google.script.run
        .withSuccessHandler(function(msg) {
          btn.textContent = '💾 រក្សាទុក';
          btn.disabled = false;
          setAutoSaveStatus('✓ បានរក្សាទុក', 'saved');
          alert('✓ ' + msg);
        })
        .withFailureHandler(function(err) {
          btn.textContent = '💾 រក្សាទុក';
          btn.disabled = false;
          setAutoSaveStatus('⚠ រក្សាមិនបាន', 'error');
          alert('❌ កំហុស៖ ' + err.message);
        })
        .saveMonthlyScoresSecured(TOKEN, buildPayload());
    }

      var period = getSelectedPeriod();
      var opt = {
        margin:       [4, 6, 4, 6],
        filename:     'Score_Report_' + cls + '_' + period + '.pdf',
        image:        { type: 'jpeg', quality: 1.0 },
        html2canvas:  { 
          scale: 3,
          useCORS: true, 
          letterRendering: true,

        </div>

        <table class="print-report-table">
          <thead>${theadHtml}</thead>
          <tbody>${rowsHtml}</tbody>
        </table>

          <div>បញ្ជីបញ្ចូលក្នុង${scoreType === 'monthly' ? 'ខែ' : 'ឆមាស'}នេះចំនួន <strong>${totalStudents} នាក់</strong> ក្នុងនោះសិស្សស្រី <strong>${femaleCount} នាក់</strong> ប្រុស <strong>${maleCount} នាក់</strong></div>

    function exportToExcel() {
      if (!displayedStudents.length) { alert('ពុំមានទិន្នន័យ!'); return; }
      var grps = groups();
      var keys = allKeys();
      var labels = grps.flatMap(g => g.cols.map(c => c.label));
      var header = ['ល.រ','អត្តលេខ','ឈ្មោះ','ភេទ'].concat(labels, ['ពិន្ទុសរុប','មធ្យមភាគ','ចំណាត់ថ្នាក់','និទ្ទេស','លទ្ធផល','អវត្តមាន']);
      var ranks = computeRanks();
      var rows = [header];

      displayedStudents.forEach((s, idx) => {
        var sc = savedScoresData[s.id] || {};
        var row = [idx + 1, s.id || '', s.name || '', s.sex || ''];
        keys.forEach(k => {
          var v = parseFloat(sc[k]);
          row.push(isNaN(v) ? '' : v);
        });
        var tot = calcTotal(s.id);
        var avg = calcAvg(s.id);
        var gr = getGradeBadge(avg);
        var absVal = (studentAbsenceData[s.id] !== undefined && studentAbsenceData[s.id] > 0) ? studentAbsenceData[s.id] : '';
        row.push(
          tot > 0 ? tot.toFixed(2) : '',
          avg > 0 ? avg.toFixed(2) : '',
          ranks[s.id] || '',
          gr.g,
          avg >= 5 ? 'ជាប់' : 'ធ្លាក់',
          absVal
        );
        rows.push(row);
      });

      var ws = XLSX.utils.aoa_to_sheet(rows);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'ពិន្ទុ');
      var cls = document.getElementById('classSelect').value;
      XLSX.writeFile(wb, 'ពិន្ទុ_ថ្នាក់ទី' + cls + '_' + getSelectedPeriod() + '.xlsx');
    }
  </script>
