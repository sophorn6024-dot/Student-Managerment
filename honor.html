<!DOCTYPE html>
<html lang="km">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>តារាងកិត្តិយស - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Moul និង Kantumruy Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Moul&family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       GENERAL
    ========================================================= */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background: #e2e8f0;
      padding-bottom: 80px;
    }

    .font-moul {
      font-family: 'Moul', cursive;
    }

    /* =========================================================
       CONTROL PANEL
    ========================================================= */
    .control-panel {
      width: min(100%, 960px);
      margin: 0 auto 20px;
    }

    .control-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .control-left {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .control-group select {
      max-width: 100%;
    }

    /* ── STYLES FOR ZOOM BUTTONS ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .zoom-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
    }
    .zoom-btn:hover { background: rgba(255, 255, 255, 0.18); }
    .zoom-btn.active {
      background: #2563eb !important;
      border-color: #3b82f6 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* =========================================================
       A4 VIEW WRAPPER
    ========================================================= */
    .a4-view {
      width: 794px;
      height: 1123px;
      margin: 0 auto;
      position: relative;
      transform-origin: top center;
      transform: scale(var(--a4-scale, 1));
      margin-bottom: calc(1123px * (var(--a4-scale, 1) - 1));
      transition: transform 0.2s ease;
    }

    /* =========================================================
       HONOR CARD
    ========================================================= */
    .honor-card {
      width: 794px;
      height: 1123px;
      background: #ffffff;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.20);
      margin: 0 auto;
      overflow: hidden;
      border: 10px solid #047857;
      outline: 4px solid #d97706;
      outline-offset: -14px;
      padding: 45px;
    }

    /* =========================================================
       PHOTO
    ========================================================= */
    .photo-box {
      border: 3px solid #d97706;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      background: #f8fafc;
      transition: all 0.3s ease;
    }

    .photo-box:hover {
      transform: scale(1.03);
    }

    /* =========================================================
       DRAGGABLE BLOCKS (ឈ្មោះគ្រូ)
    ========================================================= */
    .draggable-block {
      cursor: move;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      border: 1px dashed transparent;
      border-radius: 4px;
      padding: 4px 6px;
      display: inline-block;
    }

    .draggable-block:hover {
      border-color: #93c5fd;
      background: rgba(59, 130, 246, 0.06);
    }

    .draggable-block.dragging {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.10);
    }

    /* =========================================================
       MOBILE RESPONSIVE
    ========================================================= */
    @media (max-width: 600px) {
      body {
        background: #e2e8f0;
        padding: 8px !important;
        padding-bottom: 100px !important;
      }

      .control-panel {
        width: 100%;
        margin-bottom: 12px;
        padding: 12px !important;
        border-radius: 14px;
      }

      .control-inner {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .control-left {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        width: 100%;
      }

      .control-group {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px;
        width: 100%;
      }

      .control-group select {
        width: 100%;
        min-width: 0;
        font-size: 14px;
        padding: 8px 10px !important;
        min-height: 40px;
      }

      #periodContainer {
        width: 100%;
      }

      #periodContainer select {
        width: 100%;
        font-size: 14px;
        padding: 8px 10px !important;
        min-height: 40px;
      }

      .zoom-btn-group {
        width: 100%;
        justify-content: center;
      }

      .zoom-btn {
        flex: 1;
        text-align: center;
      }
    }

    /* =========================================================
       PRINT
    ========================================================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html,
      body {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 0;
        overflow: visible !important;
        background: none !important;
      }

      .no-print {
        display: none !important;
      }

      .a4-view {
        width: 794px !important;
        height: 1123px !important;
        transform: none !important;
        margin: 0 !important;
        position: relative !important;
      }

      body {
        background: none;
        padding: 0;
      }

      .draggable-block {
        border-color: transparent !important;
        background: transparent !important;
        padding: 0 !important;
        cursor: default;
      }

      .honor-card {
        box-shadow: none;
        border: 8px solid #047857;
        outline: 3px solid #d97706;
        outline-offset: -12px;
        width: 794px;
        height: 1123px;
        margin: 0;
        padding: 45px;
      }

      input,
      select {
        border: none !important;
        background: transparent !important;
        appearance: none;
        padding: 0 !important;
        text-align: center;
        font-weight: bold;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        color: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>

       JAVASCRIPT (GITHUB & APPS SCRIPT COMPATIBLE)
  ========================================================== -->
  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe6vrQshGAPglgmmZykljXazDNh1ZwWSRdFDAip1WWWRky24lmBo-qicLK3_i10AvT/exec';

    var _urlParams = new URLSearchParams(window.location.search);
    function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }

    var TOKEN        = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('school_token') || '';
    var USER_ROLE    = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || _get('school_user_role')  || 'teacher';
    var USER_CLASS   = (window.parent && window.parent.USER_CLASS)    || _urlParams.get('cls')   || _urlParams.get('class')   || _get('krou_user_class')    || _get('school_user_class') || '';
    var TEACHER_NAME = (window.parent && window.parent.TEACHER_NAME) || _get('krou_teacher_name') || '';

    // ── Universal API Caller ──
    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = params.token || TOKEN;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[action](params);
        });
      }

      if (typeof callBackendApi === 'function') {
        return callBackendApi(action, params);
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      if (json && json.success === false) throw new Error(json.error || json.message || 'Server error');
      if (json && json.data !== undefined) return json.data;
      return json;
    }

    const PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='240'>" +
      "<rect width='100%' height='100%' fill='#f1f5f9'/>" +
      "<circle cx='100' cy='90' r='38' fill='#cbd5e1'/>" +
      "<path d='M40 210 Q100 140 160 210 Z' fill='#cbd5e1'/>" +
      "</svg>"
    );

    function resizeA4View() {
      const wrapper = document.getElementById('a4View');
      if (!wrapper) return;
      const screenWidth = window.innerWidth;
      if (screenWidth > 820) {
        wrapper.style.setProperty('--a4-scale', '1');
        wrapper.style.height = '1123px';
        wrapper.style.marginBottom = '0px';
        return;
      }
      const bodyStyle = getComputedStyle(document.body);
      const bodyPaddingLeft = parseFloat(bodyStyle.paddingLeft) || 0;
      const bodyPaddingRight = parseFloat(bodyStyle.paddingRight) || 0;
      const availableWidth = window.innerWidth - bodyPaddingLeft - bodyPaddingRight;
      let scale = availableWidth / 794;
      scale = Math.min(scale, 1);
      scale = Math.max(scale, 0.35);
      wrapper.style.setProperty('--a4-scale', scale);
      wrapper.style.height = (1123 * scale) + 'px';
      wrapper.style.marginBottom = '0px';
    }

    window.addEventListener('load', resizeA4View);
    window.addEventListener('resize', resizeA4View);

    function setZoom(scale, btnEl) {
      const wrapper = document.getElementById('a4View');
      if (wrapper) {
        wrapper.style.setProperty('--a4-scale', scale);
        wrapper.style.height = (1123 * scale) + 'px';
        wrapper.style.marginBottom = '0px';
      }
      document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
    }

    function doPrint() {
      window.focus();
      setTimeout(function() {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    function toKhmerNum(num) {
      if (num === null || num === undefined) return '';
      const kd = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
      return num.toString().split('').map(d => kd[parseInt(d)] !== undefined ? kd[parseInt(d)] : d).join('');
    }

    function setCurrentKhmerDay() {
      const dayEl = document.getElementById('inputDay');
      if (dayEl) dayEl.value = toKhmerNum(new Date().getDate());
    }

    function setCurrentKhmerYear() {
      const yearEl = document.getElementById('inputYear');
      if (yearEl) yearEl.value = toKhmerNum(new Date().getFullYear());
    }

    function alignFooterLabels() {
      const spacer = document.getElementById('directorTopSpacer');
      const directorLabel = document.getElementById('directorLabel');
      const teacherLabel = document.getElementById('teacherLabel');
      if (!spacer || !directorLabel || !teacherLabel) return;
      spacer.style.height = '0px';
      const dRect = directorLabel.getBoundingClientRect();
      const tRect = teacherLabel.getBoundingClientRect();
      const wrapper = document.getElementById('a4View');
      let scale = 1;
      const isPrinting = window.matchMedia && window.matchMedia('print').matches;
      if (wrapper && !isPrinting) {
        const scaleStr = getComputedStyle(wrapper).getPropertyValue('--a4-scale');
        const parsed = parseFloat(scaleStr);
        if (!isNaN(parsed) && parsed > 0) scale = parsed;
      }
      const desiredGap = 10;
      const diffScreen = tRect.top - dRect.top;
      const diffSource = (diffScreen / scale) + desiredGap;
      if (diffSource > 0) spacer.style.height = diffSource + 'px';
    }

    window.onload = async function () {
      setCurrentKhmerDay();
      setCurrentKhmerYear();
      alignFooterLabels();
      setTimeout(alignFooterLabels, 300);

      window.addEventListener('resize', alignFooterLabels);
      window.addEventListener('beforeprint', alignFooterLabels);
      window.addEventListener('afterprint', alignFooterLabels);

      for (let i = 1; i <= 5; i++) {
        document.getElementById(`img${i}`).src = PLACEHOLDER_IMG;
      }

      if (TEACHER_NAME) {
        document.getElementById('teacherNameDisplay').innerText = TEACHER_NAME;
      }

      initDraggableBlock('teacherNameDisplay', 'teacherNameDragPosPct');
      resizeA4View();

      // ── ទាញយកព័ត៌មាន Session និងបញ្ជីថ្នាក់ ──
      try {
        const session = await apiCall('getCurrentSession', { token: TOKEN });
        if (session && session.loggedIn && session.name) {
          document.getElementById('teacherNameDisplay').innerText = session.name;
        }
      } catch(e){}

      try {
        const res = await apiCall('getClassListForSession', { token: TOKEN });
        const classes = Array.isArray(res) ? res : (res && res.classes ? res.classes : (res && res.data ? res.data : []));
        populateClasses(classes);
      } catch(err) {
        console.error("getClassList error:", err);
      }
    };

    function initDraggableBlock(elementId, storageKey) {
      const el = document.getElementById(elementId);
      const page = document.querySelector('.honor-card');
      if (!el || !page) return;

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (saved && typeof saved.leftPct === 'number' && typeof saved.topPct === 'number') {
          el.style.position = 'absolute';
          el.style.left = saved.leftPct + '%';
          el.style.top = saved.topPct + '%';
          el.style.margin = '0';
        }
      } catch (e) {}

      let isDragging = false, offsetX = 0, offsetY = 0;

      function startDrag(clientX, clientY) {
        isDragging = true;
        el.classList.add('dragging');
        if (el.style.position !== 'absolute') {
          const pageRect = page.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          el.style.position = 'absolute';
          el.style.left = (rect.left - pageRect.left) + 'px';
          el.style.top = (rect.top - pageRect.top) + 'px';
          el.style.margin = '0';
        }
        const rect2 = el.getBoundingClientRect();
        offsetX = clientX - rect2.left;
        offsetY = clientY - rect2.top;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        const pageRect = page.getBoundingClientRect();
        const leftPx = clientX - offsetX - pageRect.left;
        const topPx = clientY - offsetY - pageRect.top;
        el.style.left = leftPx + 'px';
        el.style.top = topPx + 'px';
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');
        const pageRect = page.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();
        const leftPct = pageRect.width > 0 ? ((elRect.left - pageRect.left) / pageRect.width) * 100 : 0;
        const topPct = pageRect.height > 0 ? ((elRect.top - pageRect.top) / pageRect.height) * 100 : 0;
        el.style.left = leftPct + '%';
        el.style.top = topPct + '%';
        localStorage.setItem(storageKey, JSON.stringify({ leftPct: leftPct, topPct: topPct }));
      }

      el.addEventListener('mousedown', function (e) { startDrag(e.clientX, e.clientY); e.preventDefault(); });
      document.addEventListener('mousemove', function (e) { moveDrag(e.clientX, e.clientY); });
      document.addEventListener('mouseup', endDrag);

      el.addEventListener('touchstart', function (e) {
        const t = e.touches[0];
        startDrag(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (!isDragging) return;
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchend', endDrag);
    }

    function resetDraggablePositions() {
      localStorage.removeItem('teacherNameDragPosPct');
      const el = document.getElementById('teacherNameDisplay');
      if (el) {
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.margin = '';
      }
    }

    function populateClasses(classes) {
      const select = document.getElementById('classSelect');
      select.innerHTML = '';
      (classes || []).forEach(c => {
        select.innerHTML += `<option value="${c}">${c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c}</option>`;
      });

      if (USER_CLASS && USER_ROLE !== 'admin') {
        select.value = USER_CLASS.toString().startsWith('ថ្នាក់') ? USER_CLASS : 'ថ្នាក់ទី ' + USER_CLASS;
        select.disabled = true;
      }

      loadHonorRoll();
    }

    function togglePeriodOptions() {
      const type = document.getElementById('typeSelect').value;
      const container = document.getElementById('periodContainer');

      if (type === 'ប្រចាំខែ') {
        container.innerHTML = `
          <label class="font-bold text-sm text-slate-700">រយៈពេល៖</label>
          <select id="monthSelect" class="border p-2 rounded text-sm bg-slate-50" onchange="loadHonorRoll()">
            <option value="មករា">មករា</option>
            <option value="កុម្ភៈ" selected>កុម្ភៈ</option>
            <option value="មីនា">មីនា</option>
            <option value="មេសា">មេសា</option>
            <option value="ឧសភា">ឧសភា</option>
            <option value="មិថុនា">មិថុនា</option>
            <option value="កក្កដា">កក្កដា</option>
            <option value="សីហា">សីហា</option>
            <option value="កញ្ញា">កញ្ញា</option>
            <option value="តុលា">តុលា</option>
            <option value="វិច្ឆិកា">វិច្ឆិកា</option>
            <option value="ធ្នូ">ធ្នូ</option>
          </select>
        `;
      } else if (type === 'ការប្រឡងឆមាស') {
        container.innerHTML = `
          <label class="font-bold text-sm text-slate-700">រយៈពេល៖</label>
          <select id="monthSelect" class="border p-2 rounded text-sm bg-slate-50" onchange="loadHonorRoll()">
            <option value="ឆមាសទី១">ការប្រឡងឆមាសទី១</option>
            <option value="ឆមាសទី២">ការប្រឡងឆមាសទី២</option>
          </select>
        `;
      } else if (type === 'ប្រចាំឆមាស') {
        container.innerHTML = `
          <label class="font-bold text-sm text-slate-700">រយៈពេល៖</label>
          <select id="monthSelect" class="border p-2 rounded text-sm bg-slate-50" onchange="loadHonorRoll()">
            <option value="ប្រចាំឆមាសទី១">ប្រចាំឆមាសទី១ (សរុប)</option>
            <option value="ប្រចាំឆមាសទី២">ប្រចាំឆមាសទី២ (សរុប)</option>
          </select>
        `;
      } else if (type === 'ប្រចាំឆ្នាំ') {
        container.innerHTML = `
          <label class="font-bold text-sm text-slate-700">រយៈពេល៖</label>
          <select id="monthSelect" class="border p-2 rounded text-sm bg-slate-50" onchange="loadHonorRoll()">
            <option value="ប្រចាំឆ្នាំ">ពេញមួយឆ្នាំសិក្សា</option>
          </select>
        `;
      }
      loadHonorRoll();
    }

    function getPeriodLabel(period) {
      const labels = {
        "ឆមាសទី១": "ការប្រឡងឆមាសទី១",
        "ឆមាសទី២": "ការប្រឡងឆមាសទី២",
        "ប្រចាំឆមាសទី១": "ប្រចាំឆមាសទី១ (សរុប)",
        "ប្រចាំឆមាសទី២": "ប្រចាំឆមាសទី២ (សរុប)",
        "ប្រចាំឆ្នាំ": "ប្រចាំឆ្នាំសិក្សា"
      };
      return labels[period] || ("ប្រចាំខែ" + period);
    }

    async function loadHonorRoll() {
      const classSelect = document.getElementById('classSelect');
      if (!classSelect || !classSelect.value) return;

      const className = classSelect.value.replace(/^ថ្នាក់ទី\s*/, '');
      const type = document.getElementById('typeSelect').value;
      const monthSelect = document.getElementById('monthSelect');
      if (!monthSelect) return;
      const period = monthSelect.value;

      document.getElementById('lblClass').innerText = "ថ្នាក់ទី " + className;
      document.getElementById('lblMonth').innerText = getPeriodLabel(period);

      const inputMonthEl = document.getElementById('inputMonth');
      if (inputMonthEl) {
        if (type === 'ប្រចាំខែ') {
          inputMonthEl.value = period;
        } else {
          inputMonthEl.value = '';
        }
      }

      // Reset cards to placeholder
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`name${i}`).innerText = "កំពុងទាញយក...";
        document.getElementById(`img${i}`).src = PLACEHOLDER_IMG;
        document.getElementById(`rank${i}`).style.display = "block";
      }

      try {
        // 🌟 ហៅយកទិន្នន័យសិស្សពូកែ និងទិន្នន័យកាត (ដើម្បីទាញយក URL រូបថតពិត)
        const [honorRes, cardRes] = await Promise.all([
          apiCall('getTopStudentsForHonorRoll', {
            token: TOKEN,
            className: className,
            cls: className,
            month: period,
            period: period
          }),
          apiCall('getAllStudentsCardData', {
            token: TOKEN,
            className: className,
            classFilter: className,
            cls: className
          }).catch(() => [])
        ]);

        const rawList = Array.isArray(honorRes) ? honorRes : (honorRes && honorRes.topStudents ? honorRes.topStudents : (honorRes && honorRes.scores ? honorRes.scores : (honorRes && honorRes.data ? honorRes.data : [])));
        const cardData = Array.isArray(cardRes) ? cardRes : (cardRes && cardRes.data ? cardRes.data : []);

        const photoMap = {};
        cardData.forEach(s => {
          if (s.id && s.imageUrl) photoMap[String(s.id).trim()] = s.imageUrl;
          if (s.name && s.imageUrl) photoMap[String(s.name).trim()] = s.imageUrl;
        });

        renderHonorRoll({ topStudents: rawList, photoMap: photoMap });
      } catch(err) {
        console.error("loadHonorRoll error:", err);
        renderHonorRoll({ topStudents: [] });
      }
    }

    function renderHonorRoll(res) {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`name${i}`).innerText = "-";
        document.getElementById(`img${i}`).src = PLACEHOLDER_IMG;
        document.getElementById(`rank${i}`).style.display = "none";
      }

      if (!res || !res.topStudents || res.topStudents.length === 0) {
        return;
      }

      const photoMap = res.photoMap || {};

      res.topStudents.forEach((s, idx) => {
        const num = idx + 1;
        if (num > 5) return;

        document.getElementById(`rank${num}`).style.display = "block";
        document.getElementById(`name${num}`).innerText = s.name || '';

        const realImg = s.imageUrl || photoMap[String(s.id).trim()] || photoMap[String(s.name).trim()];
        if (realImg) {
          document.getElementById(`img${num}`).src = realImg;
        }
      });
    }

    document.addEventListener('touchmove', function () {}, { passive: true });
  </script>
