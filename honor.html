<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>តារាងកិត្តិយស - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Moul និង Kantumruy Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Moul&family=Kantumruy+Pro:wght@300;400;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================================
       GENERAL
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background: #e2e8f0;
    }

    .font-moul {
      font-family: 'Moul', cursive;
    }


    /* =========================================================
       CONTROL PANEL
    ========================================================= */

    .control-panel {
      width: min(100%, 960px);
      margin: 0 auto 24px;
    }

    .control-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .control-left {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .control-group select {
      max-width: 100%;
    }


    /* =========================================================
       A4 VIEW WRAPPER
       
       ក្រដាសនៅតែមានទំហំ A4 794 x 1123px
       ប៉ុន្តែនៅលើទូរសព្ទនឹង Scale តាមអេក្រង់
    ========================================================= */

    .a4-view {
      width: 794px;
      height: 1123px;
      margin: 0 auto;

      position: relative;

      transform-origin: top center;

      /* JS នឹងកំណត់ scale */
      transform: scale(var(--a4-scale, 1));

      /*
        កន្លែងខាងក្រោមត្រូវបាន JS គ្រប់គ្រង
        ដើម្បីកុំឱ្យមានទំហំទំនេរច្រើននៅលើ mobile
      */
      margin-bottom: calc(1123px * (var(--a4-scale, 1) - 1));
    }


    /* =========================================================
       HONOR CARD
    ========================================================= */

    .honor-card {

      width: 794px;
      height: 1123px;

      background: #ffffff;

      position: relative;

      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.20);

      margin: 0 auto;

      overflow: hidden;

      border: 10px solid #047857;

      outline: 4px solid #d97706;

      outline-offset: -14px;

      padding: 45px;
    }


    /* =========================================================
       PHOTO
    ========================================================= */

    .photo-box {

      border: 3px solid #d97706;

      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);

      background: #f8fafc;

      transition: all 0.3s ease;
    }

    .photo-box:hover {
      transform: scale(1.03);
    }


    /* =========================================================
       DRAGGABLE BLOCKS (ឈ្មោះគ្រូ / កាលបរិច្ឆេទ)
    ========================================================= */

    .draggable-block {
      cursor: move;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      border: 1px dashed transparent;
      border-radius: 6px;
      padding: 4px 6px;
    }

    .draggable-block:hover {
      border-color: #93c5fd;
      background: rgba(59, 130, 246, 0.06);
    }

    .draggable-block.dragging {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.10);
    }


    /* =========================================================
       DRAGGABLE BLOCKS (ឈ្មោះគ្រូ / ថ្ងៃទី)
    ========================================================= */

    .draggable-block {
      cursor: move;
      padding: 4px 6px;
      border: 1px dashed transparent;
      border-radius: 4px;
      touch-action: none;
      display: inline-block;
    }

    .draggable-block:hover {
      border-color: #93c5fd;
      background: rgba(59, 130, 246, 0.06);
    }

    .draggable-block.dragging {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.10);
    }


    /* =========================================================
       MOBILE RESPONSIVE
    ========================================================= */

    @media (max-width: 600px) {

      body {
        background: #e2e8f0;
        padding: 8px !important;
      }

      /*
        Control Panel
      */

      .control-panel {
        width: 100%;
        margin-bottom: 12px;
        padding: 12px !important;
        border-radius: 14px;
      }

      .control-inner {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .control-left {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        width: 100%;
      }

      .control-group {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px;
        width: 100%;
      }

      .control-group label {
        white-space: nowrap;
        display: flex;
        align-items: center;
      }

      .control-group select {
        width: 100%;
        min-width: 0;
        font-size: 14px;
        padding: 8px 10px !important;
        min-height: 40px;
      }

      #periodContainer {
        width: 100%;
      }

      #periodContainer select {
        width: 100%;
        font-size: 14px;
        padding: 8px 10px !important;
        min-height: 40px;
      }

      .control-left>button {
        width: 100%;
        min-height: 42px;
        font-size: 14px;
      }

      .control-inner>button {
        width: 100%;
        min-height: 42px;
        font-size: 14px;
      }


      /*
        A4 Container

        គណនា scale ដោយ JavaScript
        ដូច្នេះកាតនឹងសមនឹងទទឹងទូរសព្ទ
      */

      .a4-view {
        margin-left: auto;
        margin-right: auto;

        transform-origin: top center;
      }


      /*
        Honor Card
      */

      .honor-card {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.16);
      }
    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-width: 380px) {

      body {
        padding: 5px !important;
      }

      .control-panel {
        padding: 9px !important;
      }

      .control-group select,
      #periodContainer select {
        font-size: 13px;
      }
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (min-width: 601px) and (max-width: 900px) {

      body {
        padding: 12px !important;
      }

      .control-panel {
        width: 100%;
      }
    }


    /* =========================================================
       PRINT
    ========================================================= */

    @media print {

      @page {
        size: A4 portrait;
        margin: 0;
      }

      html,
      body {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 0;
        overflow: visible !important;
        background: none !important;
      }

      .no-print {
        display: none !important;
      }

      .a4-view {
        width: 794px !important;
        height: 1123px !important;

        transform: none !important;

        margin: 0 !important;

        position: relative !important;
      }

      body {
        background: none;
        padding: 0;
      }

      .draggable-block {
        border-color: transparent !important;
        background: transparent !important;
        padding: 0 !important;
        cursor: default;
      }

      .honor-card {
        box-shadow: none;

        border: 8px solid #047857;

        outline: 3px solid #d97706;

        outline-offset: -12px;

        width: 794px;

        height: 1123px;

        margin: 0;

        padding: 45px;
      }

      input,
      select {
        border: none !important;
        background: transparent !important;
        appearance: none;

        padding: 0 !important;

        text-align: center;

        font-weight: bold;
      }

      /*
        បង្ខំឱ្យពណ៌ background ចេញពេល Print
      */

      * {
        -webkit-print-color-adjust: exact !important;
        color: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>

        <!-- SHOW BUTTON -->

       RESPONSIVE A4 SCALE
       
       មុខងារនេះធ្វើឱ្យ A4 សមនឹងទូរសព្ទ
       ដោយមិនប៉ះពាល់ដល់ទំហំ A4 ពេល Print
    ========================================================== */

    function resizeA4View() {

      const wrapper = document.getElementById('a4View');

      if (!wrapper) return;

      const screenWidth = window.innerWidth;

      /*
        Desktop
      */

      if (screenWidth > 600) {

        wrapper.style.setProperty('--a4-scale', '1');

        wrapper.style.height = '1123px';

        wrapper.style.marginBottom = '0px';

        return;
      }


      /*
        Mobile

        ដក padding ចេញពី body
        ដើម្បីទទួលបានទំហំអេក្រង់អតិបរមា
      */

      const bodyStyle = getComputedStyle(document.body);

      const bodyPaddingLeft =
        parseFloat(bodyStyle.paddingLeft) || 0;

      const bodyPaddingRight =
        parseFloat(bodyStyle.paddingRight) || 0;


      const availableWidth =
        window.innerWidth -
        bodyPaddingLeft -
        bodyPaddingRight;


      /*
        Scale តាមទទឹងអេក្រង់
      */

      let scale =
        availableWidth / 794;


      /*
        កុំឱ្យធំពេក
      */

      scale = Math.min(scale, 1);


      /*
        កុំឱ្យតូចជាង 0.35
      */

      scale = Math.max(scale, 0.35);


      wrapper.style.setProperty(
        '--a4-scale',
        scale
      );


      /*
        កំណត់ Height ពិតរបស់ wrapper
        បន្ទាប់ពី Scale
      */

      const scaledHeight =
        1123 * scale;


      wrapper.style.height =
        scaledHeight + 'px';


      wrapper.style.marginBottom =
        '0px';
    }



    /*
      Resize ពេលបើក
    */

    window.addEventListener(
      'load',

    /* =========================================================

       ចាប់តាមថ្ងៃ និងឆ្នាំបច្ចុប្បន្នដោយស្វ័យប្រវត្តិ
       (លេខខ្មែរ)

    function toKhmerNum(num) {

      if (num === null || num === undefined) return '';

      const kd = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];

      return num.toString().split('').map(
        d => kd[parseInt(d)] !== undefined ? kd[parseInt(d)] : d
      ).join('');

    }


    function setCurrentKhmerDay() {

       ព្រោះជួរឈរគ្រូមានប្លុកកាលបរិច្ឆេទបន្ថែមនៅខាងលើ
       ធ្វើឱ្យស្លាកគ្រូចុះទាបជាងធម្មតា។ ដើម្បីធានាថាស្លាក
       "នាយកសាលា" នៅជានិច្ចទាបជាងស្លាក "គ្រូបន្ទុកថ្នាក់"
       (មិនថាទំហំពុម្ពអក្សរប្រែប្រួលយ៉ាងណា) យើងវាស់ទីតាំង
       ជាក់ស្តែងរបស់ស្លាកទាំងពីរ ហើយកែតម្រូវដោយស្វ័យប្រវត្តិ។
    ========================================================== */

    function alignFooterLabels() {

      const spacer =
        document.getElementById('directorTopSpacer');

      const directorLabel =
        document.getElementById('directorLabel');

      const teacherLabel =
        document.getElementById('teacherLabel');

      if (!spacer || !directorLabel || !teacherLabel) return;


      /*
        Reset មុនគណនាឡើងវិញ
      */

      spacer.style.height = '0px';


      const dRect =
        directorLabel.getBoundingClientRect();

      const tRect =
        teacherLabel.getBoundingClientRect();


      /*
        ✅ គិតគូរពី --a4-scale (mobile scaling)
        ព្រោះ getBoundingClientRect() ត្រឡប់ជាទីតាំង
        តាមអេក្រង់ (ក្រោយពី scale) ប៉ុន្តែ style.height
        ដែលយើងកំណត់ គឺជា pixel ក្នុងទំហំដើម (794px)
      */

      const wrapper =
        document.getElementById('a4View');

      let scale = 1;

      const isPrinting =
        window.matchMedia &&
        window.matchMedia('print').matches;

      if (wrapper && !isPrinting) {

        const scaleStr =
          getComputedStyle(wrapper).getPropertyValue('--a4-scale');

        const parsed = parseFloat(scaleStr);

        if (!isNaN(parsed) && parsed > 0) {
          scale = parsed;
        }

      }


      /*
        គម្លាតបន្ថែម (គិតជា pixel ក្នុងទំហំដើម)
        ដើម្បីធានាថាវាឃើញច្បាស់ថាទាបជាង
      */

      const desiredGap = 10;

      const diffScreen =
        tRect.top - dRect.top;

      const diffSource =
        (diffScreen / scale) + desiredGap;


      if (diffSource > 0) {
        spacer.style.height = diffSource + 'px';
      }

    }

    /* =========================================================
       ✅ DRAG & DROP — ឈ្មោះគ្រូបន្ទុកថ្នាក់ / កាលបរិច្ឆេទ

       ដូច្នេះទីតាំងនៅលើអេក្រង់ និងទីតាំងពេលបោះពុម្ព
       នឹងដូចគ្នាជានិច្ច ទោះបីអេក្រង់ធំតូចខុសគ្នាក៏ដោយ
    ========================================================== */

    function initDraggableBlock(elementId, storageKey) {

      const el = document.getElementById(elementId);

      const page = document.querySelector('.honor-card');

      if (!el || !page) return;


      /*
        ស្តារទីតាំងចាស់ដែលធ្លាប់អូសទុក (ជា % ធៀបនឹង .honor-card)
      */

      try {

        const saved = JSON.parse(
          localStorage.getItem(storageKey) || 'null'
        );

        if (saved &&
          typeof saved.leftPct === 'number' &&
          typeof saved.topPct === 'number') {

          el.style.position = 'absolute';
          el.style.left = saved.leftPct + '%';
          el.style.top = saved.topPct + '%';
          el.style.margin = '0';

        }

      } catch (e) {}


      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;


      function startDrag(clientX, clientY) {

        isDragging = true;

        el.classList.add('dragging');


        if (el.style.position !== 'absolute') {

          const pageRect = page.getBoundingClientRect();
          const rect = el.getBoundingClientRect();

          el.style.position = 'absolute';
          el.style.left = (rect.left - pageRect.left) + 'px';
          el.style.top = (rect.top - pageRect.top) + 'px';
          el.style.margin = '0';

        }


        const rect2 = el.getBoundingClientRect();

        offsetX = clientX - rect2.left;
        offsetY = clientY - rect2.top;

      }


      function moveDrag(clientX, clientY) {

        if (!isDragging) return;

        const pageRect = page.getBoundingClientRect();

        const leftPx = clientX - offsetX - pageRect.left;
        const topPx = clientY - offsetY - pageRect.top;

        el.style.left = leftPx + 'px';
        el.style.top = topPx + 'px';

      }


      function endDrag() {

        if (!isDragging) return;

        isDragging = false;

        el.classList.remove('dragging');


        /*
          បំប្លែងទីតាំងចុងក្រោយពី px ទៅជា %
          ធៀបនឹង .honor-card រួចរក្សាទុកជា %
        */

        const pageRect = page.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();

        const leftPct = pageRect.width > 0 ?
          ((elRect.left - pageRect.left) / pageRect.width) * 100 : 0;

        const topPct = pageRect.height > 0 ?
          ((elRect.top - pageRect.top) / pageRect.height) * 100 : 0;

        el.style.left = leftPct + '%';
        el.style.top = topPct + '%';


        localStorage.setItem(
          storageKey,
          JSON.stringify({ leftPct: leftPct, topPct: topPct })
        );

      }


      el.addEventListener('mousedown', function (e) {
        startDrag(e.clientX, e.clientY);
        e.preventDefault();
      });

      document.addEventListener('mousemove', function (e) {
        moveDrag(e.clientX, e.clientY);
      });

      document.addEventListener('mouseup', endDrag);


      el.addEventListener('touchstart', function (e) {
        const t = e.touches[0];
        startDrag(t.clientX, t.clientY);
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!isDragging) return;
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
      }, { passive: true });

      document.addEventListener('touchend', endDrag);

    }



    /* =========================================================

      loadHonorRoll();

    }



    /* =========================================================
       PERIOD LABEL
    ========================================================== */

    function getPeriodLabel(period) {

      const labels = {

        "ឆមាសទី១":
          "ការប្រឡងឆមាសទី១",

        "ឆមាសទី២":
          "ការប្រឡងឆមាសទី២",

        "ប្រចាំឆមាសទី១":
          "ប្រចាំឆមាសទី១ (សរុប)",

        "ប្រចាំឆមាសទី២":
          "ប្រចាំឆមាសទី២ (សរុប)",

        "ប្រចាំឆ្នាំ":
          "ប្រចាំឆ្នាំសិក្សា"

      };


      return labels[period] ||
        ("ប្រចាំខែ" + period);

    }



    /* =========================================================
       LOAD HONOR ROLL
    ========================================================== */

    function loadHonorRoll() {

      const className =
        document.getElementById(
          'classSelect'
        ).value;


      const type =
        document.getElementById(
          'typeSelect'
        ).value;


      const monthSelect =
        document.getElementById(
          'monthSelect'
        );


      if (!monthSelect) return;


      const period =
        monthSelect.value;


      /*
        Header Class
      */

      document.getElementById(
        'lblClass'
      ).innerText =
        "ថ្នាក់ទី " + className;


      /*
        Header Period
      */

      document.getElementById(
        'lblMonth'
      ).innerText =
        getPeriodLabel(period);


      /*
        ✅ ចាប់ខែដាក់ក្នុងប្រអប់ "ខែ" នៅផ្នែកចុះកាលបរិច្ឆេទ
        តាមខែដែលបានជ្រើសរើសនៅផ្នែក "ប្រចាំខែ" ។
        ចំពោះប្រភេទផ្សេងទៀត (ឆមាស/ឆ្នាំ) ទុកឱ្យវាយបញ្ចូលដោយដៃ។
      */

      const inputMonthEl =
        document.getElementById(
          'inputMonth'
        );

      if (inputMonthEl) {

        if (type === 'ប្រចាំខែ') {

          inputMonthEl.value = period;

        }

      }


      /*
        Load Data
      */

      google.script.run
        .withSuccessHandler(renderHonorRoll)
        .getTopStudentsForHonorRoll(
          className,
          period
        );

    }



    /* =========================================================
       RENDER HONOR ROLL
    ========================================================== */

    function renderHonorRoll(res) {


      /*
        Reset Rank 1-5
      */

      for (let i = 1; i <= 5; i++) {

        document.getElementById(
          `name${i}`
        ).innerText = "-";


        document.getElementById(
          `img${i}`
        ).src = PLACEHOLDER_IMG;


        document.getElementById(
          `rank${i}`
        ).style.display = "none";

      }


      /*
        No Data
      */

      if (!res || !res.topStudents) {
        return;
      }


      /*
        Render Students
      */

      res.topStudents.forEach(
        (s, idx) => {

          const num =
            idx + 1;


          /*
            Limit 5
          */

          if (num > 5) return;


          document.getElementById(
            `rank${num}`
          ).style.display = "block";


          document.getElementById(
            `name${num}`
          ).innerText =
            s.name;


          if (s.imageUrl) {

            document.getElementById(
              `img${num}`
            ).src =
              s.imageUrl;

          }

        }
      );

    }



    /* =========================================================
       PREVENT HORIZONTAL SCROLL
    ========================================================== */

    document.addEventListener(
      'touchmove',
      function () {

        /*
          មិនបិទ touchmove ទេ
          ដើម្បីរក្សា vertical scrolling
        */

      },
      {
        passive: true
      }
    );

  </script>
