<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សៀវភៅសិក្ខាគារិក</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      /* Theme Tokens - Light Mode */
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.95);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Print Document Colors (ស្តង់ដារសៀវភៅសិក្ខាគារិក) */
      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      /* Theme Tokens - Dark Mode */
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.94);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* =========================================================
       🎛️ NEW PREMIUM TOOLBAR DESIGN
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 12px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .form-control {
      padding: 6px 10px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .form-control:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
      user-select: none;
    }

    /* ── Action Buttons ── */
    .btn {
      padding: 6px 14px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: var(--ctrl-group-bg);
      color: var(--text-main);
      border-color: var(--input-border);
    }
    .btn-secondary:hover {
      border-color: var(--input-focus);
      color: var(--input-focus);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    /* ── Zoom Buttons ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--ctrl-group-bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--tb-border);
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* =========================================================
       📄 A4 BOOKLET PREVIEW (សៀវភៅសិក្ខាគារិក - រក្សាពណ៌សជានិច្ច)
    ========================================================= */
    .preview-wrapper {
      padding: 20px 10px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 25px;
      transition: zoom 0.2s ease;
    }

    .sheet-page {
      background: #ffffff !important; 
      color: var(--navy) !important;
      width: 297mm; 
      height: 210mm; 
      max-height: 210mm;
      padding: 6mm 7.5mm; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35); 
      page-break-after: always; 
      position: relative; 
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy); 
      padding: 14px 18px 12px 18px; 
      display: flex;
      flex-direction: column; 
      justify-content: space-between; 
      height: 100%; 
      position: relative;
      background: #ffffff !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14px; letter-spacing: 6px; color: var(--red-star); margin: 3px 0 5px 0; }

    .dotted-row { display: flex; align-items: flex-end; width: 100%; margin-bottom: 12px; font-size: 15px; }
    .dotted-label { white-space: nowrap; font-weight: bold; font-size: 15px; }
    .dotted-space { flex: 1; border-bottom: 1.5px dotted var(--navy); margin-left: 6px; padding-left: 6px; min-height: 23px; font-weight: bold; font-size: 15px; }

    .cover-info-block {
      margin: 30px 0 20px 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .cover-dotted-row {
      display: flex;
      align-items: flex-end;
      width: 100%;
      font-size: 16px;
    }
    .cover-dotted-label {
      white-space: nowrap;
      font-weight: bold;
      font-size: 16px;
    }
    .cover-dotted-space {
      flex: 1;
      border-bottom: 1.6px dotted var(--navy);
      margin-left: 6px;
      padding-left: 6px;
      min-height: 26px;
      font-weight: bold;
      font-size: 16px;
    }

    /* ── Table Styling ── */
    .custom-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      border: 1.35px solid var(--navy) !important; 
      margin-bottom: 3px; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .custom-table th, .custom-table td {
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 2px; 
      height: 21.5px; 
      vertical-align: middle;
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .custom-table th { background: #f8fafc !important; font-weight: bold; font-size: 13.5px; }
    .custom-table td.text-left { text-align: left; padding-left: 7px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .red-bold { color: #dc2626 !important; font-weight: bold; font-size: 13.5px; }

    .sig-block {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .sig-inner {
      text-align: center;
      min-width: 180px;
    }

    @media screen and (max-width: 768px) {
      .no-print-bar { padding: 10px 14px; }
      .toolbar-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .toolbar-section { width: 100%; justify-content: space-between; }
      .panel-pill-box { width: 100%; }
      .zoom-btn-group { width: 100%; justify-content: center; }
      .zoom-btn { flex: 1; text-align: center; }
    }

    /* =========================================================
       🖨️ PRINT RULES (A4 LANDSCAPE)
    ========================================================= */
    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .sheet-page { box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important; padding: 6mm 7.5mm !important; page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important; border-radius: 0 !important; }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       🎛️ NEW PREMIUM TOOLBAR DESIGN
  ========================================================= -->
  <div class="no-print-bar">
    <div class="toolbar-row">
      <div class="toolbar-section">
        <button class="btn btn-secondary" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i> ត្រឡប់
        </button>

        <!-- 🌟 បង្ហាញ Dropdown តែពេល Admin -->
        <div class="panel-pill-box" id="adminClassBox" style="display:none;">
          <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
          <select id="classSelect" class="form-control" onchange="onClassSelectChange()">
            <option value="">កំពុងទាញយក...</option>
          </select>
        </div>

        <!-- 🌟 ផ្លាកថ្នាក់របស់គ្រូ (ពេលជាគ្រូ Dropdown នឹងលាក់) -->
        <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span id="teacherClassText">ថ្នាក់ទី...</span>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-user" style="color:#10b981;"></i> សិស្ស៖</span>
          <select id="studentSelect" class="form-control" style="min-width:140px;" onchange="renderSemesterView()">
            <option value="ALL">🏫 ទាំងថ្នាក់</option>
          </select>
        </div>

        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-file-lines" style="color:#f59e0b;"></i> សន្លឹក៖</span>
          <select id="sheetFilterSelect" class="form-control" onchange="renderSemesterView()">
            <option value="ALL">ទាំងអស់ (៣ សន្លឹក/សិស្ស)</option>
            <option value="1">សន្លឹកទី១ (ក្របក្រៅ)</option>
            <option value="2">សន្លឹកទី២ (ក្របក្នុង & សេចក្តីណែនាំ)</option>
            <option value="3" selected>សន្លឹកទី៣ (លទ្ធផលប្រឡងឆមាស & ប្រចាំឆ្នាំ)</option>
          </select>
        </div>
      </div>

      <div class="toolbar-section">
        <!-- 🔍 Zoom Buttons -->
        <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំ">
          <button type="button" class="zoom-btn active" data-zoom="1" onclick="setZoom(1, this)">100%</button>
          <button type="button" class="zoom-btn" data-zoom="0.75" onclick="setZoom(0.75, this)">75%</button>
          <button type="button" class="zoom-btn" data-zoom="0.5" onclick="setZoom(0.5, this)">50%</button>
        </div>

        <button class="btn btn-primary" onclick="initClasses()" title="ផ្ទុកទិន្នន័យឡើងវិញ">
          <i class="fa-solid fa-rotate"></i> ផ្ទុកឡើងវិញ
        </button>

        <button class="btn btn-success" onclick="doPrint()" title="បោះពុម្ពសៀវភៅសិក្ខាគារិក">
          <i class="fa-solid fa-print"></i> បោះពុម្ព (Print)
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       📄 A4 BOOKLET PREVIEW CONTAINER
  ========================================================= -->
  <div class="preview-wrapper" id="semesterContainer">
    <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
      <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យសៀវភៅសិក្ខាគារិក...</p>
    </div>
  </div>

  <script>
    // =========================================================
    // ⚙️ THEME MANAGEMENT (SYNC 100% WITH HOMEPAGE)
    // =========================================================
    var _urlParams = new URLSearchParams(window.location.search);
    function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }
    function _set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

    function applyTheme(theme) {
      theme = theme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }

    var initialTheme = _urlParams.get('theme') || _get('krou_theme_manual') || 'dark';
    applyTheme(initialTheme);

    window.addEventListener('message', function(event) {
      if (event.data && (event.data.type === 'THEME_CHANGE' || event.data.theme)) {
        applyTheme(event.data.theme || event.data);
      }
    });

    // =========================================================
    // ⚙️ BACKEND API & CONFIGURATION
    // =========================================================
    var SCRIPT_URL = (window.parent && window.parent.BACKEND_URL)
      || _urlParams.get('apiUrl')
      || 'https://script.google.com/macros/s/AKfycbz9GLD2TJS4UPKVGxrc3H73tGCtjlMI7-56E7TlKcLHyBwqCiZ1jPF_okv2m1ubTjpy/exec';

    var TOKEN        = (window.parent && window.parent.SESSION_TOKEN) || _urlParams.get('token') || _get('krou_session_token') || _get('user_token') || _get('school_token') || '';
    var USER_ROLE    = (window.parent && window.parent.USER_ROLE)     || _urlParams.get('role')  || _get('krou_user_role')    || 'teacher';
    var USER_CLASS   = _urlParams.get('cls') || _urlParams.get('class') || _get('krou_assigned_class') || _get('krou_user_class') || '';
    var TEACHER_NAME = (window.parent && window.parent.TEACHER_NAME) || _get('krou_teacher_name') || '';

    async function apiCall(action, params) {
      params = params || {};
      if (TOKEN) params.token = params.token || TOKEN;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[action](params);
        });
      }

      if (typeof callBackendApi === 'function') {
        try {
          var res = await callBackendApi(action, params);
          if (action === 'getClassList' || action === 'getClassListForSession') {
            if (res && res.classes !== undefined) return res.classes;
          }
          return res;
        } catch(e) {}
      }

      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params))
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var json = await res.json();
      if (json && json.success === false) throw new Error(json.error || json.message || 'Server error');

      if (action === 'getClassList' || action === 'getClassListForSession') {
        if (json && json.classes !== undefined) return json.classes;
      }

      return json;
    }

    var SEMESTER_SUBJECTS = [
      { key: 'read',      label: 'អំណាន' },
      { key: 'listen',    label: 'ស្តាប់ និងនិយាយ' },
      { key: 'dictation', label: 'សរសេរតាមអាន' },
      { key: 'essay',     label: 'តែងសេចក្តី' },
      { key: 'math',      label: 'គណិតវិទ្យា' },
      { key: 'science',   label: 'វិទ្យាសាស្ត្រ' },
      { key: 'social',    label: 'សិក្សាសង្គម' },
      { key: 'homeArts',  label: 'គេហវិទ្យា-អប់រំសិល្បៈ' },
      { key: 'pe',        label: 'អប់រំកាយ-សុខភាព' },
      { key: 'ethics',    label: 'អប់រំបំណិនជីវិត' },
      { key: 'foreign',   label: 'ភាសាបរទេស' }
    ];

    var bundleData = null;

    function setZoom(scale, btnEl) {
      var container = document.getElementById('semesterContainer');
      if (container) container.style.zoom = scale;

      document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) {
        btnEl.classList.add('active');
      } else {
        var matched = document.querySelector('.zoom-btn[data-zoom="' + scale + '"]');
        if (matched) matched.classList.add('active');
      }
      _set('record_zoom_level', scale);
    }

    function doPrint() {
      window.focus();
      setTimeout(function() {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    // =========================================================
    // 🧠 AUTO-RANKING HELPER (គណនាចំណាត់ថ្នាក់ស្វ័យប្រវត្តិ)
    // =========================================================
    function computeCompetitionRanks(items) {
      // items = [{ id: '...', val: 45 }]
      var valid = items.filter(x => x.val !== '' && x.val !== null && !isNaN(Number(x.val)));
      valid.sort((a, b) => Number(b.val) - Number(a.val));
      var ranks = {};
      var curRank = 1;
      for (var i = 0; i < valid.length; i++) {
        if (i > 0 && Number(valid[i].val) < Number(valid[i - 1].val)) {
          curRank = i + 1;
        }
        ranks[String(valid[i].id).trim()] = curRank;
      }
      return ranks;
    }

    function getGradeFromAverage(avg) {
      var n = Number(avg);
      if (!Number.isFinite(n) || n <= 0) return '-';
      if (n >= 9.00) return 'A';
      if (n >= 8.00) return 'B';
      if (n >= 7.00) return 'C';
      if (n >= 6.00) return 'D';
      if (n >= 5.00) return 'E';
      return 'F';
    }

    window.onload = function() {
      var savedZoom = parseFloat(_get('record_zoom_level') || '1');
      setZoom(savedZoom);
      initClasses();
    };

    async function initClasses() {
      if (!USER_CLASS && TOKEN) {
        try {
          var session = await apiCall('getCurrentSession');
          if (session && session.loggedIn) {
            USER_ROLE = session.role || USER_ROLE;
            USER_CLASS = session.assignedClass || USER_CLASS;
            TEACHER_NAME = session.name || TEACHER_NAME;
          }
        } catch(e) {}
      }

      var isAdmin = (String(USER_ROLE).toLowerCase().trim() === 'admin');

        }
      } else {
        document.getElementById('teacherClassBadge').style.display = 'none';
        document.getElementById('adminClassBox').style.display = 'flex';

        var sel = document.getElementById('classSelect');
        sel.innerHTML = '<option value="">កំពុងទាញយក...</option>';

        try {
          var res = await apiCall('getClassList');
          if (!res || !res.length) res = await apiCall('getClassListForSession');
          var classes = Array.isArray(res) ? res : (res && res.classes ? res.classes : []);
          sel.innerHTML = '';

          if (!classes || classes.length === 0) {
            sel.innerHTML = '<option value="">គ្មានថ្នាក់</option>';
            loadSemesterData('');
            return;
          }

          classes.forEach(function(c) {
            var opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c;
            sel.appendChild(opt);
          });

          loadSemesterData(sel.value);
        } catch (err) {
          console.error(err);
          sel.innerHTML = '<option value="">បរាជ័យក្នុងការទាញយក</option>';
          loadSemesterData('');
        }
      }
    }

    function onClassSelectChange() {
      var cls = document.getElementById('classSelect').value || USER_CLASS;

    async function loadSemesterData(cls) {
      var container = document.getElementById('semesterContainer');
      container.innerHTML = `<div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
        <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${cls || ''}...</p>
      </div>`;

      try {
        var res = await apiCall('getSemesterRecordBundleSecured', { className: cls, cls: cls });
        if (!res || res.success === false) {
          container.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 40px; font-size: 14px; font-weight: 700;">❌ កំហុស៖ ' + (res ? (res.error || res.message) : 'មិនមានទិន្នន័យថ្នាក់នេះឡើយ') + '</div>';
          return;
        }

        bundleData = (res && res.students) ? res : ((res && res.data && res.data.students) ? res.data : res);

        if (bundleData.classes && bundleData.classes.length > 0 && String(USER_ROLE).toLowerCase().trim() === 'admin') {
          var sel = document.getElementById('classSelect');
          if (sel.options.length <= 1) {
            sel.innerHTML = '';
            bundleData.classes.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c;
              opt.textContent = c.toString().startsWith('ថ្នាក់') ? c : 'ថ្នាក់ទី ' + c;
              sel.appendChild(opt);
            });
            sel.value = bundleData.className || cls;
          }
        }

        var sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់</option>';
        (bundleData.students || []).forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.id + ' - ' + s.name;
          sSelect.appendChild(opt);
        });

        renderSemesterView();
      } catch (err) {
        container.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 40px; font-size: 14px; font-weight: 700;">❌ កំហុស Server: ' + (err.message || err) + '</div>';
      }
    }

    function renderSemesterView() {
      if (!bundleData) return;
      var selectedSid = document.getElementById('studentSelect').value;
      var sheetFilter = document.getElementById('sheetFilterSelect').value;
      var cls = bundleData.className || document.getElementById('classSelect').value || USER_CLASS;
      var container = document.getElementById('semesterContainer');
      container.innerHTML = '';

      var studentsList = (bundleData && Array.isArray(bundleData.students)) ? bundleData.students : [];
      var targetStudents = (selectedSid === 'ALL') ? studentsList : studentsList.filter(s => s.id === selectedSid);
      
      if (!targetStudents || targetStudents.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align: center; padding: 40px; font-size: 14px; font-weight: 600;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
        return;
      }

      var totalClassCount = studentsList.length;

      // =========================================================
      // 🌟 AUTO-CALCULATE ALL SUBJECT RANKS & TOTAL RANKS
      // =========================================================
      var s1SubRanks = {}, s2SubRanks = {};
      var s1TotList = [], s2TotList = [];
      var s1AvgList = [], s2AvgList = [], yAvgList = [];

      SEMESTER_SUBJECTS.forEach(function(sub) {
        var s1Items = [], s2Items = [];
        studentsList.forEach(function(st) {
          var sc1 = (bundleData.sem1Scores && bundleData.sem1Scores[st.id]) ? bundleData.sem1Scores[st.id][sub.key] : '';
          var sc2 = (bundleData.sem2Scores && bundleData.sem2Scores[st.id]) ? bundleData.sem2Scores[st.id][sub.key] : '';
          if (sc1 !== '' && sc1 !== undefined && !isNaN(Number(sc1))) s1Items.push({ id: st.id, val: Number(sc1) });
          if (sc2 !== '' && sc2 !== undefined && !isNaN(Number(sc2))) s2Items.push({ id: st.id, val: Number(sc2) });
        });
        s1SubRanks[sub.key] = computeCompetitionRanks(s1Items);
        s2SubRanks[sub.key] = computeCompetitionRanks(s2Items);
      });

      // គណនាពិន្ទុសរុប & មធ្យមភាគប្រចាំឆមាស
      studentsList.forEach(function(st) {
        var s1 = (bundleData.sem1Scores && bundleData.sem1Scores[st.id]) ? bundleData.sem1Scores[st.id] : {};
        var s2 = (bundleData.sem2Scores && bundleData.sem2Scores[st.id]) ? bundleData.sem2Scores[st.id] : {};

        var tot1 = 0, cnt1 = 0;
        var tot2 = 0, cnt2 = 0;

        SEMESTER_SUBJECTS.forEach(function(sub) {
          var v1 = s1[sub.key]; if (v1 !== '' && v1 !== undefined && !isNaN(Number(v1))) { tot1 += Number(v1); cnt1++; }
          var v2 = s2[sub.key]; if (v2 !== '' && v2 !== undefined && !isNaN(Number(v2))) { tot2 += Number(v2); cnt2++; }
        });

        if (tot1 > 0) {
          s1TotList.push({ id: st.id, val: tot1 });
          s1AvgList.push({ id: st.id, val: Number((tot1 / (cnt1 || 1)).toFixed(2)) });
        }
        if (tot2 > 0) {
          s2TotList.push({ id: st.id, val: tot2 });
          s2AvgList.push({ id: st.id, val: Number((tot2 / (cnt2 || 1)).toFixed(2)) });
        }

        var a1 = cnt1 > 0 ? (tot1 / cnt1) : 0;
        var a2 = cnt2 > 0 ? (tot2 / cnt2) : 0;
        var yAvg = (a1 > 0 && a2 > 0) ? ((a1 + a2) / 2) : (a1 || a2 || 0);
        if (yAvg > 0) {
          yAvgList.push({ id: st.id, val: Number(yAvg.toFixed(2)) });

        var s2MonthlyVal = (bundleData.s2MonthlyAvgMap && bundleData.s2MonthlyAvgMap[student.id]) ? bundleData.s2MonthlyAvgMap[student.id] : (s2AvgVal > 0 ? s2AvgVal.toFixed(2) : '');
