<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សៀវភៅសិក្ខាគារិក</title>
  
  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: #2b3544;
      color: var(--navy);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* Top Toolbar */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .tool-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px;
      border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #f3f4f6;
      font-family: 'Kantumruy Pro', sans-serif; font-size: 11.5px; cursor: pointer; text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover { background: #374151; }
    .btn-primary { background: #2563eb; border-color: #1d4ed8; color: #fff; font-weight: bold; }

    select {
      font-family: 'Kantumruy Pro', sans-serif; font-size: 11.5px; padding: 4px 8px;
      border-radius: 6px; background: #1f2937; color: #fff; border: 1px solid #4b5563; outline: none;
    }

    .preview-wrapper {
      padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .sheet-page {
      background: #ffffff; width: 297mm; height: 210mm; max-height: 210mm;
      padding: 6mm 7.5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.5); page-break-after: always; position: relative; overflow: hidden;
    }
    .page-box {
      border: 3.5px double var(--navy); padding: 14px 18px 12px 18px; display: flex;
      flex-direction: column; justify-content: space-between; height: 100%; position: relative;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14px; letter-spacing: 6px; color: var(--red-star); margin: 3px 0 5px 0; }

    .dotted-row { display: flex; align-items: flex-end; width: 100%; margin-bottom: 12px; font-size: 15px; }
    .dotted-label { white-space: nowrap; font-weight: bold; font-size: 15px; }
    .dotted-space { flex: 1; border-bottom: 1.5px dotted var(--navy); margin-left: 6px; padding-left: 6px; min-height: 23px; font-weight: bold; font-size: 15px; }

    .cover-info-block {
      margin: 30px 0 20px 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .cover-dotted-row {
      display: flex;
      align-items: flex-end;
      width: 100%;
      font-size: 16px;
    }
    .cover-dotted-label {
      white-space: nowrap;
      font-weight: bold;
      font-size: 16px;
    }
    .cover-dotted-space {
      flex: 1;
      border-bottom: 1.6px dotted var(--navy);
      margin-left: 6px;
      padding-left: 6px;
      min-height: 26px;
      font-weight: bold;
      font-size: 16px;
    }

    .custom-table {
      width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; border: 1.35px solid var(--navy); margin-bottom: 3px; table-layout: fixed;
    }
    .custom-table th, .custom-table td {
      border: 1.15px solid var(--navy); padding: 1.8px 2px; height: 21.5px; vertical-align: middle;
    }
    .custom-table th { background: #f8fafc; font-weight: bold; font-size: 13.5px; }
    .custom-table td.text-left { text-align: left; padding-left: 7px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .red-bold { color: #dc2626; font-weight: bold; font-size: 13.5px; }

    .sig-block {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .sig-inner {
      text-align: center;
      min-width: 180px;
    }

    @media print {
      html, body { background: none; padding: 0; margin: 0; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0; gap: 0; }
      .sheet-page { box-shadow: none; margin: 0; width: 297mm; height: 210mm; padding: 6mm 7.5mm; page-break-after: always; break-after: page; page-break-inside: avoid; }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- Top Action Toolbar -->
  <div class="no-print-bar">
    <div class="tool-group">
      <button class="btn" onclick="window.history.back()">⬅ ត្រឡប់</button>
      
      <label>ថ្នាក់:</label>
      <select id="classSelect" onchange="onClassSelectChange()">
        <option value="">កំពុងទាញយក...</option>
      </select>

      <label>សិស្ស:</label>
      <select id="studentSelect" onchange="renderSemesterView()">
        <option value="ALL">🏫 ទាំងថ្នាក់</option>
      </select>

      <label>សន្លឹក:</label>
      <select id="sheetFilterSelect" onchange="renderSemesterView()">
        <option value="ALL">ទាំងអស់ (៣ សន្លឹក/សិស្ស)</option>
        <option value="1">សន្លឹកទី១ (ក្របក្រៅ)</option>
        <option value="2">សន្លឹកទី២ (ក្របក្នុង & សេចក្តីណែនាំ)</option>
        <option value="3" selected>សន្លឹកទី៣ (លទ្ធផលប្រឡងឆមាស & ប្រចាំឆ្នាំ)</option>
      </select>
    </div>

    <div class="tool-group">
      <button class="btn btn-primary" onclick="window.print()">🖨️ បោះពុម្ព (Print)</button>
    </div>
  </div>

  <div class="preview-wrapper" id="semesterContainer">
    <div style="color: #fff; text-align: center; padding: 40px; font-size: 14px;">⚡ កំពុងទាញយកទិន្នន័យ...</div>
  </div>

  <script>
    var TOKEN = "<?= token ?>";
    var USER_ROLE = "<?= userRole ?>";
    var USER_CLASS = "<?= userClass ?>";
    var TEACHER_NAME = "<?= typeof teacherName !== 'undefined' ? teacherName : '' ?>";
    var TEACHER_SEX = "<?= typeof teacherSex !== 'undefined' ? teacherSex : '' ?>";

    function getTeacherFormalTitle(sex, rawName) {
      var s = (sex || '').toString().trim().toLowerCase();
      var n = (rawName || '').toString().trim();
      if (n.indexOf('លោកគ្រូ') === 0 || n.indexOf('អ្នកគ្រូ') === 0) return n;
      var isFemale = (s === 'ស្រី' || s === 'f' || s === 'female');
      return n ? ((isFemale ? 'អ្នកគ្រូ ' : 'លោកគ្រូ ') + n) : (isFemale ? 'អ្នកគ្រូ' : 'លោកគ្រូ');
    }

    var SEMESTER_SUBJECTS = [
      { key: 'read',      label: 'អំណាន' },
      { key: 'listen',    label: 'ស្តាប់ និងនិយាយ' },
      { key: 'dictation', label: 'សរសេរតាមអាន' },
      { key: 'essay',     label: 'តែងសេចក្តី' },
      { key: 'math',      label: 'គណិតវិទ្យា' },
      { key: 'science',   label: 'វិទ្យាសាស្ត្រ' },
      { key: 'social',    label: 'សិក្សាសង្គម' },
      { key: 'homeArts',  label: 'គេហវិទ្យា-អប់រំសិល្បៈ' },
      { key: 'pe',        label: 'អប់រំកាយ-សុខភាព' },
      { key: 'ethics',    label: 'អប់រំបំណិនជីវិត' },
      { key: 'foreign',   label: 'ភាសាបរទេស' }
    ];

    var bundleData = null;

    window.onload = function() {
      initClasses();
    };

    function initClasses() {
      google.script.run.withSuccessHandler(function(classes) {
        var sel = document.getElementById('classSelect');
        sel.innerHTML = '';
        if (!classes || classes.length === 0) {
          sel.innerHTML = '<option value="">គ្មានថ្នាក់</option>';
          loadSemesterData('');
          return;
        }
        classes.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'ថ្នាក់ទី ' + c;
          sel.appendChild(opt);
        });
        if (USER_CLASS) sel.value = USER_CLASS;
        loadSemesterData(sel.value);
      }).withFailureHandler(function(err) {
        loadSemesterData('');
      }).getClassListForSession(TOKEN);
    }

    function onClassSelectChange() {
      var cls = document.getElementById('classSelect').value;
      loadSemesterData(cls);
    }

    function loadSemesterData(cls) {
      document.getElementById('semesterContainer').innerHTML = '<div style="color: #fff; text-align: center; padding: 40px; font-size: 14px;">⚡ កំពុងទាញយកទិន្នន័យថ្នាក់ ' + (cls || '') + '...</div>';

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            document.getElementById('semesterContainer').innerHTML = '<div style="color: #f87171; text-align: center; padding: 40px; font-size: 14px;">កំហុស៖ ' + (res.error || 'មិនមានទិន្នន័យថ្នាក់នេះឡើយ') + '</div>';
            return;
          }

          bundleData = res;

          if (bundleData.classes && bundleData.classes.length > 0) {
            var sel = document.getElementById('classSelect');
            if (sel.options.length <= 1) {
              sel.innerHTML = '';
              bundleData.classes.forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c;
                opt.textContent = 'ថ្នាក់ទី ' + c;
                sel.appendChild(opt);
              });
              sel.value = bundleData.className;
            }
          }

          var sSelect = document.getElementById('studentSelect');
          sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់</option>';
          (bundleData.students || []).forEach(function(s) {
            var opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.id + ' - ' + s.name;
            sSelect.appendChild(opt);
          });

          renderSemesterView();
        })
        .withFailureHandler(function(err) {
          document.getElementById('semesterContainer').innerHTML = '<div style="color: #f87171; text-align: center; padding: 40px; font-size: 14px;">កំហុស Server: ' + err.toString() + '</div>';
        })
        .getSemesterRecordBundleSecured(TOKEN, cls);
    }

    function renderSemesterView() {
      if (!bundleData) return;
      var selectedSid = document.getElementById('studentSelect').value;
      var sheetFilter = document.getElementById('sheetFilterSelect').value;
      var cls = bundleData.className || document.getElementById('classSelect').value;
      var container = document.getElementById('semesterContainer');
      container.innerHTML = '';

      var targetStudents = (selectedSid === 'ALL') ? bundleData.students : bundleData.students.filter(s => s.id === selectedSid);
      
      if (!targetStudents || targetStudents.length === 0) {
        container.innerHTML = '<div style="color: #fff; text-align: center; padding: 40px; font-size: 14px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
        return;
      }

      var totalClassCount = bundleData.students.length;

      targetStudents.forEach(function(student) {
        var s1Score = bundleData.sem1Scores[student.id] || {};
        var s2Score = bundleData.sem2Scores[student.id] || {};
        var s1SubRanks = bundleData.sem1SubRanks || {};
        var s2SubRanks = bundleData.sem2SubRanks || {};
        var s1TotRanks = bundleData.sem1TotalRanks || {};
        var s2TotRanks = bundleData.sem2TotalRanks || {};

        var s1Rank = bundleData.sem1RankMap[student.id] || { avg: 0, rank: '-' };
        var s2Rank = bundleData.sem2RankMap[student.id] || { avg: 0, rank: '-' };
        var yRank  = bundleData.yearRankMap[student.id]  || { avg: 0, rank: '-', grade: '-' };
        var att    = bundleData.attMap[student.id]       || { sem1_p:0, sem1_a:0, sem2_p:0, sem2_a:0 };

        // 🌟 ទាញយកមធ្យមភាគប្រចាំខែពី Backend Bundle
        var s1MonthlyVal = (bundleData.s1MonthlyAvgMap && bundleData.s1MonthlyAvgMap[student.id]) ? bundleData.s1MonthlyAvgMap[student.id] : '';
        var s2MonthlyVal = (bundleData.s2MonthlyAvgMap && bundleData.s2MonthlyAvgMap[student.id]) ? bundleData.s2MonthlyAvgMap[student.id] : '';

        // ================= SHEET 1: ក្របក្រៅ =================
        if (sheetFilter === 'ALL' || sheetFilter === '1') {
          var sheet1 = document.createElement('div');
          sheet1.className = 'sheet-page';
          sheet1.innerHTML = `
            <div></div>
            <div class="page-box">
              <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                <div>
                  <div class="header-text" style="margin-top: 5px;">
                    <h2 class="f-moul">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                    <h3 class="f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                    <div class="header-icons">✻ ✻ ✻ 📖 ✻ ✻ ✻</div>
                    <h2 class="f-moul" style="font-size: 17px; margin-top: 15px;">ក្រសួងអប់រំ យុវជន និងកីឡា</h2>
                  </div>

                  <div style="text-align: center; margin: 30px 0 20px 0;">
                    <h1 class="f-moul" style="font-size: 32px; color: var(--navy); line-height: 1.35;">សៀវភៅសិក្ខាគារិក</h1>
                    <h3 class="f-moul" style="font-size: 17px; margin-top: 10px;">សាលាបឋមសិក្សាចំណេះទូទៅ</h3>
                  </div>

                  <div class="cover-info-block">
                    <div class="cover-dotted-row">
                      <span class="cover-dotted-label">សាលាបឋមសិក្សា ៖</span>
                      <span class="cover-dotted-space">${bundleData.schoolName || ''}</span>
                    </div>
                    <div class="cover-dotted-row">
                      <span class="cover-dotted-label">ឃុំ/សង្កាត់</span>
                      <span class="cover-dotted-space"></span>
                      <span class="cover-dotted-label" style="margin-left: 12px;">ស្រុក/ខណ្ឌ</span>
                      <span class="cover-dotted-space">សំឡូត</span>
                      <span class="cover-dotted-label" style="margin-left: 12px;">ខេត្ត/ក្រុង</span>
                      <span class="cover-dotted-space">បាត់ដំបង</span>
                    </div>
                    <div class="cover-dotted-row">
                      <span class="cover-dotted-label">នាមត្រកូល និងនាមខ្លួន ៖</span>
                      <span class="cover-dotted-space">${student.name}</span>
                    </div>
                    <div class="cover-dotted-row">
                      <span class="cover-dotted-label">ថ្ងៃ ខែ ឆ្នាំកំណើត ៖</span>
                      <span class="cover-dotted-space">${student.dob || ''}</span>
                    </div>
                    <div class="cover-dotted-row">
                      <span class="cover-dotted-label">ទីកន្លែងកំណើត ៖</span>
                      <span class="cover-dotted-space">${student.pob || ''}</span>
                    </div>
                  </div>
                </div>

                <div style="text-align: center; font-size: 17px; letter-spacing: 10px; color: var(--red-star); margin-bottom: 12px;">
                  ✻ ✻ ✻ ✻ ✻
                </div>
              </div>
            </div>
          `;
          container.appendChild(sheet1);
        }

        // ================= SHEET 2: ក្របក្នុង & សេចក្តីណែនាំ =================
        if (sheetFilter === 'ALL' || sheetFilter === '2') {
          var sheet2 = document.createElement('div');
          sheet2.className = 'sheet-page';
          sheet2.innerHTML = `
            <div class="page-box" style="font-size: 12.8px; line-height: 1.55;">
              <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                <div>
                  <div style="text-align: center; margin-bottom: 12px;">
                    <h2 class="f-moul" style="font-size: 16.5px;">សេចក្តីណែនាំ</h2>
                  </div>
                  <p style="margin-bottom: 7px;">នាយកសាលាត្រូវចេញ និងគ្រប់គ្រងសៀវភៅសិក្ខាគារិក ហើយត្រូវអនុវត្តតាមចំណុចខាងក្រោម ៖</p>
                  <p style="margin-bottom: 6px;">១. ចាប់ពីថ្នាក់ទី៣ ឡើងទៅ សិស្សត្រូវមានសៀវភៅសិក្ខាគារិកដែលចេញឱ្យដោយនាយកសាលា ។</p>
                  <p style="margin-bottom: 6px;">២. ត្រូវចុះនាមត្រកូល និងនាមខ្លួន ភេទ ថ្ងៃ ខែ ឆ្នាំកំណើត ទីកន្លែងកំណើត ឈ្មោះ និងមុខរបរឪពុក/ម្តាយ ឱ្យបានច្បាស់លាស់ ។</p>
                  <p style="margin-bottom: 6px;">៣. នៅបញ្ចប់ឆមាសនីមួយៗ និងបញ្ចប់ឆ្នាំសិក្សា គ្រូទទួលបន្ទុកថ្នាក់ត្រូវចុះ ចំណាត់ថ្នាក់ និងមធ្យមភាគឱ្យបានត្រឹមត្រូវ ។ ចំណែកនាយកសាលាក៏ត្រូវចុះមូលវិចារ ការសរសើរ ឬកំណែទម្រង់ នៅចុងឆ្នាំសិក្សានីមួយៗដែរ ។</p>
