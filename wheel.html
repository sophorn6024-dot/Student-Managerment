<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kantumruy Pro', 'Poppins', sans-serif;
    }
    body {
      background: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #0f172a;
      user-select: none;
    }
    .main-wrapper {
      display: flex;
      gap: 20px;
      height: 640px;
    }

    /* MODE SELECTOR TABS */
    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* LEFT GAME DISPLAY CONTAINER */
    .game-container {
      flex: 1.3;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
    }
    .wheel-pointer {
      position: absolute;
      top: 65px;
      z-index: 10;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ef4444;
      filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3));
    }
    canvas {
      max-width: 100%;
      border-radius: 12px;
    }
    .action-btn {
      margin-top: 15px;
      padding: 12px 36px;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
    }
    .action-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* RIGHT SIDEBAR PANEL */
    .sidebar {
      flex: 0.7;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .sidebar h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .filter-box {
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .student-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #f1f5f9;
      border-radius: 8px;
      padding: 8px;
    }
    .student-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-bottom: 1px solid #f8fafc;
      font-size: 13px;
    }
    .student-item:last-child {
      border-bottom: none;
    }
    .student-item input[type="checkbox"] {
      cursor: pointer;
    }
    .student-count {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: right;
      font-weight: 600;
    }

    /* WINNER MODAL POPUP */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .winner-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .winner-card {
      transform: scale(1);
    }
    .winner-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2563eb;
      margin: 0 auto 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }
    .winner-title {
      font-size: 14px;
      color: #16a34a;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .winner-name {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .winner-class {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .close-btn {
      padding: 10px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- LEFT DISPLAY CONTAINER -->
    <div class="game-container">
      
      <!-- MODE SELECTOR -->
      <div class="mode-tabs">
        <button class="tab-btn active" id="tabWheel" onclick="switchMode('WHEEL')">
          <i class="fa-solid fa-dharmachakra"></i> បង្វិលកង់
        </button>
        <button class="tab-btn" id="tabBoat" onclick="switchMode('BOAT')">
          <i class="fa-solid fa-ship"></i> ប្រណាំងទូកង
        </button>
        <button class="tab-btn" id="tabCar" onclick="switchMode('CAR')">
          <i class="fa-solid fa-car-side"></i> ប្រណាំងឡាន
        </button>
      </div>

      <div class="wheel-pointer" id="wheelPointer"></div>
      <canvas id="gameCanvas" width="480" height="440"></canvas>

      <button id="actionBtn" class="action-btn" onclick="startRandomizer()">
        <i class="fa-solid fa-play"></i> ចាប់ផ្តើម
      </button>
    </div>

    <!-- STUDENT SELECTION SIDEBAR -->
    <div class="sidebar">
      <h3><i class="fa-solid fa-users"></i> បញ្ជីសិស្សចូលរួម</h3>
      
      <div class="filter-box">
        <select id="classFilter" onchange="filterClass()">
          <option value="ALL">-- បង្ហាញសិស្សគ្រប់ថ្នាក់ --</option>
        </select>
      </div>

      <div class="student-list" id="studentListContainer">
        <div style="text-align: center; padding: 20px; color: #94a3b8;">
          <i class="fa-solid fa-spinner fa-spin"></i> កំពុងទាញយកទិន្នន័យ...
        </div>
      </div>

      <div class="student-count" id="studentCount">សរុប: 0 នាក់</div>
    </div>
  </div>

  <!-- WINNER DIALOG -->
  <div class="modal-overlay" id="winnerModal">
    <div class="winner-card">
      <div style="font-size: 36px; margin-bottom: 8px;">🎉</div>
      <div class="winner-title" id="winnerBadge">អ្នកទទួលបានវេន</div>
      <img id="winnerPhoto" class="winner-avatar" src="https://via.placeholder.com/100?text=Student" alt="Photo" onerror="this.src='https://via.placeholder.com/100?text=Student'">
      <div class="winner-name" id="winnerName">ឈ្មោះសិស្ស</div>
      <div class="winner-class" id="winnerClass">ថ្នាក់: -</div>
      <button class="close-btn" onclick="closeModal()">យល់ព្រម</button>
    </div>
  </div>

  <script>
    const PALETTE = [
      '#3b82f6', '#ef4444', '#10b981', '#f59e0b', 
      '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16',
      '#f97316', '#6366f1', '#14b8a6', '#d97706'
    ];

    let currentMode = 'WHEEL'; // 'WHEEL', 'BOAT', or 'CAR'
    let rawStudents = [];
    let activeStudents = [];
    let isRunning = false;
    let audioCtx = null;

    // Wheel Mode Variable
    let currentAngle = 0;

    // Race Positions
    let boatPositions = [];
    let carPositions = [];

    document.addEventListener("DOMContentLoaded", function() {
      fetchStudents();
    });

    function switchMode(mode) {
      if (isRunning) return;
      currentMode = mode;
      
      document.getElementById('tabWheel').classList.toggle('active', mode === 'WHEEL');
      document.getElementById('tabBoat').classList.toggle('active', mode === 'BOAT');
      document.getElementById('tabCar').classList.toggle('active', mode === 'CAR');
      document.getElementById('wheelPointer').style.display = (mode === 'WHEEL') ? 'block' : 'none';

      resetCanvasState();
    }

    function resetCanvasState() {
      if (currentMode === 'WHEEL') {
        drawWheel();
      } else if (currentMode === 'BOAT') {
        initBoatRace();
        drawBoatRace();
      } else if (currentMode === 'CAR') {
        initCarRace();
        drawCarRace();
      }
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTickSound() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function playWinSound() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function fetchStudents() {
      google.script.run
        .withSuccessHandler(function(list) {
          rawStudents = (list || []).map(s => ({
            rowNum: s.rowNum,
            no: s.no || s.studentId || s.id || "-",
            name: s.name || s.studentName || "គ្មានឈ្មោះ",
            className: s.className || s.grade || "គ្មានថ្នាក់"
          }));
          populateClassFilter();
          renderStudentList();
        })
        .withFailureHandler(function(err) {
          document.getElementById('studentListContainer').innerHTML = 
            `<div style="color:#ef4444; text-align:center; padding:15px; font-size:12px;">❌ បរាជ័យក្នុងការទាញយកទិន្នន័យ: ${err.message || err}</div>`;
        })
        .getStudentsByClass();
    }

    function populateClassFilter() {
      const classes = [...new Set(rawStudents.map(s => s.className).filter(Boolean))];
      const select = document.getElementById('classFilter');
      select.innerHTML = '<option value="ALL">-- បង្ហាញសិស្សគ្រប់ថ្នាក់ --</option>';
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `ថ្នាក់: ${c}`;
        select.appendChild(opt);
      });
    }

    function renderStudentList() {
      const selectedClass = document.getElementById('classFilter').value;
      const container = document.getElementById('studentListContainer');
      container.innerHTML = "";

      const filtered = rawStudents.filter(s => selectedClass === "ALL" || s.className === selectedClass);
      activeStudents = [...filtered];

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#94a3b8;">គ្មានទិន្នន័យសិស្ស</div>`;
        document.getElementById('studentCount').textContent = `សរុប: 0 នាក់`;
        resetCanvasState();
        return;
      }

      filtered.forEach((st) => {
        const div = document.createElement('div');
        div.className = 'student-item';
        div.innerHTML = `
          <input type="checkbox" id="st_${st.rowNum}" checked onchange="toggleStudent(${st.rowNum})">
          <label for="st_${st.rowNum}" style="cursor:pointer; flex:1;">${st.no}. ${st.name}</label>
        `;
        container.appendChild(div);
      });

      document.getElementById('studentCount').textContent = `សរុប: ${activeStudents.length} នាក់`;
      resetCanvasState();
    }

    function filterClass() {
      renderStudentList();
    }

    function toggleStudent(rowNum) {
      const cb = document.getElementById(`st_${rowNum}`);
      if (cb.checked) {
        const st = rawStudents.find(s => s.rowNum === rowNum);
        if (st) activeStudents.push(st);
      } else {
        activeStudents = activeStudents.filter(s => s.rowNum !== rowNum);
      }
      document.getElementById('studentCount').textContent = `សរុប: ${activeStudents.length} នាក់`;
      resetCanvasState();
    }

    function startRandomizer() {
      if (isRunning || activeStudents.length === 0) return;
      if (currentMode === 'WHEEL') {
        spinWheel();
      } else if (currentMode === 'BOAT') {
        startBoatRace();
      } else if (currentMode === 'CAR') {
        startCarRace();
      }
    }

    /* ----------------------------------------------------
       1. WHEEL LOGIC (8 SECONDS DRAMATIC SLOWDOWN)
    ---------------------------------------------------- */
    function drawWheel() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) / 2 - 15;

      ctx.clearRect(0, 0, width, height);

      if (activeStudents.length === 0) {
        drawEmptyState(ctx, width, height);
        return;
      }

      const numSlices = activeStudents.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      for (let i = 0; i < numSlices; i++) {
        const angle = currentAngle + i * sliceAngle;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px "Kantumruy Pro"';
        
        let name = activeStudents[i].name;
        if (name.length > 16) name = name.substring(0, 14) + '...';
        
        ctx.fillText(name, radius - 15, 5);
        ctx.restore();
      }

      // Center Hub
      ctx.beginPath();
      ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function spinWheel() {
      isRunning = true;
      document.getElementById('actionBtn').disabled = true;

      const spinAngle = Math.random() * 12 + 30; // 30-42 turns
      const duration = 8000; // 8 Seconds
      const startTime = performance.now();
      const startAngle = currentAngle;
      const targetAngle = startAngle + spinAngle * Math.PI * 2;

      let lastSliceIndex = -1;

      function animateWheel(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 4.5);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;

        const numSlices = activeStudents.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
        const adjustedAngle = (normalizedAngle + 1.5 * Math.PI) % (2 * Math.PI);
        const currentSliceIndex = Math.floor(adjustedAngle / sliceAngle);

        if (currentSliceIndex !== lastSliceIndex) {
          playTickSound();
          lastSliceIndex = currentSliceIndex;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateWheel);
        } else {
          isRunning = false;
          document.getElementById('actionBtn').disabled = false;
          const winner = activeStudents[currentSliceIndex];
          playWinSound();
          fetchWinnerDetailsAndShow(winner, "🎡 អ្នកឈ្នះកង់វិល!");
        }
      }

      requestAnimationFrame(animateWheel);
    }

    /* ----------------------------------------------------
       2. KHMER BOAT RACE LOGIC (WITH SLOWDOWN CRAWL)
    ---------------------------------------------------- */
    function initBoatRace() {
      boatPositions = activeStudents.map((st, i) => ({
        student: st,
        x: 45,
        color: PALETTE[i % PALETTE.length]
      }));
    }

    function drawBoatRace() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      if (activeStudents.length === 0) {
        drawEmptyState(ctx, w, h);
        return;
      }

      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      for (let y = 20; y < h; y += 35) {
        ctx.beginPath();
        for (let x = 0; x < w; x += 40) {
          ctx.quadraticCurveTo(x + 10, y - 5, x + 20, y);
          ctx.quadraticCurveTo(x + 30, y + 5, x + 40, y);
        }
        ctx.stroke();
      }

      const finishX = w - 65;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(finishX, 0, 10, h);
      ctx.fillStyle = '#ef4444';
      for (let y = 0; y < h; y += 20) {
        ctx.fillRect(finishX, y, 10, 10);
      }

      const numBoats = boatPositions.length;
      const laneHeight = h / numBoats;

      boatPositions.forEach((boat, idx) => {
        const laneY = idx * laneHeight + laneHeight / 2;

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, idx * laneHeight);
        ctx.lineTo(w, idx * laneHeight);
        ctx.stroke();

        const x = boat.x;
        ctx.fillStyle = boat.color;
        
        ctx.beginPath();
        ctx.moveTo(x - 30, laneY - 4);
        ctx.lineTo(x + 15, laneY - 4);
        ctx.quadraticCurveTo(x + 30, laneY, x + 25, laneY + 8);
        ctx.lineTo(x - 25, laneY + 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(x + 25, laneY + 1, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px "Kantumruy Pro"';
        ctx.textAlign = 'right';
        let name = boat.student.name;
        if (name.length > 12) name = name.substring(0, 10) + '...';
        ctx.fillText(name, x - 35, laneY + 4);
      });
    }

    function startBoatRace() {
      isRunning = true;
      document.getElementById('actionBtn').disabled = true;
      initBoatRace();

      const canvas = document.getElementById('gameCanvas');
      const finishX = canvas.width - 65;
      let winner = null;

      function animateBoatRace() {
        let isFinished = false;

        boatPositions.forEach((boat) => {
          let distLeft = finishX - boat.x;
          let speedFactor = distLeft > 180 ? 1 : Math.max(0.08, distLeft / 200);

          const delta = (Math.random() * 1.8 + 0.4) * speedFactor;
          boat.x += delta;

          if (boat.x >= finishX && !winner) {
            winner = boat.student;
            isFinished = true;
          }
        });

        drawBoatRace();

        if (Math.random() < 0.2) playTickSound();

        if (!isFinished) {
          requestAnimationFrame(animateBoatRace);
        } else {
          isRunning = false;
          document.getElementById('actionBtn').disabled = false;
          playWinSound();
          fetchWinnerDetailsAndShow(winner, "🚣 ជ័យលាភីប្រណាំងទូកង!");
        }
      }

      requestAnimationFrame(animateBoatRace);
    }

    /* ----------------------------------------------------
       3. CAR RACE LOGIC
    ---------------------------------------------------- */
    function initCarRace() {
      carPositions = activeStudents.map((st, i) => ({
        student: st,
        x: 45,
        color: PALETTE[i % PALETTE.length]
      }));
    }

    function drawCarRace() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      if (activeStudents.length === 0) {
        drawEmptyState(ctx, w, h);
        return;
      }

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, w, h);

      for (let x = 0; x < w; x += 20) {
        ctx.fillStyle = (Math.floor(x / 20) % 2 === 0) ? '#ef4444' : '#ffffff';
        ctx.fillRect(x, 0, 20, 6);
        ctx.fillRect(x, h - 6, 20, 6);
      }

      const finishX = w - 65;
      const squareSize = 10;
      for (let y = 6; y < h - 6; y += squareSize) {
        for (let col = 0; col < 2; col++) {
          const isWhite = ((Math.floor(y / squareSize) + col) % 2 === 0);
          ctx.fillStyle = isWhite ? '#ffffff' : '#000000';
          ctx.fillRect(finishX + col * squareSize, y, squareSize, squareSize);
        }
      }

      const numCars = carPositions.length;
      const laneHeight = (h - 12) / numCars;

      carPositions.forEach((car, idx) => {
        const laneY = 6 + idx * laneHeight + laneHeight / 2;

        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(0, 6 + idx * laneHeight);
        ctx.lineTo(w, 6 + idx * laneHeight);
        ctx.stroke();
        ctx.setLineDash([]);

        const x = car.x;

        ctx.fillStyle = car.color;
        ctx.fillRect(x - 26, laneY - 7, 34, 14);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x - 14, laneY - 5, 16, 10);

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(x - 2, laneY - 4, 3, 8);

        ctx.fillStyle = '#000000';
        ctx.fillRect(x - 20, laneY - 9, 8, 3);
        ctx.fillRect(x + 0, laneY - 9, 8, 3);
        ctx.fillRect(x - 20, laneY + 6, 8, 3);
        ctx.fillRect(x + 0, laneY + 6, 8, 3);

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(x + 7, laneY - 5, 2, 3);
        ctx.fillRect(x + 7, laneY + 2, 2, 3);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px "Kantumruy Pro"';
        ctx.textAlign = 'right';
        let name = car.student.name;
        if (name.length > 12) name = name.substring(0, 10) + '...';
        ctx.fillText(name, x - 32, laneY + 4);
      });
    }

    function startCarRace() {
      isRunning = true;
      document.getElementById('actionBtn').disabled = true;
      initCarRace();

      const canvas = document.getElementById('gameCanvas');
      const finishX = canvas.width - 65;
      let winner = null;

      function animateCarRace() {
        let isFinished = false;

        carPositions.forEach((car) => {
          let distLeft = finishX - car.x;
          let speedFactor = distLeft > 180 ? 1 : Math.max(0.08, distLeft / 200);

          const delta = (Math.random() * 2.0 + 0.5) * speedFactor;
          car.x += delta;

          if (car.x >= finishX && !winner) {
            winner = car.student;
            isFinished = true;
          }
        });

        drawCarRace();

        if (Math.random() < 0.2) playTickSound();

        if (!isFinished) {
          requestAnimationFrame(animateCarRace);
        } else {
          isRunning = false;
          document.getElementById('actionBtn').disabled = false;
          playWinSound();
          fetchWinnerDetailsAndShow(winner, "🏎️ ជ័យលាភីប្រណាំងឡាន!");
        }
      }

      requestAnimationFrame(animateCarRace);
    }

    function drawEmptyState(ctx, w, h) {
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#64748b';
      ctx.font = '15px "Kantumruy Pro"';
      ctx.textAlign = 'center';
      ctx.fillText('សូមជ្រើសរើសសិស្សយ៉ាងហោច 1 នាក់', w / 2, h / 2);
    }

    /* ----------------------------------------------------
       COMMON WINNER POPUP & APPS SCRIPT HANDLERS
    ---------------------------------------------------- */
    function fetchWinnerDetailsAndShow(winner, titleText) {
      document.getElementById('winnerBadge').textContent = titleText || "អ្នកទទួលបានវេន";
      document.getElementById('winnerName').textContent = winner.name;
      document.getElementById('winnerClass').textContent = "ថ្នាក់: " + (winner.className || "គ្មានថ្នាក់");
      
      const photoEl = document.getElementById('winnerPhoto');
      photoEl.src = "https://via.placeholder.com/100?text=Student";

      google.script.run
        .withSuccessHandler(function(details) {
          if (details && (details.imageUrl || details.photoUrl)) {
            photoEl.src = details.imageUrl || details.photoUrl;
          }
        })
        .withFailureHandler(function() {
          // Keep default placeholder
        })
        .getStudentDetailsByRow(winner.rowNum);

      document.getElementById('winnerModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.remove('active');
    }
  </script>
</body>
